<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Build It Yourself</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: calm reading app. Light by default, plain background, sticky top bar, lesson index on the left, reading column beside a light code workbench. */
:root{
  --paper:#f8f9fb; --surface:#ffffff; --sunk:#eceff4; --ink:#1d2433; --muted:#525c70; --line:#c9d1dd;
  --accent:#2a4bd7; --accent-soft:#e6ebfc; --on-accent:#ffffff;
  --mark:#ffe066; --mark-under:#ffe58a; --on-mark:#231c00;
  --good:#177a4f; --good-soft:#e1f3e9; --bad:#b8392f; --bad-soft:#fbe6e3; --warn:#7a5400; --warn-soft:#fff5d6;
  --code-bg:#e3e9f6; --code-bar:#d5ddee; --code-fg:#1d2433; --code-muted:#535d72; --code-line:#aebbd6;
  --page-white:#ffffff;
  --f-ui:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --r:10px;
  color-scheme:light;
}
:root.theme-dark{
  --paper:#14181f; --surface:#1b2029; --sunk:#232935; --ink:#e6e9ef; --muted:#a3abba; --line:#313848;
  --accent:#8ba3ff; --accent-soft:#232c4a; --on-accent:#10131a;
  --mark:#ffd84a; --mark-under:rgba(255,216,74,.32); --on-mark:#231c00;
  --good:#64d29f; --good-soft:#15301f; --bad:#ff8b80; --bad-soft:#3a1916; --warn:#f2c14e; --warn-soft:#332a10;
  --code-bg:#171b23; --code-bar:#1f2430; --code-fg:#e6e9ef; --code-muted:#8a93a6; --code-line:#2c3342;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--f-ui); font-size:17px; line-height:1.6;
  
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code,kbd,pre,textarea,.mono{font-family:var(--f-code);}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0}
.os-is-mac .os-win,.os-is-win .os-mac{display:none!important}
.mark{background:linear-gradient(transparent 58%,var(--mark-under) 58%);padding:0 .08em}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;text-decoration:none;color:var(--ink);white-space:nowrap;background:none;border:0;padding:0;font-size:1.05rem}
.brand-mark{font-family:var(--f-code);background:var(--mark);color:var(--on-mark);padding:1px 7px;border-radius:6px;font-weight:700;font-size:.95rem}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:600;white-space:nowrap;font-size:.92rem}
.tab:hover{color:var(--ink);background:var(--sunk)}
.tab.on{color:var(--ink);background:var(--accent-soft)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:2px;flex:none}
.seg button{border:0;background:none;padding:4px 11px;border-radius:7px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.theme-btn{flex:none;border:1px solid var(--line);background:var(--sunk);color:var(--ink);padding:5px 12px;border-radius:9px;font-size:.85rem;font-weight:700}
.theme-btn:hover{border-color:var(--muted)}
@media (max-width:420px){ .brand-text{display:none} }
@media (max-width:760px){
  .top{position:static}
  .top-inner{flex-wrap:wrap;gap:8px 10px}
  .tabs{-webkit-mask-image:linear-gradient(to right,#000 85%,transparent);mask-image:linear-gradient(to right,#000 85%,transparent)}
  .theme-btn{padding:5px 10px}
  .help-float{padding:8px 14px;font-size:.9rem}
  .tabs{order:3;flex-basis:100%;margin:0 -6px}
  .brand{flex:1}
}

/* page frame */
main{max-width:1500px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-code);text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;color:var(--muted);margin:0 0 8px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:600;font-size:.93rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.good{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.pill.done{background:var(--good-soft);color:var(--good)}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* home */
.home{display:grid;gap:40px;max-width:1100px}
.hero h1{font-size:clamp(2rem,4.6vw,3.3rem);font-weight:850;letter-spacing:-.01em;max-width:18ch}
.lede{font-size:1.12rem;color:var(--muted);max-width:60ch;margin:16px 0 22px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hero-actions .btn.primary{padding:11px 18px;font-size:1rem}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:6px;align-content:start}
.stat b{font-size:1.9rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.9rem}
@media (max-width:640px){.stats{grid-template-columns:1fr}}
.path h2,.home-two h2{font-size:1.4rem;margin-bottom:14px}
.mods{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.mod-row{display:grid;grid-template-columns:3.2rem minmax(0,1fr) 150px;gap:16px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.mod-row:hover{background:var(--surface)}
.mod-num{font-family:var(--f-code);color:var(--muted);font-size:.9rem}
.mod-row h3{font-size:1.06rem;font-weight:750}
.mod-row p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.mod-prog{display:grid;gap:6px;font-size:.8rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.mod-row.complete .mod-num{color:var(--good)}
@media (max-width:640px){.mod-row{grid-template-columns:2.4rem minmax(0,1fr)}.mod-prog{grid-column:2;text-align:left}}
.home-two{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.home-two{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.home-two{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h2{font-size:1.15rem;margin-bottom:8px}
.panel p{margin:0 0 14px;color:var(--muted)}

/* learn layout */
.learn{display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
@media (min-width:1000px){.learn{grid-template-columns:270px minmax(0,1fr)}}
.side{display:none}
@media (min-width:1000px){.side{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow-y:auto;padding-right:6px}.side-toggle,.side-drop{display:none!important}}
.side-toggle{width:100%;justify-content:space-between;margin-bottom:12px}
.side-drop{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:16px;max-height:60vh;overflow-y:auto}
.nav-mod{margin:0 0 14px}
.nav-mod h4{margin:0 0 4px;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-family:var(--f-code);font-weight:600}
.nav-mod ul{list-style:none;margin:0;padding:0}
.nav-l{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:5px 8px;border-radius:7px;font-size:.9rem;line-height:1.35;color:var(--ink)}
.nav-l:hover{background:var(--sunk)}
.nav-l.cur{background:var(--accent-soft);font-weight:700}
.nav-l .d{flex:none;width:15px;height:15px;margin-top:2px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;line-height:1}
.nav-l.done .d{background:var(--good);border-color:var(--good);color:var(--surface)}

.lesson-head{margin-bottom:22px;display:grid;gap:8px}
.lesson-head h1{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:850;}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:.88rem}
.lesson-grid{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1260px){.lesson-grid.has-bench{grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr)}.bench-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;max-height:calc(100vh - 92px);overflow-y:auto}}
.reading{max-width:68ch;min-width:0}
.reading > p,.reading li{font-size:1.02rem}
.reading h3{font-size:1.15rem;font-weight:780;margin:28px 0 8px}
.reading ul,.reading ol{padding-left:1.3em}
.reading li{margin:4px 0}
.reading p{margin:0 0 14px}
.reading :not(pre) > code,.task :not(pre) > code,.checks code,.ref-table code,.dec code,.proj code{background:var(--sunk);border:1px solid var(--line);padding:0 5px;border-radius:5px;font-size:.88em}
kbd{font-size:.8em;background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;padding:0 6px;border-radius:5px;white-space:nowrap}
.tip{border:1px solid var(--mark);border-left:4px solid var(--mark);background:var(--warn-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:0 0 16px;font-size:.96rem}
.code-block{position:relative;background:var(--code-bg);color:var(--code-fg);border:1px solid var(--code-line);border-radius:var(--r);margin:0 0 16px;overflow:hidden}
.code-block pre{margin:0;padding:14px 16px;overflow-x:auto;font-size:.86rem;line-height:1.6}
.code-label{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--code-muted);padding:8px 16px 0;font-family:var(--f-code);}
.copy{position:absolute;top:6px;right:6px;background:var(--code-bar);border:1px solid var(--code-line);color:var(--code-fg);font-size:.75rem;padding:2px 9px;border-radius:6px;opacity:.85}
.copy:hover{opacity:1}
.c-cmt{color:var(--code-muted)}

/* steps & quiz */
.block{margin:26px 0 0;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.block h3{margin:0 0 4px;font-size:1.05rem}
.block > p{margin:0 0 10px;color:var(--muted);font-size:.92rem}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.steps label{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-radius:7px;cursor:pointer}
.steps label:hover{background:var(--sunk)}
.steps input{margin-top:5px;accent-color:var(--good);width:16px;height:16px;flex:none}
.steps input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q-text{font-weight:650;margin:0 0 8px}
.opts{display:grid;gap:6px}
.opt{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.95rem}
.opt:hover{border-color:var(--muted)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.why{margin:8px 0 0;font-size:.92rem;color:var(--muted)}
.why b{color:var(--ink)}

/* task panel */
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.task-h{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;font-family:var(--f-code);color:var(--accent);margin:0 0 6px;font-weight:700}
.task-text p{margin:0 0 10px}
.checks{list-style:none;margin:12px 0 14px;padding:0;display:grid;gap:6px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:.94rem;line-height:1.4}
.ck{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px dashed var(--muted);display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:1px}
.checks li.pass .ck{background:var(--good);border:0;color:var(--surface)}
.checks li.pass .ck::after{content:"✓"}
.checks li.fail .ck{background:var(--bad);border:0;color:var(--surface)}
.checks li.fail .ck::after{content:"✕"}
.checks li.fail{color:var(--ink)}
.task-actions{display:flex;flex-wrap:wrap;gap:8px}
.hints{display:grid;gap:8px;margin-top:12px}
.hint{background:var(--warn-soft);border-radius:8px;padding:9px 12px;font-size:.93rem}
.hint b{font-family:var(--f-code);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;margin-right:6px;color:var(--warn)}
.confirm{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--paper)}
.confirm p{margin:0 0 10px;font-size:.93rem}
.result{margin-top:12px;font-size:.93rem;font-weight:600}
.result.ok{color:var(--good)}
.result.no{color:var(--bad)}
.win{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--good-soft);border:1px solid var(--good);border-radius:var(--r);padding:12px 16px;margin-top:12px;font-weight:650}

/* workbench */
.bench{background:var(--code-bg);border-radius:12px;overflow:hidden;color:var(--code-fg);border:1px solid var(--code-line)}
.bench-bar,.sub-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 6px 14px;background:var(--code-bar);border-bottom:1px solid var(--code-line);font-size:.8rem}
.bench-file{font-family:var(--f-code);color:var(--code-muted)}
.bench-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.bbtn{background:transparent;border:1px solid var(--code-line);color:var(--code-fg);border-radius:7px;padding:4px 10px;font-size:.8rem;font-weight:600}
.bbtn:hover{border-color:var(--code-muted)}
.bbtn.run{background:var(--mark);color:var(--on-mark);border-color:var(--mark)}
.bbtn.run kbd{background:transparent;border-color:rgba(0,0,0,.25);color:var(--on-mark);margin-left:4px;font-size:.72rem}
.bbtn.on{background:var(--code-line)}
.editor{position:relative;display:flex;height:320px;resize:vertical;overflow:hidden;min-height:160px}
.gutter{margin:0;padding:12px 8px 12px 0;width:42px;flex:none;text-align:right;color:var(--code-muted);font-size:15px;line-height:24px;overflow:hidden;user-select:none;opacity:.7;border-right:1px solid var(--code-line)}
.editor textarea{flex:1;min-width:0;border:0;outline:none;resize:none;background:transparent;color:var(--code-fg);padding:12px 12px 12px 12px;font-size:15px;line-height:24px;white-space:pre;overflow:auto;tab-size:2;caret-color:var(--accent)}
.editor textarea:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
@media (max-width:600px){.editor textarea,.gutter{font-size:16px;line-height:24px}}
.ed-note{font-size:.72rem;color:var(--code-muted);padding:4px 14px;border-top:1px solid var(--code-line)}
.preview-wrap{background:var(--sunk);padding:10px;border-top:1px solid var(--code-line)}
.preview-wrap iframe{display:block;width:100%;height:300px;border:0;border-radius:6px;background:var(--page-white);margin:0 auto;transition:width .2s}
.preview-wrap.phone iframe{width:375px;max-width:100%;height:440px}
@media (prefers-reduced-motion:reduce){.preview-wrap iframe{transition:none}}
.console{max-height:220px;min-height:64px;overflow-y:auto;padding:8px 0;font-family:var(--f-code);font-size:.84rem}
.c-empty{color:var(--code-muted);padding:4px 14px;font-size:.8rem}
.c-line{padding:3px 14px;white-space:pre-wrap;word-break:break-word;border-bottom:1px solid var(--code-line)}
.c-line.error{color:var(--bad);background:var(--bad-soft)}
.c-line.warn{color:var(--warn)}
.c-line.info{color:var(--code-muted)}
.c-line .ln{float:right;color:var(--code-muted);font-size:.75rem;margin-left:10px}
.c-help{font-family:var(--f-ui);color:var(--code-fg);font-size:.83rem;padding:6px 14px 8px;border-bottom:1px solid var(--code-line);background:var(--warn-soft)}
.c-help b{color:var(--warn)}
.c-help button{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-size:inherit}

/* lesson foot */
.lesson-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}
.lesson-foot .mid{display:flex;gap:10px;flex-wrap:wrap}
.nb{max-width:48%;display:inline-flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left}
.nb small{font-weight:500;color:var(--muted);font-size:.75rem}
.nb.next{align-items:flex-end;text-align:right;margin-left:auto}
@media (max-width:600px){.nb{max-width:100%;flex:1}}

/* generic page */
.page{max-width:1000px;display:grid;gap:24px}
.page-head h1{font-size:clamp(1.8rem,3.6vw,2.5rem);font-weight:850;}
.page-head p{color:var(--muted);max-width:62ch;margin:10px 0 0}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.proj summary{list-style:none;cursor:pointer;padding:18px 20px;display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto;gap:14px;align-items:center}
.proj summary::-webkit-details-marker{display:none}
.proj-num{font-family:var(--f-code);font-size:1.3rem;font-weight:700;color:var(--accent)}
.proj summary h2{font-size:1.15rem;font-weight:780}
.proj summary p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.proj-prog{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;display:grid;gap:5px;min-width:90px}
.proj-body{padding:0 20px 20px;display:grid;gap:18px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:760px){.proj-body{grid-template-columns:1fr}.proj summary{grid-template-columns:2rem minmax(0,1fr)}.proj-prog{grid-column:2;text-align:left}}
.proj-body h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;font-family:var(--f-code);font-weight:600}
.proj-body ul{margin:0;padding-left:1.2em}
.proj-body li{margin:3px 0;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--ink)}
.ref-tabs{display:flex;flex-wrap:wrap;gap:6px}
.ref-tabs .btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ref-table{width:100%;border-collapse:collapse;font-size:.93rem}
.ref-table th,.ref-table td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}

body:`This app is a course, a code playground and a reference book in one. Work through the lessons in order. Most take 10 to 25 minutes.

## How a lesson works
- **Read** the short explanation.
- **Do** the task in the code editor. Press **Run** (or {{K}} + Enter) to see what your code does.
- **Check my work** tests your code against the task list. When every item is green, the lesson is done.
- **Hints** appear one at a time. The solution is there too, but it asks you to try a little longer first.

## When you're lost
Every lesson has an **Ask for help** button, at the top and at the bottom. Type what's confusing in your own words, or paste a screenshot, and you'll get an answer about that exact lesson, for your computer.
- For **setting up your computer**, it walks you through exactly what to click and type.
- For **coding exercises**, it explains and gives hints rather than handing over the answer, because working it out is what makes the skill stick. If you really want the answer, ask for it.

Setup lessons also end with an **If something goes wrong** section listing the usual problems and fixes.

Being stuck is normal: working developers are stuck for part of every day. As you get more confident, try the **I'm stuck** page in the top bar first. It's a routine for getting yourself unstuck, which is the skill that makes you independent.

> Your progress and code are saved in this browser on this device. If you clear your browser data or switch computers, they won't come with you.

## What you'll be able to do at the end
Plan an app, build its screens with HTML, CSS and JavaScript, do the real work behind them in Python (files, spreadsheets, images, PDFs), debug it, look up anything you don't know in the documentation, and package it as a desktop app your team can install and update. You'll also know how online apps work and how to build one safely, and the rules and ethics that come with handling other people's data. Along the way you'll take the **Artona Digital Suite** apart to learn from a real app: why each piece is there, and how to use the same ideas in your own.

## A realistic pace
Short daily sessions beat long weekend ones because you forget less in between. About six months at 30 minutes a day, five days a week, plus the projects. The Python half takes longer than the web half; that's normal.`,
steps:["Pick Mac or Windows in the top right. Instructions throughout the course change to match.","Scroll to the bottom of this lesson and find the Ask for help box.","Choose a daily practice time and put it in your calendar."] },

{ id:"what-is-code", title:"What code actually is", mins:8, kind:"read",
body:`Code is a set of instructions written precisely enough for a computer to follow. Computers are fast but completely literal. They do exactly what you write, never what you meant.

Think of a recipe. "Add some salt" works for a person, because people fill gaps with common sense. A computer needs "add 5 grams of salt, then stir for 30 seconds". Programming languages are ways of writing instructions that exact.

## The three languages of the web
Every website and every app you'll build in this course uses the same three languages, each with its own job:
- **HTML** describes *what's on the page*: headings, paragraphs, buttons, images. Think of it as the nouns.
- **CSS** describes *how it looks*: colors, fonts, spacing, layout. The adjectives.
- **JavaScript** describes *what happens*: clicking a button, saving a note, loading data. The verbs.

~~~html
<button id="hello">Say hi</button>           <!-- HTML: there is a button -->
~~~
~~~css
#hello { background: gold; }                 /* CSS: the button is gold */
~~~
~~~js
document.querySelector("#hello")             // JS: when clicked, show a message
  .addEventListener("click", () => console.log("Hi!"));
~~~

## Bugs are normal
A bug is when the computer did what you wrote instead of what you meant. Everyone writes bugs all day, including people with 20 years of experience. Finding and fixing them is most of the job, and this course teaches you how.`,
quiz:[
 {q:"Which language decides what happens when someone clicks a button?", o:["HTML","CSS","JavaScript"], a:2, why:"JavaScript handles behavior. HTML puts the button on the page and CSS styles it."},
 {q:"Your page shows the right words, but the font and colors are wrong. Which language do you change?", o:["HTML","CSS","JavaScript"], a:1, why:"Anything about appearance is CSS."},
 {q:"What does a bug usually mean?", o:["You're not cut out for coding","The computer did exactly what you wrote, which wasn't what you meant","The computer is broken"], a:1, why:"Bugs are a gap between what you wrote and what you meant. Every developer hits them constantly."}
]},

{ id:"how-apps-fit", title:"How web and desktop apps fit together", mins:8, kind:"read",
body:`When you open a website, your browser downloads files from a computer somewhere else, called a **server**. Those files are HTML, CSS and JavaScript. The browser reads them and draws the page.

- The **front end** is everything that runs in the browser: what you see and click.
- The **back end** is code on a server: storing accounts, sending emails, keeping data that many people share.

This course focuses on the front end, because that's what you need to build working apps for yourself, and it's the foundation for everything else.

## Desktop apps are often web pages in a window
Many apps you install on a Mac or Windows PC show their screens with exactly the same HTML, CSS and JavaScript. Teams, VS Code, Slack and Obsidian all work this way.

The **Artona Digital Suite** does too. Its window is an HTML page, and behind it is **Python**, which does the real work: copying photos, reading class lists, laying out print sheets, matching faces. A library called **pywebview** joins the two halves into one desktop app.

So this course teaches both: the web languages for the screen, then Python for the work, then how to put them together into a desktop app like the suite.

## The road ahead
1. Set up your tools (code editor, terminal, Node.js, Git)
2. HTML, then CSS
3. GitHub: how developers save and share code
4. JavaScript, then JavaScript in the browser: making pages respond
5. Thinking like a developer: planning, debugging, reading docs
6. Real project tooling: packages, modules, frameworks
7. Python, then Python for real work: files, spreadsheets, images and PDFs
8. Desktop apps with Python, and images and AI tools
9. Learn from the Artona Digital Suite: take a real app apart and understand why it's built the way it is
10. Building for the web: servers, databases, logins and hosting
11. Context, law and ethics: privacy, children's data, copyright, accessibility, AI, and what's allowed at work
12. Your projects: a mini suite of your own, an online app, and the app you actually want`,
quiz:[
 {q:"In the Artona Digital Suite, what does the work behind the window, like copying and renaming photos?", o:["HTML","CSS","Python"], a:2, why:"The window is HTML, CSS and JavaScript; Python does the work behind it."},
 {q:"Which of these is part of the front end?", o:["The button you click on a web page","A database storing everyone's accounts","A server sending password-reset emails"], a:0, why:"Front end = what runs in the browser. The other two happen on a server."}
]}
]},

{ id:"tools", title:"Your tools", blurb:"Set up the editor, terminal, Node.js and Git on your own computer.", lessons:[
{ id:"vscode", title:"Install a code editor", mins:20, kind:"read",
body:`A code editor is where you'll write all your code. It's like a word processor for code: it colors your code so it's easier to read and points out mistakes. We'll use **Visual Studio Code** ("VS Code"). It's free.

> Get lost at any point? Scroll to **Ask for help** at the bottom of this lesson, say what you see, and paste a screenshot if you can.

## Step 1: Download it
1. Go to [code.visualstudio.com](https://code.visualstudio.com).
2. Click the big blue **Download** button. The site picks the right version for your computer.

::: mac
## Step 2: Install it
1. Open your **Downloads** folder. (In Finder, click **Downloads** in the sidebar.)
2. If you see a file ending in **.zip**, double-click it. It turns into an app called **Visual Studio Code**.
3. Drag **Visual Studio Code** onto **Applications** in the Finder sidebar.
4. Click **Applications** and double-click **Visual Studio Code**.
5. If your Mac asks "Are you sure you want to open it?", click **Open**.

**You should see:** a window with a **Welcome** tab.
:::

::: win
## Step 2: Install it
1. Open your **Downloads** folder and double-click the file called something like **VSCodeUserSetup-x64.exe**.
2. Choose **I accept the agreement**, then keep clicking **Next**.
3. On the screen called **Select Additional Tasks**, tick all four boxes. The important one is **Add to PATH**: it lets you open VS Code by typing a command later.
4. Click **Next**, **Install**, then **Finish**.

**You should see:** a window with a **Welcome** tab.
:::

## Step 3: Find your way around
- The **icon bar** runs down the left edge. The top icon (two sheets of paper) is the **Explorer**, which shows your files. The icon made of four small squares is **Extensions**.
- The **middle** is where files open for editing.
- The **terminal** (a place to type commands) opens at the bottom when you choose **View > Terminal** from the menu. You'll use it in a later lesson.

## Step 4: Add three extensions
Extensions are free add-ons that give VS Code extra features.
1. Click the **Extensions** icon (four small squares) on the left.
2. In the search box at the top of that panel, type **Prettier**.
3. Click **Prettier - Code formatter** in the list, then click the blue **Install** button.
4. Do the same for **Live Server** and **Error Lens**.

**You should see:** each one's button change from **Install** to a gear icon. That means it's installed.

## Step 5: Tidy your code automatically
1. Open Settings: {{click Code > Settings > Settings in the menu bar|click File > Preferences > Settings}}.
2. In the search box at the top, type **format on save**. Tick the box under **Editor: Format On Save**.
3. Clear the search box, type **default formatter**, and choose **Prettier - Code formatter** from the dropdown.

Now every time you save, Prettier straightens out your spacing.

::: mac
## Step 6: Let the terminal open VS Code
1. Press **Cmd + Shift + P**. A search box appears at the top of the window.
2. Type **shell command**.
3. Click **Shell Command: Install 'code' command in PATH**.

**You should see:** a message saying the command was installed. If it asks for a password, type your Mac login password.
:::

> Leave AI autocomplete extensions (like Copilot) off while you learn. When an extension writes whole lines for you, you skip the part where your brain does the work.

## If something goes wrong
- **Mac says the app "can't be opened":** move it to Applications first (Step 2), then right-click it and choose **Open**.
- **An extension doesn't show up when you search:** check the spelling, and make sure you're in the Extensions panel (four squares), not the file Explorer.
- **You can't find the Settings menu:** press {{Cmd + ,|Ctrl + ,}} (the comma key) instead.
- **Anything else:** use **Ask for help** below.`,
steps:["Install VS Code and open it","Install Prettier, Live Server and Error Lens","Turn on Format On Save and set Prettier as the default formatter","{{Install the 'code' command (Step 6)|Make sure you ticked Add to PATH during install}}"] },

{ id:"files-paths", title:"Files, folders and paths", mins:15, kind:"read",
body:`Every file on your computer lives in a folder, and folders live inside other folders. In this lesson you'll set up a folder for all your projects and learn how code refers to files.

## Step 1: Show file extensions
The **extension** is the end of a file's name after the dot: **.html**, **.css**, **.js**. It tells the computer what kind of file it is. Both Mac and Windows hide extensions by default, which causes confusing mistakes like a file secretly called **index.html.txt**. Turn them on:

::: mac
1. Click on the desktop so **Finder** is the active app (it says **Finder** next to the Apple menu).
2. In the menu bar choose **Finder > Settings** (called **Preferences** on older Macs), then click the **Advanced** tab.
3. Tick **Show all filename extensions**.
:::

::: win
1. Open **File Explorer** (the yellow folder icon on the taskbar).
2. Click **View** at the top, then **Show**, then click **File name extensions** so it has a tick. (On Windows 10: click the **View** tab and tick **File name extensions**.)
:::

## Step 2: Make a Projects folder
Every project in this course will go inside one folder called **Projects**, in your **home folder** (the folder with your name on it).

::: mac
1. In Finder, press **Cmd + Shift + H** to go to your home folder. It has a house icon and your name.
2. Choose **File > New Folder**, type **Projects**, and press Return.
:::

::: win
1. In File Explorer, click in the address bar at the top, type **%USERPROFILE%** and press Enter. This is your home folder.
2. Right-click an empty space, choose **New > Folder**, type **Projects**, and press Enter.
:::

**You should see:** a folder called **Projects** next to folders like Desktop, Documents and Downloads.

## What a path is
A **path** is a file's address: the list of folders you go through to reach it.

[mac] On a Mac, a path looks like [[/Users/sam/Projects/my-site/index.html]]. That reads: start at the top, go into Users, then sam, then Projects, then my-site, and there's index.html.

[win] On Windows, a path looks like [[C:\\Users\\sam\\Projects\\my-site\\index.html]]. That reads: start at the C drive, go into Users, then sam, then Projects, then my-site, and there's index.html.

## Paths inside your code
In your code, you'll usually give directions **from the file you're in**, not the full address. These are called **relative paths**, and in web code they always use forward slashes, on Mac and Windows alike:
- [[style.css]]: a file in the same folder as this one
- [[images/cat.png]]: go into the images folder next to this file, and find cat.png
- [[../logo.png]]: go up one folder first, then find logo.png. Two dots always mean "the folder above"

## Naming rules that save headaches
Use lowercase letters, numbers and hyphens: [[my-first-app]], [[about.html]]. Avoid spaces (they break commands in the terminal) and capital letters (some web servers treat [[About.html]] and [[about.html]] as different files).`,
quiz:[
 {q:"index.html and a folder called css sit side by side. The stylesheet is inside: css/style.css. What path goes in index.html?", o:["style.css","css/style.css","../css/style.css"], a:1, why:"From index.html, go into the css folder, then find the file."},
 {q:"What does .. mean in a path?", o:["The current folder","The folder above this one","Your home folder"], a:1, why:".. always means one level up."},
 {q:"Why avoid spaces in file names?", o:["They make files bigger","They break terminal commands and web addresses","Computers can't save them"], a:1, why:"A space separates parts of a command, so 'my site' looks like two separate things. Hyphens avoid the problem."}
],
steps:["Turn on file extensions","Make a Projects folder in your home folder"] },

{ id:"terminal", title:"The terminal", mins:25, kind:"read",
body:`The **terminal** is a window where you control your computer by typing commands instead of clicking. Almost every developer tool is run from it, so you'll use it a lot. It looks old-fashioned, but you only need a handful of commands, and you'll learn them here one at a time.

## Step 1: Open it
[mac] Press **Cmd + Space** to open Spotlight search, type **Terminal**, and press Return.

[win] Click the **Start** button, type **PowerShell**, and click **Windows PowerShell**.

**You should see:** a window with a line of text ending in a symbol and a blinking cursor. That line is the **prompt**. It's waiting for you to type.

[mac] It looks something like [[sam@MacBook ~ %]]. The [[~]] means you're in your home folder.

[win] It looks something like [[PS C:\\Users\\sam>]]. The path tells you which folder you're in.

## Step 2: Ask where you are
Type this and press Enter:
~~~sh
pwd
~~~
**You should see:** your home folder's path, like {{/Users/sam|C:\\Users\\sam}}. ("pwd" stands for "print working directory". Directory is another word for folder.)

## Step 3: Look around
~~~sh
ls
~~~
**You should see:** the folders in your home folder, including **Projects** from the last lesson.

[win] PowerShell shows them as a table with columns like Mode and LastWriteTime. You only need the **Name** column.

## Step 4: Go into a folder
~~~sh
cd Projects
~~~
"cd" means "change directory". **You should see:** the prompt change to show **Projects**. Nothing else is printed. In the terminal, **no message usually means it worked**.

## Step 5: Make a folder for your first site
~~~sh
mkdir first-site
cd first-site
~~~
The first line makes a folder ("make directory"), the second goes into it.

[win] After [[mkdir]], PowerShell prints a small table about the new folder. That's normal.

## Step 6: Open it in VS Code
~~~sh
code .
~~~
The dot means "this folder". **You should see:** VS Code open, with **FIRST-SITE** at the top of the Explorer on the left.

## The commands you'll use most
~~~mac
pwd                # where am I?
ls                 # what's in this folder?
cd Projects        # go into a folder
cd ..              # go up one level
mkdir hello        # make a new folder
code .             # open this folder in VS Code
clear              # clean up the screen
~~~
~~~win
pwd                # where am I?
ls                 # what's in this folder?
cd Projects        # go into a folder
cd ..              # go up one level
mkdir hello        # make a new folder
code .             # open this folder in VS Code
cls                # clean up the screen
~~~
The parts after [[#]] are notes for you. Don't type them.

## Shortcuts that make it easier
- Press **Tab** to finish a folder name for you: type [[cd Pro]] and press Tab.
- Press the **up arrow** to bring back the last command.
- Press **Ctrl + C** to stop something that's running. (This is Ctrl on Macs too, not Cmd.)
- VS Code has its own terminal: **View > Terminal**. It opens already inside your project folder, which saves typing [[cd]].

## If something goes wrong
- **{{"zsh: command not found: code"|"code is not recognized"}}:** {{go back to Step 6 of the VS Code lesson and install the 'code' command, then close and reopen the terminal|reinstall VS Code and tick Add to PATH, then close and reopen PowerShell}}. Until then, open the folder from VS Code with **File > Open Folder**.
- **"No such file or directory" or "Cannot find path":** the folder name is spelled differently, or you're in a different folder than you think. Run [[pwd]] and [[ls]] to check where you are.
- **The terminal seems stuck:** press **Ctrl + C**.
- **Anything else:** use **Ask for help** below. A screenshot of the terminal helps a lot.

> Nothing in this lesson can harm your computer. Be careful only with commands you don't understand, especially anything containing {{sudo or rm -rf|Remove-Item -Recurse}}. If a tutorial asks for one, look it up first.`,
steps:["Open the terminal","Run pwd and ls to look around","cd into Projects","Make a first-site folder and cd into it","Run code . to open it in VS Code"] },

{ id:"node", title:"Install Node.js", mins:20, kind:"read",
body:`**Node.js** lets you run JavaScript outside a web browser. You need it because most developer tools, and the desktop apps you'll build later, run on it. It also installs **npm**, a tool for adding other people's code to your projects.

## Step 1: Download it
1. Go to [nodejs.org](https://nodejs.org) and click **Download**.
2. Choose the **LTS** version if you're given a choice. LTS means "long-term support": it's the stable one.
3. Look for the ready-made installer: {{macOS Installer (.pkg)|Windows Installer (.msi)}}.

## Step 2: Install it
[mac] Open your **Downloads** folder, double-click the **.pkg** file, and click **Continue** and **Install** until it finishes. Type your Mac password if asked.

[win] Open your **Downloads** folder, double-click the **.msi** file, and click **Next** until it finishes, keeping the default options. If one screen offers "tools for native modules", leave it unticked.

## Step 3: Check it worked
A terminal only notices new programs when it starts, so first **close every terminal window**{{ (press Cmd + Q in Terminal)| }}. Then open a new one and type:
~~~sh
node -v
~~~
**You should see:** a version number like [[v22.12.0]]. Any number starting with **v** is fine.

Then:
~~~sh
npm -v
~~~
**You should see:** another number, like [[10.9.0]].

## Step 4: Talk to JavaScript directly
1. Type [[node]] and press Enter.
**You should see:** "Welcome to Node.js" and a new prompt that is just [[>]]. You're now typing JavaScript, not terminal commands.
2. Type [[2 + 2]] and press Enter. **You should see:** [[4]]
3. Type [["hi".toUpperCase()]] and press Enter. **You should see:** [['HI']]
4. Type [[.exit]] (with the dot in front) and press Enter. This takes you back to the normal terminal prompt.

## Step 5: Run JavaScript from a file
Typing into Node is good for quick tests. Real programs live in files. Here's how to write one and run it:
1. **Open your project in VS Code.** If it isn't open already, choose **File > Open Folder**, go to **Projects**, click **first-site**, and click **Open**.
2. **Make a new file.** In the Explorer on the left, hover over **FIRST-SITE** and click the **New File** icon (a page with a plus sign). Type the name **hello.js** and press Enter. The empty file opens in the middle.
3. **Add the code.** Click Copy on the box below, click inside your empty file, and paste with {{Cmd + V|Ctrl + V}}.
~~~js
console.log("Hello from Node!");
~~~
4. **Save it** with {{Cmd + S|Ctrl + S}}. A white dot on the file's tab means it isn't saved yet; it turns into an X once it's saved.
5. **Open VS Code's terminal** with **View > Terminal**. It appears at the bottom, already inside your first-site folder.
6. **Run the file.** Type this in that terminal and press Enter:
~~~sh
node hello.js
~~~
**You should see:** [[Hello from Node!]] printed underneath.

That's the whole loop: write code in a file, save, run it with [[node]]. [[console.log]] means "print this", and you'll use it constantly.

## If something goes wrong
- **"command not found: node" or "node is not recognized":** the terminal was open while you installed. Close every terminal window, open a new one and try again. If that fails, restart your computer.
- **"Cannot find module" with "hello.js" in it:** the terminal isn't in the same folder as your file, or the file has a different name. Type [[ls]]: you should see **hello.js** in the list. If you don't, either you're in the wrong folder (use [[cd]] to get to first-site) or the file is named differently.
- **Nothing happens, and the prompt is just [[>]]:** you're still inside Node from Step 4. Type [[.exit]] first, then [[node hello.js]].
- **"SyntaxError" when you type [[node hello.js]]:** same thing. You're inside Node; type [[.exit]] first.
- **Nothing prints:** check the file is saved (no white dot on its tab) and the code was pasted exactly.
- **Anything else:** use **Ask for help** below.`,
steps:["Install the LTS version of Node.js","In a new terminal, check node -v and npm -v","Try 2 + 2 inside node, then .exit","Make hello.js in first-site and run it with node hello.js"] },

{ id:"git", title:"Save your work with Git and GitHub", mins:30, kind:"read",
body:`**Git** saves snapshots of your project, called **commits**. Each one is a save point you can go back to, like a history of every version. **GitHub** is a website that stores those projects online, so you have a backup and can share your work. There's a whole module on GitHub later; this lesson just gets you set up.

## Step 1: Install Git
::: mac
1. In the terminal, type [[git --version]] and press Enter.
2. If you see a version number, Git is already installed. Skip to Step 2.
3. If a window pops up offering to install **command line developer tools**, click **Install** and wait (it can take several minutes). Then run [[git --version]] again.
:::

::: win
1. Go to [git-scm.com](https://git-scm.com), click **Download for Windows**, and run the installer.
2. Keep clicking **Next** to accept the defaults, except on the screen titled **Choosing the default editor**: pick **Use Visual Studio Code as Git's default editor**.
3. When it finishes, close PowerShell, open a new one, and type [[git --version]].
:::

**You should see:** something like [[git version 2.47.0]].

## Step 2: Tell Git your name
Git labels every snapshot with who made it. Run these three lines one at a time, using your own name and email (keep the quote marks):
~~~sh
git config --global user.name "Your Name"
git config --global user.email "you@example.com"
git config --global init.defaultBranch main
~~~
**You should see:** nothing. That means it worked. You only do this once per computer.

## Step 3: Make a GitHub account
Go to [github.com](https://github.com), click **Sign up**, and follow the steps. Use the same email as Step 2.

## Step 4: Take your first snapshot
In VS Code's terminal (**View > Terminal**), inside your **first-site** folder:
1. Turn on Git for this folder:
~~~sh
git init
~~~
**You should see:** "Initialized empty Git repository in" followed by your folder's path.
2. See what Git notices:
~~~sh
git status
~~~
**You should see:** **hello.js** in red under "Untracked files". Red means Git sees it but won't include it in the snapshot yet.
3. Include everything in the next snapshot:
~~~sh
git add .
~~~
Run [[git status]] again: **hello.js** is now green. Green means it's ready.
4. Take the snapshot, with a short note saying what it is:
~~~sh
git commit -m "First commit"
~~~
**You should see:** a line ending in "1 file changed".

## Step 5: Put it on GitHub
The easiest way is through VS Code, which signs you in to GitHub through your browser.
1. In VS Code, click the **Source Control** icon on the left. It looks like a line that splits into branches, and it's usually the third icon.
2. Click the blue **Publish Branch** button.
3. VS Code asks permission to sign in to GitHub. Click **Allow**. Your browser opens: sign in and click **Authorize**. If the browser asks to open Visual Studio Code, say yes.
4. Back in VS Code, choose **Publish to GitHub public repository**.

**You should see:** a message in the bottom-right corner with a button to open the project on GitHub. Click it to see your files on github.com.

## From now on
Each time you've made progress: [[git add .]], then [[git commit -m "Say what changed"]], then press the **Sync Changes** button in Source Control (or type [[git push]]) to send it to GitHub.

## If something goes wrong
- **"Author identity unknown":** you skipped Step 2. Do it now, then run the commit again.
- **"not a git repository":** the terminal isn't in your project folder. Use [[cd]] to get to first-site, or open the folder in VS Code and use its terminal.
- **"nothing to commit":** nothing changed since your last snapshot, or the file isn't saved yet.
- **The terminal asks for a GitHub password and won't accept it:** GitHub doesn't take your account password there. Use VS Code's **Publish Branch** or **Sync Changes** button instead; it signs in through your browser.
- **No Publish Branch button:** make sure you ran [[git init]] and made a commit first, and that the folder open in VS Code is first-site.
- **Anything else:** use **Ask for help** below.`,
steps:["Install Git and check git --version","Set your name and email","Create a GitHub account","git init, git add . and git commit in first-site","Publish it to GitHub from VS Code"] }
]},

{ id:"html", title:"HTML: structure", blurb:"Headings, text, links, images, lists and forms.", lessons:[
{ id:"html-first", title:"Your first web page", mins:12, kind:"code", mode:"html",
body:`HTML is made of **elements**. Most elements have an opening tag, some content, and a closing tag with a slash:
~~~html
<h1>This is a big heading</h1>
<p>This is a paragraph.</p>
~~~
- [[<h1>]] to [[<h6>]] are headings. [[<h1>]] is the main title; use one per page. [[<h2>]] is a section heading, and so on down.
- [[<p>]] is a paragraph.
- [[<!-- like this -->]] is a comment. The browser ignores it; it's a note for humans.

The browser doesn't care about line breaks or extra spaces in your HTML. Indent your code anyway so you (and future you) can read it.

> In this playground, the editor holds what goes inside the page. In a real file there's some setup code around it; you'll write a full file in the "Real project folder" lesson.`,
task:`Make a short page about yourself.`,
starter:`<!-- This is a comment. The browser ignores it. -->
<h1>Your name here</h1>
`,
checks:[
 ["An [[<h1>]] with your name, not the placeholder", ()=>{const h=Q('h1');return h&&TXT(h).length>0&&!/your name here/i.test(TXT(h))}],
 ["An [[<h2>]] that says About me", ()=>/about me/i.test(TXT(Q('h2')))],
 ["At least two paragraphs with text in them", ()=>QA('p').filter(p=>TXT(p).length>0).length>=2]
],
hints:["An h2 works just like an h1: <h2>About me</h2>","Each paragraph needs its own opening <p> and closing </p>."],
solution:`<h1>Sam Rivera</h1>
<h2>About me</h2>
<p>I'm learning to code so I can build my own apps.</p>
<p>I live in Vancouver and I like hiking and bad puns.</p>` },

{ id:"html-links", title:"Links and images", mins:15, kind:"code", mode:"html",
body:`Elements can have **attributes**: extra settings written inside the opening tag as [[name="value"]].

A link uses the [[<a>]] element. Its [[href]] attribute is where the link goes:
~~~html
<a href="https://example.com">Visit Example</a>
<a href="about.html">About me</a>                 <!-- another page in your project -->
<a href="https://example.com" target="_blank">Opens in a new tab</a>
~~~

An image uses [[<img>]]. It has no closing tag, because it has no text content. [[src]] is the image file and [[alt]] describes the picture for people who can't see it (screen readers read it aloud, and it shows if the image fails to load):
~~~html
<img src="images/dog.jpg" alt="A brown dog catching a frisbee" width="400">
~~~

> Good alt text says what the image shows and why it's there. "Image" or "photo" isn't useful. Leave it empty ([[alt=""]]) only for purely decorative images.

In this playground, images from the internet are blocked for safety. Instead there's one built-in picture you can use, called [[mountains.svg]]. In your own projects, [[src]] points at image files in your project folder, written the same way.`,
task:`Finish the page: link the sentence to MDN (developer.mozilla.org), make that link open in a new tab, and give the image useful alt text.`,
starter:`<h1>My favourite sites</h1>
<p>The best place to look things up: </p>

<img src="mountains.svg" width="240">
`,
checks:[
 ["A link pointing to developer.mozilla.org", ()=>QA('a').some(a=>/developer\.mozilla\.org/.test(a.getAttribute('href')||''))],
 ["The link has visible text to click", ()=>QA('a').some(a=>/mozilla/.test(a.getAttribute('href')||'')&&TXT(a).length>0)],
 ["The link opens in a new tab", ()=>QA('a').some(a=>a.getAttribute('target')==='_blank')],
 ["The image has alt text that describes it", ()=>{const i=Q('img');return i&&(i.getAttribute('alt')||'').trim().length>3}]
],
hints:["Put the <a> inside the paragraph, after the colon: <p>The best place to look things up: <a href=\"...\">MDN</a></p>","The full address is https://developer.mozilla.org","target=\"_blank\" goes inside the opening <a> tag, next to href. alt goes inside the <img> tag."],
solution:`<h1>My favourite sites</h1>
<p>The best place to look things up:
  <a href="https://developer.mozilla.org" target="_blank">MDN Web Docs</a>
</p>

<img src="mountains.svg" alt="A blue illustration of mountains under a yellow sun" width="240">` },

{ id:"html-structure", title:"Lists and page structure", mins:15, kind:"code", mode:"html",
body:`## Lists
[[<ul>]] is a bulleted (unordered) list. [[<ol>]] is a numbered (ordered) list. Each item is an [[<li>]]:
~~~html
<ul>
  <li>Flour</li>
  <li>Eggs</li>
</ul>
<ol>
  <li>Mix</li>
  <li>Bake</li>
</ol>
~~~

## Elements inside elements
Elements nest inside each other, like boxes in boxes. Close them in reverse order: the last one opened is the first one closed. Indenting each level makes nesting easy to see.

## Structure elements
These elements don't look like anything special, but they say what each part of the page *is*. Screen readers, search engines and your future self all rely on them:
- [[<header>]]: the top of the page, usually the title and navigation
- [[<nav>]]: a group of navigation links
- [[<main>]]: the main content (one per page)
- [[<section>]]: a themed group of content, usually with its own heading
- [[<footer>]]: the bottom: credits, contact links, copyright

A generic [[<div>]] is a box with no meaning. Use it for layout when none of the above fit.`,
task:`Build a recipe page: a header with an [[<h1>]], a main area with a list of ingredients and numbered steps, and a footer.`,
starter:`<header>

</header>

<main>
  <h2>Ingredients</h2>

  <h2>Steps</h2>

</main>
`,
checks:[
 ["A [[<header>]] containing an [[<h1>]]", ()=>!!Q('header h1')],
 ["A bulleted list ([[<ul>]]) of at least 3 ingredients inside [[<main>]]", ()=>QA('main ul > li').length>=3],
 ["A numbered list ([[<ol>]]) of at least 3 steps inside [[<main>]]", ()=>QA('main ol > li').length>=3],
 ["A [[<footer>]] at the bottom", ()=>!!Q('footer')]
],
hints:["Inside <header>, add <h1>Pancakes</h1> (or your recipe).","Under 'Ingredients', open <ul>, add three <li> lines, then close </ul>.","The footer goes after </main>: <footer><p>Recipe by me</p></footer>"],
solution:`<header>
  <h1>Pancakes</h1>
</header>

<main>
  <h2>Ingredients</h2>
  <ul>
    <li>1 cup flour</li>
    <li>1 egg</li>
    <li>1 cup milk</li>
  </ul>

  <h2>Steps</h2>
  <ol>
    <li>Whisk everything together.</li>
    <li>Pour onto a hot pan.</li>
    <li>Flip when bubbles appear.</li>
  </ol>
</main>

<footer>
  <p>Recipe by Sam</p>
</footer>` },

{ id:"html-forms", title:"Forms and inputs", mins:18, kind:"code", mode:"html",
body:`Forms are how people give your app information.
~~~html
<form>
  <label for="city">City</label>
  <input id="city" type="text">

  <label for="age">Age</label>
  <input id="age" type="number" min="0">

  <label><input type="checkbox"> Remember me</label>

  <button type="submit">Save</button>
</form>
~~~
- [[<input>]] has many [[type]]s: [[text]], [[email]], [[number]], [[password]], [[checkbox]], [[date]] and more. The type changes the keyboard on phones and the built-in checks.
- Every input needs a **label**. Connect them by giving the input an [[id]] and the label a matching [[for]]. Clicking the label then focuses the input, and screen readers announce it. You can also wrap the input inside the label, like the checkbox above.
- [[<button>]] inside a form submits it.

By default, submitting a form reloads the page. In the "JavaScript in the browser" module you'll use JavaScript to grab the values and do something useful with them instead.`,
task:`Build a newsletter sign-up form.`,
starter:`<h1>Join the newsletter</h1>
<form>

</form>
`,
checks:[
 ["A text input with [[id=\"name\"]] and a label connected to it", ()=>{const i=Q('input#name');return !!i&&i.type==='text'&&!!Q('label[for="name"]')}],
 ["An email input with [[id=\"email\"]] and a label connected to it", ()=>{const i=Q('input#email');return !!i&&i.type==='email'&&!!Q('label[for="email"]')}],
 ["A checkbox with a label", ()=>{const c=Q('input[type="checkbox"]');return !!c&&(!!c.closest('label')||(!!c.id&&!!Q('label[for="'+c.id+'"]')))}],
 ["A button that says Sign up", ()=>QA('button').some(b=>/sign up/i.test(TXT(b)))]
],
hints:["A label and input pair: <label for=\"name\">Name</label> <input id=\"name\" type=\"text\">","For the email, use type=\"email\" and id=\"email\".","Wrap the checkbox: <label><input type=\"checkbox\"> Send me updates</label>"],
solution:`<h1>Join the newsletter</h1>
<form>
  <label for="name">Name</label>
  <input id="name" type="text">

  <label for="email">Email</label>
  <input id="email" type="email">

  <label><input type="checkbox"> Send me updates</label>

  <button type="submit">Sign up</button>
</form>` }
]},
