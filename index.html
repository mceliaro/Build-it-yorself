{ id:"python", title:"Python basics", blurb:"The language behind the Artona Digital Suite's tools: scripts that work with files, folders and data.", lessons:[
{ id:"py-why", title:"Why Python, and how the suite uses it", mins:10, kind:"read",
body:`So far you've learned the three languages of the web. The Artona Digital Suite uses those for its **window**: every screen, button and form is HTML, CSS and JavaScript. But the work behind the buttons is done by **Python**:
- copying photos off SD cards and renaming them
- reading class lists and writing CSV and Excel files
- laying out print sheets as PDFs
- reading QR codes and matching faces in the AI engine
- installing and updating itself from the team folder

## Why Python for that work
JavaScript in a browser isn't allowed to touch your files or network drives, for safety. Python is made for exactly that kind of job, and it has free, well-tested libraries for almost everything: **pandas** for spreadsheets, **Pillow** for images, **OpenCV** for computer vision, and many more.

## How the two halves talk
The suite is a Python program that opens a window using **pywebview**. The window shows your HTML page, and JavaScript in the page can call Python functions directly. Python does the work and sends results back to show on the screen. You'll build exactly this in the "Desktop apps with Python" module.

## The road from here
1. **Python basics** (this module): the language itself
2. **Python for real work**: files and folders, spreadsheets, settings, dates, images and PDFs, safety checks
3. **Desktop apps with Python**: the window, Check and Run buttons, settings, a separate engine, tests, packaging, updates
4. **Images and AI tools**: QR codes, faces, and keeping it all offline
5. **Learn from the Artona Digital Suite**: match every part of it to what you've learned, and read its real code
6. **Building for the web** and **Context, law and ethics**: going online, safely and responsibly
7. **The projects**: your own mini suite, then an online app

> Python reads a lot like English, and you already know the big ideas from JavaScript: variables, if, loops, functions, lists and objects. Most of this module is learning the new spelling.`,
quiz:[
 {q:"In the Artona Digital Suite, which part is written in HTML, CSS and JavaScript?", o:["The window: screens, buttons and forms","Copying and renaming photos","The AI engine"], a:0, why:"The screen is a web page shown by pywebview. Python does the work behind it."},
 {q:"Why can't the suite do its file work in browser JavaScript?", o:["JavaScript is too slow","Browsers don't let web pages read and write your files and drives","JavaScript can't do math"], a:1, why:"Browsers block file access for safety. Python runs as a normal program, so it can."}
] },

{ id:"py-install", title:"Install Python and run a script", mins:25, kind:"read",
body:`## Step 1: Install Python
[mac] Go to [python.org/downloads](https://www.python.org/downloads/), download the newest **Python 3** installer for macOS, open the **.pkg** and click through. When it finishes, a Finder window opens: double-click **Install Certificates.command** in it, so Python can download libraries later.

[win] Go to [python.org/downloads](https://www.python.org/downloads/) and download the newest **Python 3** installer for Windows. On the first screen, **tick "Add python.exe to PATH"** before clicking Install Now. This box is easy to miss and causes most setup problems.

> The Artona Digital Suite was built with Python 3.11. Everything in this course works on newer versions too. If a library ever refuses to install, it may not support the newest Python yet; the Ask for help box explains what to do.

## Step 2: Check it worked
Close every terminal, open a new one and type:
~~~mac
python3 --version
~~~
~~~win
python --version
~~~
**You should see:** something like [[Python 3.13.1]].

[mac] On a Mac, the command is always [[python3]] (and [[pip3]] for installing libraries). Plain [[python]] may not exist. Wherever this course writes [[python]], type [[python3]].

[win] If typing [[python]] opens the Microsoft Store instead, Windows is using a shortcut instead of your install. Try [[py --version]]; if that works, use [[py]] wherever the course says [[python]]. The Ask for help box has the permanent fix.

## Step 3: Install the Python extension for VS Code
In VS Code's Extensions panel, search **Python** and install the one by **Microsoft**. It colors Python code, shows mistakes as you type, and adds a ▶ Run button.

## Step 4: Your first script
1. In your Projects folder, make a folder called **python-practice** and open it in VS Code.
2. Make a new file called **hello.py** (Python files end in **.py**).
3. Type this and save:
~~~python
print("Hello from Python!")
~~~
4. Open VS Code's terminal (**View > Terminal**) and run it:
~~~mac
python3 hello.py
~~~
~~~win
python hello.py
~~~
**You should see:** [[Hello from Python!]]

## How Python exercises work in this course
The code playground runs JavaScript in your browser, but it can't run Python. So Python exercises happen on your computer: you write the script in VS Code, run it in the terminal, then paste **your code** and **what it printed** into the exercise. The app checks both and tells you what's wrong, just like before.

## If something goes wrong
- **"python is not recognized" or "command not found":** close every terminal and open a new one. On Windows, if that doesn't help, run the installer again, choose **Modify**, and make sure **Add Python to environment variables** is ticked.
- **"can't open file 'hello.py'":** the terminal isn't in the python-practice folder, or the file isn't saved. Use [[ls]] to check.
- **Anything else:** use **Ask for help** below.`,
steps:["Install Python 3 (ticking Add to PATH on Windows)","Check the version in a new terminal","Install the Python extension in VS Code","Make hello.py in a python-practice folder and run it"] },

{ id:"py-basics", title:"Python for JavaScript learners", mins:30, kind:"pyex",
body:`You already know the ideas. Here's how Python writes them.

~~~python
# A comment starts with #
name = "Mel"            # no let or const: just the name
photos = 240
is_admin = True         # True and False have capital letters
nothing = None          # Python's word for "no value" (like null)

print("Hi", name)                       # print instead of console.log
print(f"{name} has {photos} photos")    # an f-string: like a template literal
~~~

## Indentation is the code's structure
JavaScript uses curly brackets to group code. Python uses a **colon** at the end of the line, then **indents** the lines inside by 4 spaces:
~~~python
if photos > 200:
    print("Big shoot")
elif photos > 50:
    print("Normal shoot")
else:
    print("Small shoot")
~~~
Note [[elif]] (not "else if"), and [[and]], [[or]], [[not]] instead of [[&&]], [[||]], [[!]]. VS Code indents for you after a colon.

## Names
Python uses **snake_case**: [[school_code]], [[photo_count]]. It's case-sensitive, like JavaScript.

## Numbers and text
~~~python
total = 7 / 2       # 3.5
whole = 7 // 2      # 3   (divide, drop the decimal)
left = 7 % 2        # 1   (remainder)
code = "abcd".upper()          # "ABCD"
padded = str(42).zfill(6)      # "000042"  (useful for photo numbers)
count = int("12")              # text to number
~~~

> Mixing text and numbers is an error in Python, not a silent join like JavaScript's "5" + 3. [["Card " + 5]] crashes; write [[f"Card {5}"]] instead.`,
task:`Write a script that builds an Artona-style photo name.

Start with these three variables:
~~~python
school = "abcd"
card = 3
number = 42
~~~
Then print the name in the form [[ABCD27-OD-3-000042.jpg]]: the school code in capitals, [[27]], [[-OD-]], the card number, a dash, the photo number padded to 6 digits, and [[.jpg]].

Run it, then paste your code and what it printed.`,

`,

{ id:"py-collections", title:"Lists, dictionaries and loops", mins:30, kind:"pyex",
body:`## Lists
A **list** is Python's array:
~~~python
cards = ["E:", "F:", "G:"]
cards.append("H:")       # add to the end (like push)
print(len(cards))         # 4  (length is len(...), not .length)
print(cards[0])           # E:
~~~

## Dictionaries
A **dictionary** (dict) is Python's object: values stored under keys. Keys are written in quotes.
~~~python
student = {"first": "Ava", "last": "Chen", "grade": 12}
print(student["first"])          # Ava
student["photo"] = "AVA-001.jpg" # add a key
print(student.get("email", "none"))   # safe read with a default
~~~
Settings files, class list rows and JSON data all become dictionaries in Python.

## Loops
~~~python
for card in cards:
    print("Reading", card)

for i in range(1, 4):         # 1, 2, 3 (stops before 4)
    print(i)

for key, value in student.items():
    print(key, "=", value)
~~~

## List comprehensions
A short way to build a new list from an old one, like JavaScript's map and filter together:
~~~python
names = ["ava", "ben", "cy"]
upper = [n.upper() for n in names]            # map
long = [n for n in names if len(n) > 2]       # filter
~~~`,
task:`Here's a tiny class list as a list of dictionaries. Write a script that:
1. Prints each student as [[LAST, First]] (last name in capitals), one per line, in the order given.
2. Then prints [[Grade 12: 2]], counting how many students are in grade 12 with a loop or comprehension.`,
starter:`students = [
    {"first": "Ava", "last": "Chen", "grade": 12},
    {"first": "Ben", "last": "Okafor", "grade": 11},
    {"first": "Cy", "last": "Dubois", "grade": 12},
]
`,
checks:[
 ["Prints CHEN, Ava then OKAFOR, Ben then DUBOIS, Cy", (C,O)=>{const L=O.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);const i=L.indexOf("CHEN, Ava");return i>-1&&L[i+1]==="OKAFOR, Ben"&&L[i+2]==="DUBOIS, Cy"?true:PF(L.length?"The first lines printed were: "+L.slice(0,3).join(" | ")+".":"Paste what the terminal printed.")}],
 ["Prints Grade 12: 2", (C,O)=>/^\s*Grade 12: 2\s*$/m.test(O)?true:PF("No line says exactly \"Grade 12: 2\".")],
 ["The names come from a loop, not typed out", (C,O)=>/\bfor\b/.test(C)&&!/["']CHEN, Ava["']/.test(C)?true:PF("Loop over the students list so it works for any class list.")]
],
hints:["for s in students: gives you one dictionary at a time; read values with s[\"last\"].","Capitals: s[\"last\"].upper(). Build the line with an f-string.","Counting: len([s for s in students if s[\"grade\"] == 12])"],
solution:`students = [
    {"first": "Ava", "last": "Chen", "grade": 12},
    {"first": "Ben", "last": "Okafor", "grade": 11},
    {"first": "Cy", "last": "Dubois", "grade": 12},
]

for s in students:
    print(f"{s['last'].upper()}, {s['first']}")

grade12 = len([s for s in students if s["grade"] == 12])
print(f"Grade 12: {grade12}")` },

{ id:"py-functions", title:"Functions, modules and errors", mins:30, kind:"pyex",
body:`## Functions
~~~python
def season_name(start_year):
    """Turn 2026 into '26-27_Season'."""
    end = start_year + 1
    return f"{start_year % 100:02d}-{end % 100:02d}_Season"

print(season_name(2026))     # 26-27_Season
~~~
- [[def]] starts a function, then a colon and an indented body.
- The text in triple quotes is a **docstring**: a description that VS Code shows when you hover.
- [[{x:02d}]] inside an f-string pads a number to 2 digits.

## Modules
A **module** is a file of Python code you can import. Python comes with lots built in:
~~~python
from datetime import date
from pathlib import Path
import json

today = date.today()
print(today.year, today.month)
~~~
Your own files are modules too: [[from seasons import season_name]] imports from **seasons.py** in the same folder. The suite is split into many modules like this.

## Errors: read them from the bottom
Python errors are called **tracebacks**. The **last line** says what went wrong; the lines above show where, ending with the line in your file:
~~~text
Traceback (most recent call last):
  File "hello.py", line 3, in <module>
    print(total + " photos")
TypeError: unsupported operand type(s) for +: 'int' and 'str'
~~~

## Handling errors
~~~python
try:
    count = int(text)
except ValueError:
    print("That isn't a number")
~~~
Catch the specific error you expect ([[ValueError]], [[FileNotFoundError]], [[PermissionError]]), not everything, so real bugs still show up.`,

{ id:"py-venv", title:"Libraries, pip and virtual environments", mins:25, kind:"read",
body:`**pip** installs Python libraries, the way npm does for JavaScript. To keep each project's libraries separate, Python uses a **virtual environment** ("venv"): a folder inside your project holding its own copy of Python and its libraries. The suite has one, and so will every project from here on.

## Step 1: Make a virtual environment
In your project folder's terminal:
~~~mac
python3 -m venv .venv
source .venv/bin/activate
~~~
~~~win
python -m venv .venv
.venv\\Scripts\\Activate.ps1
~~~
**You should see:** [[(.venv)]] at the start of your prompt. While it's there, [[python]] and [[pip]] use this project's copy. (On a Mac, after activating, plain [[python]] works too.)

[win] If PowerShell says "running scripts is disabled", run [[Set-ExecutionPolicy -Scope CurrentUser RemoteSigned]] once, type Y, then activate again. On a work PC, check with IT first.

VS Code notices the .venv folder and asks whether to use it. Click **Yes**.

## Step 2: Install libraries
~~~sh
pip install pandas openpyxl pillow
~~~
- **pandas**: spreadsheets and tables (CSV, Excel)
- **openpyxl**: lets pandas write .xlsx files
- **pillow**: images (open, resize, rotate, save, make PDFs)

## Step 3: Record what the project needs
~~~sh
pip freeze > requirements.txt
~~~
That writes every library and its exact version into **requirements.txt**. Anyone (including future you on a new PC) can rebuild the same setup with [[pip install -r requirements.txt]]. This is what the suite's [[1_setup_build_tools.bat]] does for you: it's the one step that needs the internet.

## Keep .venv out of Git
Add these to **.gitignore**:
~~~text
.venv/
__pycache__/
dist/
build/
~~~
Like node_modules, the venv is large and can be rebuilt from requirements.txt.

## Each time you come back
Open the project, open the terminal, and activate again ({{source .venv/bin/activate|.venv\\Scripts\\Activate.ps1}}). VS Code's terminal often does it for you.`,
steps:["Make a .venv in python-practice and activate it","pip install pandas openpyxl pillow","Write requirements.txt with pip freeze","Add .venv and __pycache__ to .gitignore and commit"] }
]},

{ id:"py-practice-data", title:"Make safe practice data", mins:20, kind:"read",
body:`The suite works on student photos and class lists. Those are personal information protected by FOIPPA, so **never practise with real student data**: not on your own computer, not in a GitHub repository, not in a screenshot you share. Instead, this script generates realistic fake data to practise on.

## What it makes
- **fake-sd-cards/** with three "cards" ([[CARD1]], [[CARD2]], [[CARD3]]) of numbered JPGs, like a camera's [[DCIM]] folder
- **class_list.csv**: a messy class list with extra spaces, mixed capitals and a duplicate, like the ones schools send
- **schoolday_export.json**: a small School Day–style export

## Step 1: Save the script
In your python-practice folder (with the venv active and Pillow installed), make **make_practice_data.py** and paste:
~~~python
"""Creates fake practice data. Contains no real people."""
import csv, json, random
from pathlib import Path
from PIL import Image, ImageDraw

random.seed(7)
root = Path("practice")
first = ["Ava", "Ben", "Cy", "Dana", "Eli", "Fatima", "Gus", "Hana", "Ivan", "Jo"]
last = ["Chen", "Okafor", "Dubois", "Singh", "Martin", "Nguyen", "Brown", "Haddad"]

# 1. Fake SD cards with numbered photos
for card in range(1, 4):
    folder = root / "fake-sd-cards" / f"CARD{card}" / "DCIM" / "100CANON"
    folder.mkdir(parents=True, exist_ok=True)
    for n in range(1, 13):
        img = Image.new("RGB", (900, 1200), (random.randint(60, 200), 120, 160))
        d = ImageDraw.Draw(img)
        d.rectangle([300, 250, 600, 650], fill=(230, 200, 170))   # a "face"
        d.text((40, 40), f"CARD {card} PHOTO {n}", fill="white")
        img.save(folder / f"IMG_{n:04d}.JPG", quality=80)

# 2. A messy class list
rows = []
for i in range(14):
    f, l = random.choice(first), random.choice(last)
    rows.append({"Student ID": f"S{1000+i}", "First Name": f"  {f.lower()} ",
                 "Last Name": l.upper() if i % 3 else l, "Grade": random.choice([11, 12])})
rows.append(dict(rows[2]))   # a duplicate row
with open(root / "class_list.csv", "w", newline="") as fh:
    w = csv.DictWriter(fh, fieldnames=rows[0].keys())
    w.writeheader()
    w.writerows(rows)

# 3. A small School Day-style export
export = {"school": "ABCD", "season": "26-27",
          "students": [{"id": r["Student ID"], "name": {"first": r["First Name"].strip().title(),
                        "last": r["Last Name"].title()}, "packages": ["A", "C"]} for r in rows[:6]]}
(root / "schoolday_export.json").write_text(json.dumps(export, indent=2))
print("Practice data is in", root.resolve())
~~~

## Step 2: Run it
~~~mac
python3 make_practice_data.py
~~~
~~~win
python make_practice_data.py
~~~
**You should see:** "Practice data is in" and a path. Open the **practice** folder and look around.

> Add [[practice/]] to your .gitignore. Even fake data doesn't belong in Git, and it builds the habit for when the data is real.`,
steps:["Save and run make_practice_data.py","Open the practice folder and look at the cards, CSV and JSON","Add practice/ to .gitignore"] },

{ id:"py-files", title:"Files and folders with pathlib", mins:35, kind:"pyex",
body:`Most of the suite's tools are, at heart, careful file jobs: find files, work out new names, copy or move them, check the copies. Python's **pathlib** makes paths easy and works the same on Mac and Windows.

~~~python
from pathlib import Path
import shutil

cards = Path("practice/fake-sd-cards")
for card in sorted(cards.iterdir()):          # each item inside the folder
    if card.is_dir():
        photos = sorted(card.rglob("*.JPG"))  # search every subfolder
        print(card.name, len(photos))

target = Path("practice/import")
target.mkdir(parents=True, exist_ok=True)     # make it (and parents); fine if it exists
p = photos[0]
print(p.name, p.stem, p.suffix)              # IMG_0001.JPG  IMG_0001  .JPG
shutil.copy2(p, target / "NEW-NAME.jpg")      # copy, keeping the file's dates
~~~

## Paths you'll meet at work
~~~python
season = Path(r"Y:\\26-27_Season")          # Windows drive letter (r"..." keeps the backslashes)
nas = Path(r"\\\\nas-server\\sd_backup")        # a network share
mac = Path("/Volumes/Photos/26-27_Season")    # a network drive on a Mac
photo = season / "ABCD27" / "IMAGES" / "OD"   # the / joins path parts on any system
~~~

> Always write Windows paths as **raw strings** ([[r"..."]]) or with pathlib's [[/]]. In a normal string, [["C:\\new"]] contains a hidden "new line" character because [[\\n]] means new line.

## rglob vs glob
[[folder.glob("*.JPG")]] looks in that folder only. [[folder.rglob("*.JPG")]] also searches every subfolder, which you need for camera cards ([[DCIM/100CANON/...]]). Camera files may be [[.JPG]] or [[.jpg]]; check both or compare [[p.suffix.lower() == ".jpg"]].`,
task:`Write **importer.py** that copies every photo from the three fake cards into [[practice/import/ABCD27/IMAGES/OD/]], renamed like the SD Card Importer does:

[[ABCD27-OD-<card number>-<photo number, 6 digits>.jpg]]

Photo numbers restart at 1 on each card. Make the folders if they don't exist. At the end, print one line per card like [[CARD1: 12 photos]] and then [[Total: 36]].

Paste your code and what it printed.`,
starter:`from pathlib import Path
import shutil

cards = Path("practice/fake-sd-cards")
target = Path("practice/import/ABCD27/IMAGES/OD")
`,
checks:[
 ["Uses pathlib to find the photos in each card, including subfolders", (C,O)=>/rglob\s*\(/.test(C)||/os\.walk/.test(C)?true:PF("The photos are inside DCIM/100CANON on each card. Which method searches subfolders too?")],
 ["Makes the target folders if they're missing", (C,O)=>/mkdir\s*\([^)]*parents\s*=\s*True/.test(C)?true:PF("Make the target folder first, including any missing parent folders.")],
 ["Copies the files (keeps the originals)", (C,O)=>/shutil\.copy2?\s*\(/.test(C)&&!/shutil\.move|\.rename\s*\(/.test(C)?true:PF(/shutil\.move|\.rename\s*\(/.test(C)?"Your code moves or renames the originals. An importer should copy, so the card stays untouched until the copies are checked.":"No copy found yet. The shutil module copies files.")],
 ["Builds names like ABCD27-OD-1-000001.jpg", (C,O)=>/ABCD27-OD-/.test(C)&&(/zfill\s*\(\s*6\s*\)|:06d|:06\}/.test(C))?true:PF("Check the name pattern: the photo number needs 6 digits.")],
 ["Prints CARD1: 12 photos … and Total: 36", (C,O)=>/CARD1: 12 photos/.test(O)&&/CARD2: 12 photos/.test(O)&&/CARD3: 12 photos/.test(O)&&/Total: 36/.test(O)?true:PF(O.trim()?"Your output doesn't show 12 photos for each card and a total of 36. Did the practice data script run first?":"Paste what the terminal printed.")]
],
hints:["Loop over sorted(cards.iterdir()) and keep only folders. The card number is the last character of the folder name: int(card.name[-1]) or use enumerate.","For each card: photos = sorted(card.rglob(\"*.JPG\")), then enumerate(photos, start=1) gives you the photo number.","new_name = f\"ABCD27-OD-{card_no}-{n:06d}.jpg\" and shutil.copy2(photo, target / new_name)"],
solution:`from pathlib import Path
import shutil

cards = Path("practice/fake-sd-cards")
target = Path("practice/import/ABCD27/IMAGES/OD")
target.mkdir(parents=True, exist_ok=True)

total = 0
for card_no, card in enumerate(sorted(c for c in cards.iterdir() if c.is_dir()), start=1):
    photos = sorted(card.rglob("*.JPG"))
    for n, photo in enumerate(photos, start=1):
        new_name = f"ABCD27-OD-{card_no}-{n:06d}.jpg"
        shutil.copy2(photo, target / new_name)
    print(f"{card.name}: {len(photos)} photos")
    total += len(photos)

print(f"Total: {total}")` },

{ id:"py-safety", title:"Check before Run: previews, verifying and undo", mins:30, kind:"pyex",
body:`Every tool in the suite has a **Check** step that shows what will happen before anything changes. That one habit prevents most disasters with real photos. This lesson turns it into code.

## Split every tool into plan and do
~~~python
def plan_import(cards, target):
    """Work out every copy, without touching any file."""
    plan = []
    for card_no, card in enumerate(sorted(cards.iterdir()), start=1):
        for n, src in enumerate(sorted(card.rglob("*.JPG")), start=1):
            dst = target / f"ABCD27-OD-{card_no}-{n:06d}.jpg"
            plan.append((src, dst))
    return plan

def problems(plan):
    """Things that would go wrong. Empty list = safe to run."""
    issues = []
    for src, dst in plan:
        if dst.exists():
            issues.append(f"{dst.name} already exists")
    return issues
~~~
The **Check** button runs plan and problems and shows the result. **Run** only does what the plan says, and only if there are no problems (or the person confirms).

## Verify every copy
A copy can fail silently: a network blip, a full drive, a card pulled out early. The SD Card Importer checks every copy. The strongest check is a **hash**: a fingerprint calculated from every byte of the file. Same fingerprint means identical files.
~~~python
import hashlib

def sha256(path):
    h = hashlib.sha256()
    with open(path, "rb") as f:                # "rb" = read bytes
        for chunk in iter(lambda: f.read(1024 * 1024), b""):
            h.update(chunk)                    # 1 MB at a time, so big files are fine
    return h.hexdigest()
~~~

## Deleting safely
The suite's Delete Services tool shows a preview and asks to confirm. In your own tools:
- Prefer moving to a [[_to_delete]] folder over deleting.
- If you must delete, list exactly what will go and how much space it frees, and require the person to type a confirmation.
- Write a log of what was removed.

## Backups before overwriting
The wrong-pose tools back up a data file before changing it:
~~~python
from datetime import datetime
backup_dir = data_file.parent / "Suite backups"
backup_dir.mkdir(exist_ok=True)
stamp = datetime.now().strftime("%Y%m%d-%H%M%S")
shutil.copy2(data_file, backup_dir / f"{data_file.stem}-{stamp}{data_file.suffix}")
~~~`,
task:`Improve your importer so it has a check step and verifies copies:
1. A [[plan_import]] function that returns the list of (source, destination) pairs without copying anything.
2. Before copying, print [[Check: 36 files to copy, 0 problems]] (counting destinations that already exist as problems).
3. After copying each file, compare the SHA-256 of the source and the copy. At the end print [[Verified: 36 of 36]].

Delete the practice/import folder first so there are no problems, then run it and paste your code and output.`,
starter:`from pathlib import Path
import hashlib, shutil

cards = Path("practice/fake-sd-cards")
target = Path("practice/import/ABCD27/IMAGES/OD")
`,
checks:[
 ["A plan_import function that only plans", (C,O)=>{const m=C.match(/def\s+plan_import\s*\([^)]*\)\s*:([\s\S]*?)(?=\ndef\s|\n\S|$)/);if(!m)return PF("Add a function called plan_import.");return /copy|move|unlink|rmtree/.test(m[1])?PF("plan_import should only work out the pairs. Keep copying out of it."):true}],
 ["Counts problems before copying", (C,O)=>/\.exists\s*\(/.test(C)?true:PF("A destination that already exists is a problem. How do you test whether a path exists?")],
 ["Hashes files with SHA-256", (C,O)=>/hashlib\.sha256/.test(C)?true:PF("Use hashlib.sha256 to fingerprint both files.")],
 ["Prints Check: 36 files to copy, 0 problems", (C,O)=>/Check: 36 files to copy, 0 problems/.test(O)?true:PF(/Check:/.test(O)?"Your check line says: "+(O.match(/Check:.*/)||[""])[0]+". Did you delete practice/import first?":"No \"Check:\" line in the output.")],
 ["Prints Verified: 36 of 36", (C,O)=>/Verified: 36 of 36/.test(O)?true:PF("No \"Verified: 36 of 36\" line in the output.")]
],
hints:["plan_import is your old loop, but instead of copying it appends (photo, target / new_name) to a list and returns the list.","problems = [dst for src, dst in plan if dst.exists()]","After shutil.copy2(src, dst), if sha256(src) == sha256(dst): verified += 1"],
solution:`from pathlib import Path
import hashlib, shutil

cards = Path("practice/fake-sd-cards")
target = Path("practice/import/ABCD27/IMAGES/OD")


def sha256(path):
    h = hashlib.sha256()
    with open(path, "rb") as f:
        for chunk in iter(lambda: f.read(1024 * 1024), b""):
            h.update(chunk)
    return h.hexdigest()


def plan_import(cards, target):
    plan = []
    folders = sorted(c for c in cards.iterdir() if c.is_dir())
    for card_no, card in enumerate(folders, start=1):
        for n, src in enumerate(sorted(card.rglob("*.JPG")), start=1):
            plan.append((src, target / f"ABCD27-OD-{card_no}-{n:06d}.jpg"))
    return plan


plan = plan_import(cards, target)
problems = [dst for src, dst in plan if dst.exists()]
print(f"Check: {len(plan)} files to copy, {len(problems)} problems")

if not problems:
    target.mkdir(parents=True, exist_ok=True)
    verified = 0
    for src, dst in plan:
        shutil.copy2(src, dst)
        if sha256(src) == sha256(dst):
            verified += 1
    print(f"Verified: {verified} of {len(plan)}")` },

{ id:"py-pandas", title:"Spreadsheets with pandas: CSV, Excel and JSON", mins:35, kind:"pyex",
body:`**pandas** loads a table into a **DataFrame**: rows and named columns you can clean, filter, sort and save. The suite's Clean Class List, Convert JSON to Excel, and the yearbook and composite pulls all use it.

~~~python
import pandas as pd

df = pd.read_csv("practice/class_list.csv")
print(df.head())             # the first 5 rows
print(df.columns.tolist())   # the column names
print(len(df))               # number of rows
~~~

## Cleaning a column
A column works like a whole list at once. [[.str]] gives you text methods for every row:
~~~python
df["First Name"] = df["First Name"].str.strip().str.title()   # "  ava " -> "Ava"
df["Last Name"] = df["Last Name"].str.strip().str.title()
~~~

## Filtering, sorting, removing duplicates
~~~python
grade12 = df[df["Grade"] == 12]                    # keep matching rows
df = df.sort_values(["Last Name", "First Name"])
df = df.drop_duplicates(subset=["Student ID"])     # one row per student
~~~

## Saving
~~~python
df.to_csv("clean.csv", index=False)      # index=False: don't add pandas' row numbers
df.to_excel("clean.xlsx", index=False)   # needs openpyxl installed
~~~

## JSON to a table
School Day exports are nested JSON. [[pd.json_normalize]] flattens them into columns:
~~~python
import json
data = json.loads(Path("practice/schoolday_export.json").read_text())
table = pd.json_normalize(data["students"])   # columns like name.first, name.last
~~~`,

{ id:"py-settings", title:"Settings files and dates", mins:25, kind:"read",
body:`Hard-coded values were one of the biggest problems in the old tools: [[26-27]] typed into the SD Card Importer, [[Y:\\25-26_Season]] in Delete Services. Every season someone had to edit code. The suite fixed this with **settings files** and by **working out the season from the date**.

## JSON settings
~~~python
import json
from pathlib import Path

SETTINGS = Path("settings.json")
DEFAULTS = {"season_drive": "Y:", "nas": r"\\\\nas-server\\sd_backup", "theme": "light"}

def load_settings():
    if SETTINGS.exists():
        saved = json.loads(SETTINGS.read_text(encoding="utf-8"))
        return {**DEFAULTS, **saved}      # saved values win; new defaults fill gaps
    return dict(DEFAULTS)

def save_settings(s):
    SETTINGS.write_text(json.dumps(s, indent=2), encoding="utf-8")
~~~
The suite has two kinds: **team settings** ([[suite_config.json]] on U:, changed by the admin) and **personal settings** (last folders, window size, theme) in each person's profile.

## Where personal files belong
Don't save settings next to the program; it may be read-only after packaging. Use the user's app-data folder:
~~~python
import os, sys
from pathlib import Path

def app_data():
    if sys.platform == "win32":
        base = Path(os.environ["LOCALAPPDATA"])                 # C:\\Users\\you\\AppData\\Local
    else:
        base = Path.home() / "Library" / "Application Support"   # on a Mac
    folder = base / "MyDigitalSuite"
    folder.mkdir(parents=True, exist_ok=True)
    return folder
~~~
That's why the suite lives in [[%LOCALAPPDATA%\\ArtonaDigitalSuite\\]].

## Dates
~~~python
from datetime import date, datetime

today = date.today()
taken = datetime.fromtimestamp(Path("photo.jpg").stat().st_mtime)   # file's modified time
print(taken.strftime("%Y-%m-%d"))        # format a date as text
d = datetime.strptime("2026-09-14", "%Y-%m-%d")   # text back to a date
~~~
With your [[season_for]] function, a tool can find the right season folder from the photo's date, with no list to update each year. That fixed a real bug: the old yearbook pulls looked for 2026–27 photos in last season's folders.

## Logging
The suite keeps logs so problems can be traced afterwards. Python's **logging** module writes timestamped lines to a file:
~~~python
import logging
logging.basicConfig(filename=app_data() / "suite.log", level=logging.INFO,
                    format="%(asctime)s %(levelname)s %(message)s")
logging.info("Import started for %s", school)
logging.error("Copy failed: %s", dst)
~~~
Never log student names. Counts, tool names and file paths are enough to debug.`,
steps:["Add load_settings and save_settings to your importer, with the school code and target folder as settings","Use season_for to build the target folder from today's date","Add logging to a file in your app-data folder"] },

{ id:"py-images", title:"Images and print PDFs with Pillow", mins:35, kind:"pyex",
body:`**Pillow** (imported as [[PIL]]) opens, edits and saves images. The suite's Print Layouts tools use it to place photos on big sheets and save print-ready PDFs.

~~~python
from PIL import Image, ImageOps

img = Image.open("photo.jpg")
img = ImageOps.exif_transpose(img)      # respect the camera's rotation tag
print(img.size)                          # (width, height) in pixels
small = img.copy()
small.thumbnail((400, 400))              # shrink to fit, keeping the shape
rotated = img.rotate(90, expand=True)    # turn portrait to landscape
img.save("copy.jpg", quality=92)
~~~

## Inches, pixels and DPI
Print sizes are in inches; images are in pixels. At **300 DPI** (dots per inch), 1 inch = 300 pixels:
~~~python
DPI = 300
page = Image.new("RGB", (19 * DPI, 13 * DPI), "white")   # a 19x13 in sheet
slot = (7 * DPI, 5 * DPI)                                  # a 7x5 in photo slot
~~~

## Fitting a photo into a slot
~~~python
def fit(img, size):
    """Scale to fit inside size, centred on white, without stretching."""
    img = img.copy()
    img.thumbnail(size)
    canvas = Image.new("RGB", size, "white")
    canvas.paste(img, ((size[0] - img.width) // 2, (size[1] - img.height) // 2))
    return canvas
~~~
(The old Communion Stack tool stretched photos to fill the slot instead. That's a design choice worth noticing when you rebuild a tool: stretch, fit, or crop to fill.)

## Pasting and saving a multi-page PDF
~~~python
page.paste(fit(img, slot), (1 * DPI, 1 * DPI))     # top-left corner at 1 in, 1 in
pages[0].save("sheets.pdf", save_all=True, append_images=pages[1:], resolution=DPI)
~~~

## Stack-cut order
The print tools fill **slot 1 on every page first**, then slot 2, and so on. When the printed stack is cut, each slot's pile is already in order. With [[n]] pages, photo number [[i]] goes on page [[i % n]], in slot [[i // n]].`,
task:`Write **class_sheet.py** that lays out the 12 photos from [[CARD1]] on 13×19 in pages (portrait: 13 wide, 19 tall) at 300 DPI, **4 per page** in a 2×2 grid. Each slot is 5×7 in (5 wide, 7 tall), with a 1 in margin and 1 in gaps. Fit each photo into its slot without stretching. Save [[practice/class_sheets.pdf]].

Print [[Pages: 3]] and the page size in pixels as [[Page size: 3900 x 5700]].`,
starter:`from pathlib import Path
from PIL import Image, ImageOps

DPI = 300
photos = sorted(Path("practice/fake-sd-cards/CARD1").rglob("*.JPG"))
`,
checks:[
 ["Uses 300 DPI to turn inches into pixels", (C,O)=>/DPI/.test(C)&&/13\s*\*\s*DPI/.test(C)&&/19\s*\*\s*DPI/.test(C)?true:PF("Work out the page size in pixels from inches and DPI.")],
 ["Fits photos without stretching", (C,O)=>/thumbnail\s*\(|ImageOps\.(contain|pad|fit)/.test(C)&&!/\.resize\s*\(\s*slot/.test(C)?true:PF(/\.resize\s*\(/.test(C)?"resize to the slot size stretches photos whose shape differs. Use a method that keeps the shape.":"Shrink each photo to fit its slot, keeping its shape.")],
 ["Places 4 photos per page with paste", (C,O)=>/\.paste\s*\(/.test(C)?true:PF("Put each photo on the page with the page's paste method.")],
 ["Saves a multi-page PDF", (C,O)=>/save\s*\([^)]*\.pdf[^)]*save_all\s*=\s*True/.test(C)||/save_all\s*=\s*True[\s\S]{0,80}append_images/.test(C)?true:PF("Save the first page as a PDF with save_all=True and the other pages in append_images.")],
 ["Prints Pages: 3 and Page size: 3900 x 5700", (C,O)=>/Pages: 3\b/.test(O)&&/Page size: 3900 x 5700/.test(O)?true:PF(O.trim()?"Your output doesn't show 3 pages of 3900 x 5700.":"Paste what the terminal printed.")]
],
hints:["Page: Image.new(\"RGB\", (13 * DPI, 19 * DPI), \"white\"). Slot: (5 * DPI, 7 * DPI).","Slot positions: x is 1 in or 1 + 5 + 1 = 7 in; y is 1 in or 1 + 7 + 1 = 9 in. Loop over the photos in groups of 4.","Use the fit() function from the lesson, then page.paste(fit(img, slot), (x * DPI, y * DPI))."],
solution:`from pathlib import Path
from PIL import Image, ImageOps

DPI = 300
photos = sorted(Path("practice/fake-sd-cards/CARD1").rglob("*.JPG"))
PAGE = (13 * DPI, 19 * DPI)
SLOT = (5 * DPI, 7 * DPI)
SPOTS = [(1, 1), (7, 1), (1, 9), (7, 9)]   # inches from the top-left


def fit(img, size):
    img = img.copy()
    img.thumbnail(size)
    canvas = Image.new("RGB", size, "white")
    canvas.paste(img, ((size[0] - img.width) // 2, (size[1] - img.height) // 2))
    return canvas


pages = []
for start in range(0, len(photos), 4):
    page = Image.new("RGB", PAGE, "white")
    for photo, (x, y) in zip(photos[start:start + 4], SPOTS):
        img = ImageOps.exif_transpose(Image.open(photo))
        page.paste(fit(img, SLOT), (x * DPI, y * DPI))
    pages.append(page)

pages[0].save("practice/class_sheets.pdf", save_all=True, append_images=pages[1:], resolution=DPI)
print(f"Pages: {len(pages)}")
print(f"Page size: {PAGE[0]} x {PAGE[1]}")` }
]},

{ id:"pydesk", title:"Desktop apps with Python", blurb:"An HTML window driven by Python with pywebview: the way the Artona Digital Suite is built.", lessons:[
{ id:"pd-how", title:"How the suite runs: two halves in one window", mins:15, kind:"read",
body:`The Artona Digital Suite is **one Python program that opens a window**. The window is drawn by Microsoft's **WebView2**, the same engine Teams and the new Outlook use (on a Mac, pywebview uses Safari's engine instead). Inside the window is an ordinary HTML page.

## The parts
- **The screen**: HTML, CSS and JavaScript. Menus, forms, the Check and Run buttons, progress bars, results.
- **The bridge**: pywebview lets JavaScript call Python functions directly, and Python call JavaScript. There's **no web server** and no network port: the two halves talk inside one program. (That's one reason IT could approve it: nothing listens on the network.)
- **The workers**: Python functions that do the file, data and image jobs you've been writing.
- **The AI engine**: a separate program for the heavy face, QR and photo tools. The suite gives it a job as a file, it runs, writes a result file, and closes.
- **The launcher**: a small program that installs and updates the suite from the team folder.

## What happens when you press Run
1. JavaScript collects the form's values and calls a Python function, like [[window.pywebview.api.run_import(settings)]].
2. Python starts the job in a **background thread**, so the window doesn't freeze.
3. As it works, Python sends progress to the page.
4. When it's done, Python returns a summary that the page shows as results, with a button to open the output folder.

## Compared with Electron
Electron (another popular way to build desktop apps) does the same thing with JavaScript on both sides. The suite uses Python for the work half because the libraries it needs (pandas, Pillow, OpenCV, PyTorch) are Python libraries.

## The next lessons build a mini suite
By the end of this module you'll have a working app with a menu, an import tool with Check and Run, progress, settings, an admin password, a separate engine, tests, a packaged app and updates. That's the skeleton of the real thing.`,
quiz:[
 {q:"How does the suite's screen talk to Python?", o:["Through a web server on port 5000","Directly inside one program, using pywebview's bridge","By writing files to the U: drive"], a:1, why:"pywebview connects JavaScript and Python inside the same program. No server, no port."},
 {q:"Why does a long job run in a background thread?", o:["So it runs faster","So the window doesn't freeze while it works","Because Python requires it"], a:1, why:"The window is drawn on the main thread. A long job there would freeze it until the job finished."},
 {q:"How does the suite give work to the AI engine?", o:["Over the internet","As a job file; the engine writes a result file and closes","By sharing memory"], a:1, why:"The suite writes the job to a file and starts the engine, which writes its result and exits."}
] },

{ id:"pd-first", title:"Your first pywebview window", mins:30, kind:"read",
body:`## Step 1: Set up the project
~~~sh
mkdir my-suite
cd my-suite
~~~
Make and activate a venv (see "Libraries, pip and virtual environments"), then:
~~~sh
pip install pywebview
~~~
[mac] On a Mac that's all. pywebview uses the Safari engine built into macOS.

[win] On Windows, pywebview uses Microsoft Edge WebView2, which is already on Windows 10 and 11 because Teams and Outlook use it.

## Step 2: The folder layout
~~~text
my-suite/
├── app.py          the Python half
├── ui/
│   ├── index.html  the screen
│   ├── style.css
│   └── app.js
└── .venv/
~~~

## Step 3: app.py
~~~python
import webview


class Api:
    """Every method here can be called from JavaScript."""

    def hello(self, name):
        return f"Hello {name}, from Python!"


if __name__ == "__main__":
    webview.create_window("My Digital Suite", "ui/index.html", js_api=Api(),
                          width=1100, height=750)
    webview.start()
~~~
[[if __name__ == "__main__":]] means "only run this when the file is started directly, not when another file imports it". You'll see it in almost every Python program.

## Step 4: ui/index.html
Use the ! + Tab starting code, link style.css and app.js (with defer), and in the body put:
~~~html
<h1>My Digital Suite</h1>
<input id="name" placeholder="Your name">
<button id="hi">Say hi to Python</button>
<p id="out"></p>
~~~

## Step 5: ui/app.js
~~~js
window.addEventListener("pywebviewready", () => {
  document.querySelector("#hi").addEventListener("click", async () => {
    const name = document.querySelector("#name").value;
    const reply = await window.pywebview.api.hello(name);
    document.querySelector("#out").textContent = reply;
  });
});
~~~
- [[pywebviewready]] fires when the bridge is connected. Calling Python before it fires fails.
- Every Python call returns a **Promise**, so you [[await]] it, exactly like fetch.

## Step 6: Run it
~~~mac
python3 app.py
~~~
~~~win
python app.py
~~~
**You should see:** a window with your page. Type a name, click the button, and Python's reply appears.

## Debugging the screen
Start with [[webview.start(debug=True)]] and right-click in the window to **Inspect**: the same DevTools you know, for the HTML half. Python errors appear in the terminal you started it from.

## If something goes wrong
- **"ModuleNotFoundError: No module named 'webview'":** the venv isn't active, or pywebview was installed into a different Python. Activate the venv and install again.
- **Blank window:** check the path [[ui/index.html]] and that you ran app.py from the my-suite folder.
- **"window.pywebview is undefined":** the code ran before [[pywebviewready]]. Put it inside that listener.`,
steps:["Make my-suite with a venv and install pywebview","Write app.py with an Api class","Write ui/index.html and ui/app.js","Run it and call Python from the button","Open DevTools with debug=True"] },

{ id:"pd-bridge", title:"Check and Run: connect a real tool", mins:40, kind:"read",
body:`Now connect your importer to the window, with the suite's pattern: fill in the form, **Check**, then **Run**.

## Python: expose plan and run
Move your importer code into **importer.py** (plan_import, sha256 and a run_import function). Then in app.py:
~~~python
import webview
from pathlib import Path
import importer


class Api:
    def pick_folder(self):
        result = window.create_file_dialog(webview.FileDialog.FOLDER)
        return result[0] if result else None

    def check_import(self, form):
        plan = importer.plan_import(Path(form["cards"]), Path(form["target"]))
        clashes = [d.name for s, d in plan if d.exists()]
        return {"count": len(plan), "problems": clashes[:20],
                "examples": [d.name for s, d in plan[:3]]}

    def run_import(self, form):
        return importer.run_import(Path(form["cards"]), Path(form["target"]))


api = Api()
window = webview.create_window("My Digital Suite", "ui/index.html", js_api=api)
webview.start()
~~~
- JavaScript sends a plain object; Python receives it as a **dictionary**.
- Python returns dictionaries and lists; JavaScript receives them as **objects and arrays**. (They travel as JSON, so return text, numbers, lists and dicts, not Path objects.)
- [[webview.FileDialog.FOLDER]] opens the system folder picker. (Older pywebview versions call it [[webview.FOLDER_DIALOG]].)

## JavaScript: the form
~~~js
const api = () => window.pywebview.api;
const form = () => ({
  cards: document.querySelector("#cards").value,
  target: document.querySelector("#target").value,
});

document.querySelector("#pickCards").addEventListener("click", async () => {
  const folder = await api().pick_folder();
  if (folder) document.querySelector("#cards").value = folder;
});

document.querySelector("#check").addEventListener("click", async () => {
  const r = await api().check_import(form());
  document.querySelector("#result").textContent =
    r.problems.length ? \`\${r.problems.length} problems, e.g. \${r.problems[0]} already exists\`
                      : \`Ready: \${r.count} files, like \${r.examples.join(", ")}\`;
  document.querySelector("#run").disabled = r.problems.length > 0;
});
~~~

## Errors cross the bridge too
If a Python function raises an error, the JavaScript Promise **rejects**. Catch it and show a friendly message:
~~~js
try {
  const summary = await api().run_import(form());
  show(summary);
} catch (err) {
  document.querySelector("#result").textContent = "Couldn't import: " + err.message;
}
~~~
Python's side should raise clear errors for the person, like [[raise ValueError("That folder has no photos")]].

> Keep the logic in importer.py, not in app.py. Then you can test it without a window (the testing lesson) and reuse it in other tools.`,
steps:["Move the importer into importer.py with plan_import and run_import","Add pick_folder, check_import and run_import to the Api class","Build the form with Check and Run buttons","Show problems and disable Run until Check passes","Catch Python errors in JavaScript and show them"] },

{ id:"pd-threads", title:"Long jobs: threads and progress", mins:35, kind:"read",
body:`Copying 3,000 photos takes minutes. If [[run_import]] does the work directly, the window freezes until it's done. The fix: start the work in a **background thread** and send progress to the page as it goes.

## Python: start the job, report progress
~~~python
import threading, json


class Api:
    def start_import(self, form):
        t = threading.Thread(target=self._import_job, args=(form,), daemon=True)
        t.start()
        return "started"

    def _import_job(self, form):
        plan = importer.plan_import(Path(form["cards"]), Path(form["target"]))
        done = 0
        for src, dst in plan:
            importer.copy_and_verify(src, dst)
            done += 1
            if done % 10 == 0 or done == len(plan):
                self._send("progress", {"done": done, "total": len(plan)})
        self._send("finished", {"copied": done})

    def _send(self, kind, data):
        window.evaluate_js(f"onPython({json.dumps(kind)}, {json.dumps(data)})")
~~~
- A method starting with [[_]] is private by convention. pywebview doesn't expose those to JavaScript.
- [[window.evaluate_js]] runs JavaScript in the page. [[json.dumps]] turns Python values into safe JavaScript text, quotes and all.
- Sending every 10 files (not every file) keeps the screen smooth.

## JavaScript: receive it
~~~js
window.onPython = (kind, data) => {
  if (kind === "progress") {
    document.querySelector("progress").value = data.done / data.total;
    document.querySelector("#status").textContent = \`\${data.done} of \${data.total}\`;
  }
  if (kind === "finished") {
    document.querySelector("#status").textContent = \`Done: \${data.copied} copied and verified\`;
    document.querySelector("#run").disabled = false;
  }
};
~~~
Add [[<progress value="0" max="1"></progress>]] to the HTML.

## Stopping a job
Give the person a Stop button. Python checks a flag between files:
~~~python
self._stop = threading.Event()        # in start_import, before the thread starts

# inside the loop:
if self._stop.is_set():
    self._send("finished", {"copied": done, "stopped": True})
    return

def stop(self):                        # called from the Stop button
    self._stop.set()
~~~

## Taking turns
The real suite lets several tools run at once, but tools that share the [[C:\\1]] working folder take turns. The simplest version: a [[threading.Lock()]] that a tool must hold while it works, with a "waiting for another tool" message if it's busy.`,
steps:["Change run_import into start_import with a background thread","Send progress with evaluate_js every 10 files","Add a progress bar and status line to the page","Add a Stop button using threading.Event"] },

{ id:"pd-admin", title:"Settings screens and an admin password", mins:30, kind:"read",
body:`The suite has a Settings page for everyone and an Admin page, protected by a password, for team settings, notices, metrics and publishing.

## Never store a password, store a hash
If you save the password itself, anyone who opens the settings file can read it. Instead, save a **salted hash**: a fingerprint that can check a password but can't be turned back into it. The suite uses **PBKDF2-SHA256**, which is deliberately slow to compute so guessing millions of passwords is impractical.
~~~python
import hashlib, hmac, os

def make_hash(password):
    salt = os.urandom(16)        # random bytes, different for every password
    digest = hashlib.pbkdf2_hmac("sha256", password.encode(), salt, 200_000)
    return {"salt": salt.hex(), "hash": digest.hex(), "rounds": 200_000}

def check_password(password, stored):
    salt = bytes.fromhex(stored["salt"])
    digest = hashlib.pbkdf2_hmac("sha256", password.encode(), salt, stored["rounds"])
    return hmac.compare_digest(digest.hex(), stored["hash"])
~~~
- The **salt** means two people with the same password get different hashes.
- [[hmac.compare_digest]] compares in a way that doesn't leak timing clues.

## Slow down guessing
The suite locks for 30 seconds after 5 wrong tries:
~~~python
import time

class Api:
    _fails, _locked_until = 0, 0

    def admin_login(self, password):
        if time.time() < self._locked_until:
            return {"ok": False, "message": "Too many tries. Wait 30 seconds."}
        if check_password(password, team_settings["admin"]):
            self._fails, self._is_admin = 0, True
            return {"ok": True}
        self._fails += 1
        if self._fails >= 5:
            self._locked_until, self._fails = time.time() + 30, 0
        return {"ok": False, "message": "Wrong password."}
~~~

## Check permission in Python, not just the page
Hiding the Admin button in JavaScript isn't security: anyone can open DevTools and call the function. Every admin-only Python method must check:
~~~python
def save_team_settings(self, new):
    if not getattr(self, "_is_admin", False):
        raise PermissionError("Admin only")
    ...
~~~

## Settings screen pattern
1. On open, JavaScript calls [[get_settings()]] and fills the form.
2. On Save, it sends the form back to [[save_settings(form)]].
3. Python **checks the values** (a drive exists, a number is a number) before saving, and returns a message for anything wrong.`,
steps:["Add get_settings and save_settings to your app with a Settings screen","Store an admin password as a PBKDF2 hash","Lock for 30 seconds after 5 wrong tries","Make one admin-only method that checks permission in Python"] },

{ id:"pd-engine", title:"A separate engine: subprocess and job files", mins:35, kind:"read",
body:`The suite's AI tools need PyTorch, OpenCV and dlib: hundreds of megabytes. Putting them in the main program would make every update huge. So they live in a separate **AI engine** program. The suite hands it a job as a file, the engine writes a result file, and closes. Here's the pattern, with a small engine you can run.

## The engine: engine.py
~~~python
"""Reads a job file, does the work, writes a result file."""
import json, sys
from pathlib import Path


def count_photos(job):
    folder = Path(job["folder"])
    return {"photos": len(list(folder.rglob("*.JPG")))}


TASKS = {"count_photos": count_photos}

if __name__ == "__main__":
    job_path = Path(sys.argv[1])                 # the file name passed on the command line
    job = json.loads(job_path.read_text())
    try:
        result = {"ok": True, **TASKS[job["task"]](job)}
    except Exception as e:
        result = {"ok": False, "error": str(e)}
    job_path.with_suffix(".result.json").write_text(json.dumps(result))
~~~
[[sys.argv]] is the list of words typed after [[python engine.py]] on the command line.

## The suite side: run_engine
~~~python
import json, subprocess, sys, tempfile, uuid
from pathlib import Path

def run_engine(task, **details):
    jobs = Path(tempfile.gettempdir()) / "my-suite-jobs"
    jobs.mkdir(exist_ok=True)
    job_file = jobs / f"{uuid.uuid4().hex}.json"     # a unique name per job
    job_file.write_text(json.dumps({"task": task, **details}))

    subprocess.run([sys.executable, "engine.py", str(job_file)], check=True, timeout=600)

    result = json.loads(job_file.with_suffix(".result.json").read_text())
    job_file.unlink()                                   # tidy up
    job_file.with_suffix(".result.json").unlink()
    if not result["ok"]:
        raise RuntimeError(result["error"])
    return result

print(run_engine("count_photos", folder="practice/fake-sd-cards"))
~~~
- [[subprocess.run]] starts another program and waits for it. [[sys.executable]] is the Python that's running now, so the engine uses the same venv.
- [[timeout=600]] stops waiting after 10 minutes, so a stuck engine can't hang the suite.
- When packaged, the command becomes the engine's own .exe instead of [[python engine.py]].

## Why a file and not the network?
A job file needs no server and no port, works the same on every PC, and leaves a trail if something goes wrong. It's also one reason the suite is easy to explain to IT.

## Progress from the engine
For long engine jobs, the engine can write progress lines to a small file (or print them), and the suite reads them while it waits. Start simple: a job either succeeds or reports a clear error.`,
steps:["Write engine.py with one task","Write run_engine and call it from a script","Add a second task to the engine (e.g. list the biggest files)","Call run_engine from your app's Api in a background thread"] },

{ id:"pd-tests", title:"Automatic tests: pytest and unittest", mins:35, kind:"read",
body:`The suite has a folder full of automatic tests, and its build script won't build a new version until they all pass. Tests are small functions that run your code with known inputs and check the answers. They catch the bug you'd otherwise find on a school's photo day.

## Step 1: Install pytest
~~~sh
pip install pytest
~~~

## Step 2: Write tests
Make a **tests** folder with a file **test_seasons.py** (test files and functions must start with [[test_]]):
~~~python
from seasons import season_for


def test_september_starts_new_season():
    assert season_for(2026, 9) == "26-27_Season"


def test_july_is_previous_season():
    assert season_for(2026, 7) == "25-26_Season"


def test_august_first_is_the_boundary():
    assert season_for(2026, 8) == "26-27_Season"
~~~
[[assert]] means "this must be true". If it isn't, the test fails and pytest shows both values.

## Step 3: Run them
~~~mac
python3 -m pytest
~~~
~~~win
python -m pytest
~~~
**You should see:** [[3 passed]]. Break season_for on purpose and run again to see what a failure looks like.

## Testing file tools safely
pytest gives each test a fresh empty folder called [[tmp_path]], so tests never touch real files:
~~~python
from importer import plan_import

def test_plan_names_photos(tmp_path):
    card = tmp_path / "CARD1" / "DCIM"
    card.mkdir(parents=True)
    (card / "IMG_0001.JPG").write_bytes(b"fake")
    plan = plan_import(tmp_path, tmp_path / "out")
    assert plan[0][1].name == "ABCD27-OD-1-000001.jpg"
~~~

## What's worth testing
- Anything that names, sorts or counts: file names, seasons, stack-cut order
- Edge cases: an empty folder, a duplicate name, a lowercase [[.jpg]]
- Every bug you fix: write a test that would have caught it, so it never comes back

This is why logic lives in modules like importer.py, separate from the window: functions are easy to test, buttons are not.

## The other style: unittest (what the suite uses)
Python comes with its own test library, **unittest**, so it needs nothing installed. The suite's tests are written this way. The same three tests look like this:
~~~python
import unittest
from seasons import season_for


class SeasonTests(unittest.TestCase):
    def test_september_starts_new_season(self):
        self.assertEqual(season_for(2026, 9), "26-27_Season")

    def test_july_is_previous_season(self):
        self.assertEqual(season_for(2026, 7), "25-26_Season")
~~~
Run every test in the **tests** folder:
~~~sh
python -m unittest discover -s tests
~~~
**You should see:** dots, then [[OK]]. The differences are mostly spelling: a class that inherits from [[unittest.TestCase]], and [[self.assertEqual(a, b)]] instead of [[assert a == b]]. For temporary folders, unittest uses [[tempfile.TemporaryDirectory()]] where pytest gives you [[tmp_path]].

Both are fine. pytest can also run unittest-style tests, so you can read the suite's tests and write your own in whichever style you prefer.`,
steps:["Install pytest and write test_seasons.py","Run the tests and see them pass","Break the code on purpose and read the failure","Write a tmp_path test for plan_import","Rewrite one test in unittest style and run it with python -m unittest"] },

{ id:"pd-package", title:"Package it: PyInstaller", mins:35, kind:"read",
body:`People on your team won't install Python. **PyInstaller** bundles your program, Python itself and every library into an app they can double-click. The suite's [[3_build.bat]] runs PyInstaller.

## Step 1: Find your files when packaged
Packaged apps unpack your files into a different folder, so relative paths like [["ui/index.html"]] stop working. Use a helper:
~~~python
import sys
from pathlib import Path

def resource(rel):
    base = Path(getattr(sys, "_MEIPASS", Path(__file__).parent))
    return str(base / rel)

window = webview.create_window("My Digital Suite", resource("ui/index.html"), js_api=api)
~~~
[[sys._MEIPASS]] only exists inside a packaged app; when you run app.py normally, it falls back to the app.py folder.

## Step 2: Build
~~~sh
pip install pyinstaller
~~~
~~~mac
pyinstaller --noconfirm --windowed --name "My Digital Suite" --add-data "ui:ui" app.py
~~~
~~~win
pyinstaller --noconfirm --windowed --name "My Digital Suite" --add-data "ui;ui" app.py
~~~
- [[--windowed]]: no black console window behind the app.
- [[--add-data "ui:ui"]]: include the ui folder (Windows uses [[;]] between the two parts, Mac uses [[:]]).
- Results go in [[dist/]]. {{On a Mac you get My Digital Suite.app.|On Windows you get a folder with My Digital Suite.exe inside; the whole folder is the app.}}

## Step 3: A version number
Make **version.py** with [[VERSION = "0.1.0"]], import it, and show it in the window. The suite keeps its version in [[app\\version.py]] and raises it before every build. Version numbers usually go **major.minor.patch**: patch for fixes, minor for new features, major for big changes.

## Folder or one file?
PyInstaller can make one single .exe ([[--onefile]]), which unpacks itself to a temporary folder every time it starts. That's slower to open and harder to update, and antivirus programs are more suspicious of it. The suite ships as a folder for those reasons.

## Make it repeatable
Put the commands in a script so every build is the same. On Windows, **build.bat**:
~~~win
@echo off
call .venv\\Scripts\\activate
python -m pytest || exit /b 1
pyinstaller --noconfirm --windowed --name "My Digital Suite" --add-data "ui;ui" app.py
~~~
[[|| exit /b 1]] stops the build if any test fails. That's the suite's 2_test.bat and 3_build.bat in one.

## If something goes wrong
- **The app opens and closes instantly:** build once without [[--windowed]] and run it from a terminal to see the error.
- **A file isn't found when packaged:** it needs [[--add-data]] and the resource() helper.
- **Antivirus or SmartScreen warns:** normal for unsigned apps you build yourself (see "Put it in your team's hands").`,
steps:["Add the resource() helper and use it for ui/index.html","Install PyInstaller and build the app","Open the built app from dist","Add version.py and show the version in the window","Write a build script that runs tests first"] },

{ id:"pd-ship", title:"Put it in your team's hands: launcher and updates", mins:35, kind:"read",
body:`The suite installs and updates itself from a shared team folder, with no admin rights and no internet. Here's how that works, and a simple version you can build.

## The publish side
The admin builds a new version and copies it to the team folder:
~~~text
S:\\Team\\Suite\\
├── releases\\
│   ├── 1.2.3\\           the previous version (kept for rollback)
│   └── 1.2.4\\           the newest
│       ├── (the app's files)
│       └── manifest.json  every file's name and SHA-256 fingerprint
└── latest.json            {"version": "1.2.4"}
~~~
Making the manifest is a few lines with your [[sha256]] function:
~~~python
files = {str(p.relative_to(build)): sha256(p) for p in build.rglob("*") if p.is_file()}
(build / "manifest.json").write_text(json.dumps({"version": VERSION, "files": files}, indent=2))
~~~

## The launcher side
The small program people double-click does this every time:
1. Read [[latest.json]] from the team folder.
2. If that version isn't installed in the user's app-data folder, copy it into [[versions\\1.2.4\\]].
3. **Check every copied file against the manifest.** If any fingerprint is wrong, delete the copy and keep using the old version. A half-copied update never runs.
4. Remember which version is current and keep the previous one, so Settings can roll back.
5. Start the suite from [[versions\\<current>\\]].

~~~python
def verify(folder):
    manifest = json.loads((folder / "manifest.json").read_text())
    for rel, expected in manifest["files"].items():
        f = folder / rel
        if not f.exists() or sha256(f) != expected:
            return False
    return True
~~~

## Rules the suite follows
- Never update while a tool is running.
- Keep the previous version on each PC for one-click rollback.
- Ship the big AI engine separately, and only copy it when its version changes.
- Publish to a **test** folder first, try it, then publish to the team. (The suite's 4_publish_to_test.bat and 5_publish_to_team.bat.)

## Unsigned apps
Apps you build yourself aren't **code-signed**, so Windows SmartScreen or antivirus may ask once on first run ("More info", "Run anyway"), and a Mac may say it can't check the developer (right-click, Open). For an internal tool, IT can allow-list the team folder; signing certificates are the paid alternative.

## Write it down
The suite has an Admin Manual and an IT overview. Write a short README for yours: how to build, test, publish and roll back. It's what lets someone else look after it, and it's how future you remembers.`,
steps:["Write a publish script that copies dist to a releases/<version> folder with a manifest","Write latest.json","Write a launcher that copies, verifies and starts the newest version","Test an update and a rollback using two versions"] },

{ id:"pd-offline", title:"Offline and private by design (FOIPPA)", mins:20, kind:"read",
body:`The suite handles student photos and data, so it was built to work fully offline, and IT can verify it. These are the rules it follows, which you should follow for any tool that touches personal information.

## 1. No network code
The suite's code makes no web requests, sends no usage statistics and checks no websites for updates. Search your code for [[requests]], [[urllib]], [[http]], [[socket]] and any library that "phones home".

## 2. Watch your libraries
Libraries can go online without you asking. The original tools had two examples:
- A face-detection tool **downloaded its model files from GitHub** if they were missing. Fix: ship the model files with the app and remove the download code.
- The **Ultralytics** AI library sends anonymous usage statistics unless its [[sync]] setting is off. Fix: turn it off in code at start-up.

## 3. Block the network in the engine
The suite's AI engine switches off outgoing connections when it starts, so even a library's hidden download fails loudly instead of quietly sending data:
~~~python
import os, socket

for key in ["HF_HUB_OFFLINE", "TRANSFORMERS_OFFLINE", "YOLO_OFFLINE"]:
    os.environ[key] = "1"                       # tell libraries to stay offline

_real_connect = socket.socket.connect
def _local_only(self, address):
    host = address[0] if isinstance(address, tuple) else address
    if host not in ("127.0.0.1", "::1", "localhost"):
        raise OSError("Network access is switched off in this engine")
    return _real_connect(self, address)
socket.socket.connect = _local_only
~~~

## 4. No servers
Don't run a local web server for your screen: the old PNG Cleaner's Streamlit page could be opened by other PCs on the network. pywebview's bridge needs no server at all.

## 5. Keep personal data where it belongs
- Read and write only the department's job folders and folders the person picks. Keep no extra copies.
- Logs and metrics: counts and tool names, **never student names**.
- Training data for AI models (real student photos) stays on a secured drive, never in the app or in Git.
- Clear temporary data, like a face-matching cache, when the job ends.

## 6. Make it checkable
The suite's IT overview includes a read-only PowerShell command that lists any outside connection the suite makes while running. Being able to prove "nothing leaves the building" is part of the design.`,
quiz:[
 {q:"A library you use downloads a model file the first time it runs. What's the FOIPPA-safe fix?", o:["Leave it, it's only a model","Ship the file with the app and remove or block the download","Run it only on fast internet"], a:1, why:"Shipping the file keeps it working offline; blocking the network makes any hidden request fail loudly."},
 {q:"What should a metrics log contain?", o:["Student names, so you can see who was processed","Counts, tool names, dates: no student names or file names","The photos themselves"], a:1, why:"Metrics answer \"how much and how fast\". Personal information doesn't belong there."}
] }
]},

{ id:"pyai", title:"Images and AI tools", blurb:"QR codes, photo metadata and face matching: what the suite's AI engine does, kept offline.", lessons:[
{ id:"ai-opencv", title:"Computer vision basics and reading QR codes", mins:35, kind:"read",
body:`**OpenCV** is the standard library for computer vision: finding things in images. The suite's QR Metadata Writer uses it to read the QR card held up in each school photo.

## Step 1: Install
~~~sh
pip install opencv-python
~~~
(Imported as [[cv2]].)

## Step 2: Make a practice QR photo
Make a QR code image with any QR generator app or [[pip install qrcode]] and:
~~~python
import qrcode
qrcode.make("https://example.com/order?code=ABCD-000123").save("practice/qr.png")
~~~

## Step 3: Read it
~~~python
import cv2

img = cv2.imread("practice/qr.png")             # OpenCV images are grids of numbers
detector = cv2.QRCodeDetector()
text, points, _ = detector.detectAndDecode(img)
print(text or "No QR code found")
~~~

## Real photos are harder
In a school photo the QR card is small, tilted, maybe blurry. The suite tries several approaches in order until one works, the same idea you'd use:
1. Look only at the corner where the card usually is (faster and more accurate).
2. Try the whole image.
3. Boost the contrast and try again.
4. Cut the image into tiles and try each.
5. Use a small AI model to **find** the card, then straighten and enlarge it before reading.

~~~python
def read_qr(path):
    img = cv2.imread(str(path))
    h, w = img.shape[:2]
    tries = [img[h//2:, w//2:],                         # bottom-right quarter
             img,
             cv2.convertScaleAbs(img, alpha=1.8, beta=0)]   # more contrast
    for attempt in tries:
        text, _, _ = cv2.QRCodeDetector().detectAndDecode(attempt)
        if text:
            return text
    return None
~~~

## From QR text to a code
The suite keeps the part after [[code=]] or [[id=]]:
~~~python
from urllib.parse import urlparse, parse_qs
q = parse_qs(urlparse(text).query)
code = (q.get("code") or q.get("id") or [None])[0]
~~~
([[urllib.parse]] only splits text apart; it doesn't touch the network.)

## What to do with failures
The original tool moved unreadable photos into an [[error]] folder without saying so. Better: list them in the results, let the person decide, and log the count.`,
steps:["Install opencv-python and qrcode","Generate a practice QR image and read it","Write read_qr with several attempts","Pull the code out of the QR text"] },

{ id:"ai-metadata", title:"Writing photo metadata", mins:25, kind:"read",
body:`Photos carry hidden details called **metadata** (EXIF and XMP): camera, date, and fields like Artist and Author. The suite writes each photo's subject code into its metadata, so other software can sort photos by student **without changing a single pixel**.

## Why ExifTool
Opening a JPEG in Pillow and saving it again **re-compresses** it, which slightly changes the picture every time. **ExifTool** edits only the metadata and leaves the image data untouched. It's a free command-line program that the suite ships inside itself.

## Step 1: Get ExifTool
Download it from [exiftool.org](https://exiftool.org).

[mac] Use the macOS package installer, then check with [[exiftool -ver]] in a new terminal.

[win] Unzip the Windows executable, rename it to **exiftool.exe**, put it in your project's **tools** folder, and keep its **exiftool_files** folder next to it.

## Step 2: Read and write from Python
~~~python
import subprocess

EXIFTOOL = "exiftool"            # on Windows: r"tools\\exiftool.exe"

def read_artist(photo):
    out = subprocess.run([EXIFTOOL, "-s3", "-Artist", str(photo)],
                         capture_output=True, text=True, check=True)
    return out.stdout.strip()

def write_code(photo, code):
    subprocess.run([EXIFTOOL, "-overwrite_original", f"-Artist={code}",
                    f"-XMP-dc:Creator={code}", str(photo)], check=True,
                   capture_output=True)
~~~
- Each part of the command is a separate list item, so spaces in folder names are safe.
- [[-overwrite_original]] stops ExifTool leaving a [[_original]] backup next to every photo. Only use it once you trust your code; test on copies first.
- [[capture_output=True, text=True]] collects what the program printed so Python can read it.

## Speed
ExifTool starts up for every call, which is slow for thousands of photos. It can process a whole list in one run ([[-@ argfile.txt]]), and the suite also spreads work across several threads. Start simple; optimise when it's too slow.`,
steps:["Install ExifTool and check its version","Write a code into a practice photo's Artist field","Read it back to confirm","Combine with read_qr: read each photo's QR and write its code"] },

{ id:"ai-faces", title:"Matching faces, carefully", mins:30, kind:"read",
body:`Two suite tools match faces: **SD Match** finds one student across a folder of photos, and **Bndl** matches convocation photos to reference photos. Here's how face matching works, and the care it needs.

## How it works
1. **Detect**: find each face in a photo and draw a box around it.
2. **Encode**: turn each face into a list of numbers (an **embedding**, a "face fingerprint"). Photos of the same person give similar lists.
3. **Compare**: measure the distance between two fingerprints. Smaller distance = more likely the same person.

## Try it with face_recognition
~~~sh
pip install face_recognition
~~~
[win] This library needs **dlib**, which must be compiled on Windows: install **CMake** and Visual Studio's **Desktop development with C++** first. If it won't install, read along now and try it on a Mac, or use OpenCV's YuNet and SFace models (what SD Match uses), which install easily but need two model files shipped with your app.

~~~python
import face_recognition as fr

ref = fr.face_encodings(fr.load_image_file("reference.jpg"))[0]

for path in photos:
    img = fr.load_image_file(path)
    for face in fr.face_encodings(img):
        distance = fr.face_distance([ref], face)[0]
        confidence = round((1 - distance) * 100)
        if distance < 0.5:
            print(path.name, f"{confidence}% match")
~~~
Practise with photos of yourself or consenting friends, never students.

## Confidence, not certainty
Face matching makes mistakes, especially with siblings, glasses, low light or tilted heads. The suite's tools are built around that:
- Show a **confidence %** and mark low ones as borderline (SD Match shows matches above 35% and flags those under 49%).
- Let the person mark **Not a match** and re-run unmatched photos.
- In group photos, let the person **pick which face** to use.
- Never act on a match automatically when getting it wrong would matter.

## Privacy rules for face data
Face fingerprints are biometric information. Keep them only for the current job and delete them when it ends (Bndl clears its cache on close), never send them anywhere, and don't store them with names.`,
quiz:[
 {q:"What's a face embedding?", o:["A cropped photo of the face","A list of numbers describing the face, used for comparing","The person's name"], a:1, why:"Embeddings turn a face into numbers so two faces can be compared by distance."},
 {q:"A match comes back at 41% confidence. What should the tool do?", o:["Accept it automatically","Show it as borderline so a person checks it","Delete the photo"], a:1, why:"Low-confidence matches need a human decision."}
] }
]},
