async function runReview(target, statusEl, outEl, btn, opts){
  if(SAMPLE === undefined){ statusEl.textContent = "Connecting…"; await sampleReady; }
  if(!SAMPLE || SAMPLE_BLOCKED){ statusEl.className = "rev-status no"; statusEl.textContent = SAMPLE_BLOCKED ? "Feedback is turned off for this page. You can allow it from the page's Permissions menu." : "Feedback only works when this page is open in Claude (claude.ai or the Claude app)."; return null; }
  const ctl = new AbortController();
  const stopBtn = document.createElement("button"); stopBtn.type = "button"; stopBtn.className = "btn ghost"; stopBtn.textContent = "Stop"; stopBtn.onclick = () => ctl.abort();
  btn.disabled = true; const oldLabel = btn.textContent; btn.textContent = "Reviewing…";
  statusEl.className = "rev-status"; statusEl.textContent = "Reading your code. A thorough review usually takes 20–60 seconds. "; statusEl.append(stopBtn);
  outEl.innerHTML = "";
  try{
    const sopts = { signal: ctl.signal, cache: false };
    if(target.images && target.images.length) sopts.images = target.images;
    const r = await SAMPLE.json(buildPrompt(target), sopts);
    if(!r || typeof r !== "object") throw {code:"invalid_json"};
    statusEl.textContent = ""; renderReport(r, outEl, opts); markToday();
    return r;
  }catch(e){
    statusEl.className = "rev-status no";
    statusEl.textContent = e && e.code === "cancelled" ? "Stopped." : sampleErrorCopy(e && e.code);
    return null;
  }finally{ btn.disabled = false; btn.textContent = oldLabel; }
}

function chatMd(t){
  const lines = String(t).split("\n"); let inFence = false; const out = [];
  for(let l of lines){
    const f = l.match(/^\s*```\s*([\w+-]*)\s*$/);
    if(f){ out.push(inFence ? "~~~" : "~~~" + (f[1]||"").toLowerCase()); inFence = !inFence; continue; }
    if(!inFence){
      l = l.replace(/^#{1,6}\s+/, "## ").replace(/^\s*[*•]\s+/, "- ").replace(/^\s+(\d+\.\s)/, "$1").replace(/^\s+-\s/, "- ");
      l = l.replace(/`([^`\n]+)`/g, "[[$1]]");
    }
    out.push(l);
  }
  if(inFence) out.push("~~~");
  return md(out.join("\n"));
}

{ id:"flex-grid", q:"Should I use Flexbox or Grid?", k:"flex grid flexbox difference which when", l:["css-flex","css-grid"],
a:`Flexbox for a **row** (or column) of things: nav bars, buttons, a card's contents. Grid for a **layout in rows and columns**: galleries, dashboards, page sections. Both are fine to mix: a grid of cards, each card using flex inside.` },
{ id:"rem-px", q:"What are rem, px, % and fr?", k:"rem px em percent fr unit size", l:["css-selectors","css-grid","css-responsive"],
a:`- **px**: a fixed size. Good for borders and small details.
- **rem**: relative to the browser's base text size (usually 16px, so [[1.5rem]] = 24px). Use it for text so it grows if someone sets larger text.
- **%**: a share of the parent's size.
- **fr**: in Grid, a share of the leftover space.` },
{ id:"media-query", q:"My media query isn't working", k:"media query not working responsive phone breakpoint", l:["css-responsive"],
a:`1. Check the syntax: [[@media (min-width: 600px) { .cols { ... } }]], with both sets of curly brackets.
2. Put media queries **after** the normal rules, or the normal rules undo them.
3. In a real file, the [[<head>]] needs [[<meta name="viewport" content="width=device-width, initial-scale=1">]] (the ! + Tab starting code includes it).
4. In the playground, use the **Phone** button above the preview to test narrow screens.` },
{ id:"lists", q:"How do I make a bulleted or numbered list?", k:"list lists bullet bulleted numbered ordered unordered ul ol li items", l:["html-structure"],
a:`Use [[<ul>]] for bullet points or [[<ol>]] for a numbered list, with each item in an [[<li>]]:
~~~html
<ol>
  <li>First step</li>
  <li>Second step</li>
</ol>
~~~
To remove the bullets with CSS: [[ul { list-style: none; padding: 0; }]]` },
{ id:"closing-tags", q:"Everything after one spot is bold, a link, or in the wrong place", k:"closing tag missing everything bold link nested wrong place broken layout", l:["html-first","html-structure","html-links"],
a:`A tag isn't closed. Find the last part that looks right, then check the element just before it has its closing tag, like [[</a>]], [[</strong>]] or [[</div>]]. Close tags in reverse order of opening: [[<p><a>...</a></p>]]. VS Code highlights the matching tag when you click on one.` },
{ id:"image-not-showing", q:"My image isn't showing", k:"image img not showing broken picture src path", l:["html-links","proj-files"],
a:`1. Check the [[src]] path matches where the file really is, relative to the HTML file: [[images/cat.jpg]] means a folder called images next to your HTML file.
2. Check capitals and the ending: [[.jpg]], [[.jpeg]] and [[.png]] are different.
3. In the playground, only the built-in [[mountains.svg]] works, because pictures from the internet are blocked.` },
{ id:"html-element-terms", q:"What's the difference between a tag, an element and an attribute?", k:"tag element attribute difference terms html", l:["html-first","html-links"],
a:`In [[<a href="page.html">Click</a>]]:
- **Tags** are the bits in angle brackets: [[<a>]] opens, [[</a>]] closes.
- The **element** is the whole thing: opening tag, content and closing tag.
- [[href="page.html"]] is an **attribute**: an extra setting written inside the opening tag.` },

/* ---------- JavaScript ---------- */
{ id:"let-const", q:"When do I use let and when const?", k:"let const var difference variable change reassign", l:["js-variables"],
a:`Use [[const]] by default. Use [[let]] only when you'll give the variable a new value later (like a score that goes up). If you try to change a [[const]], you'll get "Assignment to constant variable", which tells you to switch it to [[let]]. Avoid [[var]]; it's the old way.` },
{ id:"equals", q:"What's the difference between =, == and ===?", k:"= == === equals comparison assign difference", l:["js-if"],
a:`- [[=]] **puts** a value into a variable: [[score = 10]]
- [[===]] **asks** "are these the same?" and gives true or false. Always use this one for comparisons.
- [[==]] also compares, but converts types first so [["5" == 5]] is true, which hides bugs. Avoid it.

A common bug: [[if (x = 5)]] sets x instead of comparing. Write [[if (x === 5)]].` },
{ id:"string-number", q:"Adding numbers gives \"53\" instead of 8", k:"adding numbers concatenation string 53 joined instead of add Number", l:["js-strings","dom-forms"],
a:`One of the values is text (a string), so [[+]] joins them instead of adding. Values from inputs are always strings. Convert first:
~~~js
const a = Number(input.value);
~~~
Then [[a + 3]] does real math.` },
{ id:"return-log", q:"What's the difference between return and console.log?", k:"return console.log difference undefined function output", l:["js-functions"],
a:`[[console.log]] **shows** a value in the console for you to read. [[return]] **hands** the value back to the code that called the function, so it can be stored or used:
~~~js
function double(n) { return n * 2; }
const x = double(4);   // x is 8
~~~
If a function only logs, using its result gives [[undefined]].` },
{ id:"undefined", q:"My function gives undefined", k:"undefined function returns nothing missing return", l:["js-functions","js-objects"],
a:`The function doesn't [[return]] anything, or it returns before reaching your value. Make sure the last step is [[return yourValue;]]. With arrow functions using curly brackets, you need the [[return]] word too: [[(n) => { return n * 2; }]]` },
{ id:"map-filter", q:"When do I use map, filter or a for loop?", k:"map filter foreach for loop difference array when", l:["js-arrays","js-objects"],
a:`- **map**: you want a new array with every item changed. [[prices.map((p) => p * 2)]]
- **filter**: you want a new array with only some items. [[prices.filter((p) => p < 10)]]
- **for...of loop**: you want to do something with each item, like adding them up or logging them.` },
{ id:"zero-index", q:"Why does my array start at 0?", k:"array index 0 zero first item position", l:["js-arrays"],
a:`JavaScript counts positions from 0. In [[["a", "b", "c"]]], [[list[0]]] is "a" and [[list[2]]] is "c". The last item is always [[list[list.length - 1]]].` },
{ id:"infinite-loop", q:"My page froze / the playground stopped my code", k:"frozen infinite loop never ends stopped 3 seconds hang while", l:["js-loops"],
a:`A loop's condition never becomes false, so it runs forever. Check:
1. Is the counter changing each lap ([[i++]])?
2. Is it moving towards the end? [[i--]] with [[i < 10]] never stops.
3. In a [[while]] loop, does something inside change the condition?` },
{ id:"text-html-value", q:"textContent, innerHTML or value: which do I use?", k:"textcontent innerhtml value difference input text", l:["dom-select","dom-forms","dom-create"],
a:`- [[.value]]: what's typed in an input, select or textarea.
- [[.textContent]]: the text inside an element. Use it to show text, especially anything a person typed.
- [[.innerHTML]]: treats text as HTML. Only use it with text you wrote yourself (or to clear: [[innerHTML = ""]]).` },
{ id:"form-reload", q:"My form resets / the page reloads when I submit", k:"form reload page refresh submit clears preventdefault", l:["dom-forms","html-forms"],
a:`Submitting a form reloads the page by default. Stop it at the start of your submit listener:
~~~js
form.addEventListener("submit", (event) => {
  event.preventDefault();
  // ...your code
});
~~~` },
{ id:"listener-not-running", q:"Clicking my button does nothing", k:"click button nothing happens event listener not working", l:["dom-events","dom-forms"],
a:`1. Put [[console.log("clicked")]] as the first line inside your listener and click. If nothing logs, the listener isn't attached.
2. Check the selector in [[querySelector]] matches the button's id or class exactly ([[#]] for id, [[.]] for class).
3. Check the event name is in quotes and lowercase: [["click"]].
4. In a real page, the script must load after the HTML ([[defer]] or at the end of body).
5. Check the console for red errors.` },
{ id:"local-storage-object", q:"localStorage saves [object Object] or my list disappears", k:"localstorage object object save load list json stringify parse", l:["fetch-storage"],
a:`localStorage only stores text. Convert when saving and loading:
~~~js
localStorage.setItem("todos", JSON.stringify(todos));
const todos = JSON.parse(localStorage.getItem("todos") || "[]");
~~~
Also save after **every** change, and load when the page starts.` },
{ id:"what-json", q:"What is JSON?", k:"json what is format data", l:["js-objects","fetch-storage"],
a:`JSON is a way of writing data as text, so it can be saved or sent over the internet. It looks like a JavaScript object, but property names are in double quotes: [[{"name": "Ada", "age": 36}]]. [[JSON.stringify(x)]] turns data into JSON text; [[JSON.parse(text)]] turns it back.` },

/* ---------- playground & checks ---------- */
{ id:"check-fails", q:"Check my work says it's wrong but it looks right", k:"check my work fails wrong looks right red cross not passing", l:[],
a:`1. Read the red items: each one says exactly what's being checked.
2. Look in the **Console** box for red errors. One error can stop everything after it.
3. Check exact spelling, capitals and punctuation: [["Bring a sweater"]] isn't [["bring a sweater"]].
4. Make sure names match what the task asks for, like a variable called [[total]] or an id of [[email]].
5. Press **Hint** for the next nudge.` },
{ id:"editor-tab", q:"I can't leave the code editor with Tab", k:"tab key editor focus leave escape indent", l:[],
a:`In the editor, Tab adds spaces for indenting. Press **Esc** first, then Tab moves on to the next button.` },
{ id:"reset-code", q:"I broke my code. How do I start the exercise again?", k:"reset start over starter broke undo", l:[],
a:`Press **Reset** above the editor, then press it again to confirm. Your code goes back to how the exercise started. Or press {{Cmd + Z|Ctrl + Z}} in the editor to undo step by step.` },

{ id:"enoent", q:"npm ERR! code ENOENT / Could not read package.json", k:"enoent package.json could not read npm err", m:/(ENOENT|could not read package\.json)/i, l:["npm"],
a:`npm can't find **package.json**, which means the terminal is in the wrong folder. Run [[pwd]], then [[cd]] into the folder that contains package.json (your project folder), and try again.` },
{ id:"missing-script", q:"npm says Missing script: \"start\"", k:"missing script start npm run start", m:/missing script/i, l:["npm"],

/* ---------- Python ---------- */
{ id:"py-not-found", q:"\"python\" not found / not recognized / opens the Microsoft Store", k:"python not found not recognized command store install path python3 py", m:/(command not found: python|'python3?' is not recognized|python3? : the term|python was not found)/i, l:["py-install"],
a:`::: mac
On a Mac, type [[python3]], not [[python]]. If [[python3]] isn't found either, install Python from python.org, then close and reopen the terminal.
:::
::: win
Windows can't find your Python install, or a Microsoft Store shortcut is getting in the way.
1. Try [[py --version]]. If that works, use [[py]] instead of [[python]].
2. To fix it for good: open **Settings > Apps > Advanced app settings > App execution aliases** and switch off the two **python.exe** / **python3.exe** "App Installer" entries.
3. Still not found? Run the Python installer again, choose **Modify**, and tick **Add Python to environment variables**. Then close and reopen the terminal.
:::` },
{ id:"pip-not-found", q:"\"pip\" not found or installs to the wrong place", k:"pip not found not recognized install library pip3", m:/(command not found: pip|'pip3?' is not recognized|pip3? : the term)/i, l:["py-venv","py-install"],
a:`Run pip through Python itself, which always uses the right one: {{[[python3 -m pip install pandas]]|[[python -m pip install pandas]]}}. Better still, activate your project's venv first; then plain [[pip]] works and installs into the project.` },
{ id:"module-not-found", q:"ModuleNotFoundError: No module named …", k:"modulenotfounderror no module named import error installed library venv", m:/(ModuleNotFoundError|No module named)/i, l:["py-venv","pd-first","py-pandas","py-images"],
a:`Python can't find that library in the Python you're running.
1. Is the venv active? Look for [[(.venv)]] at the start of the prompt. If not, activate it: {{[[source .venv/bin/activate]]|[[.venv\\Scripts\\Activate.ps1]]}}.
2. Install it into that venv: [[pip install <name>]]. Some import names differ from install names: [[import cv2]] → [[pip install opencv-python]]; [[import PIL]] → [[pip install pillow]]; [[import webview]] → [[pip install pywebview]].
3. In VS Code, check the Python version shown in the bottom-right corner is the one from .venv; click it to choose.` },
{ id:"indentation-error", q:"IndentationError or \"expected an indented block\"", k:"indentationerror indent indented block unexpected indent spaces tabs", m:/(IndentationError|expected an indented block|unexpected indent|unindent does not match)/i, l:["py-basics","py-collections","py-functions"],
a:`Python uses indentation to know which lines belong to an if, a loop or a function.
- After a line ending in a colon, the next line must be indented 4 more spaces.
- Lines in the same block must line up exactly.
- Don't mix tabs and spaces: in VS Code, open the Command Palette and run **Convert Indentation to Spaces**.

Paste your code in this box: the code checker points to the exact line.` },
{ id:"py-syntax", q:"SyntaxError in Python (invalid syntax, expected ':')", k:"syntaxerror invalid syntax expected colon python", m:/(SyntaxError: (invalid syntax|expected ':'|unterminated string|'\(' was never closed))/i, l:["py-basics","py-functions"],
a:`Python couldn't read a line. Look at the line it names **and the line before it** for:
- a missing colon at the end of [[if]], [[for]], [[def]], [[else]] or [[with]] lines
- a missing closing bracket or quote
- JavaScript habits: [[{ }]] for blocks, [[else if]] instead of [[elif]], [[&&]] instead of [[and]]

Paste the code here to have the checker find it.` },
{ id:"py-traceback", q:"How do I read a Python error (traceback)?", k:"traceback error read python most recent call last line", l:["py-functions"],
a:`Read it **from the bottom up**. The last line is the error type and message. The lines just above it show the file and line number where it happened, with your own file nearest the bottom. Go to that line first. If the error is inside a library, look for the last line that mentions **your** file: that's the call that went wrong.` },
{ id:"filenotfound", q:"FileNotFoundError: No such file or directory (Python)", k:"filenotfounderror no such file directory path python open relative", m:/FileNotFoundError/i, l:["py-files","py-practice-data","py-pandas"],
a:`Relative paths like [["practice/class_list.csv"]] start from the folder the **terminal** is in, not where the .py file is.
1. Run [[pwd]]: you should be in your project folder (python-practice).
2. Check the practice data exists: run make_practice_data.py first.
3. Check spelling and capitals in the path.
4. Windows paths need [[r"..."]] or forward slashes.` },
{ id:"venv-activate", q:"How do I activate the virtual environment?", k:"activate venv virtual environment .venv source scripts", l:["py-venv"],
a:`From your project folder: {{[[source .venv/bin/activate]]|[[.venv\\Scripts\\Activate.ps1]]}}. You'll see [[(.venv)]] at the start of the prompt. To leave it, type [[deactivate]].{{| If PowerShell says scripts are disabled, run [[Set-ExecutionPolicy -Scope CurrentUser RemoteSigned]] once.}}` },
{ id:"py-copy", q:"How do I copy, move or rename a file in Python?", k:"copy move rename file python shutil pathlib duplicate", l:["py-files","py-safety"],
a:`~~~python
import shutil
from pathlib import Path

shutil.copy2(src, dst)          # copy, keeping the file's dates (the original stays)
shutil.move(src, dst)           # move it somewhere else
Path(src).rename(new_path)      # rename in the same place
~~~
For photos, prefer **copy** and check the copy before touching the original. See "Check before Run".` },
{ id:"pywebview-blank", q:"My pywebview window is blank or JavaScript can't reach Python", k:"pywebview window blank api undefined pywebviewready js_api python bridge", l:["pd-first","pd-bridge"],
a:`1. Run with [[webview.start(debug=True)]], right-click in the window and choose **Inspect** to see JavaScript errors.
2. Check the path to index.html, and run app.py from its own folder (or use the resource() helper).
3. Only call [[window.pywebview.api]] inside the [[pywebviewready]] listener.
4. Python methods need [[self]] as the first parameter, and must be on the class you passed as [[js_api]]. Methods starting with [[_]] aren't exposed.
5. Python errors show in the terminal you started it from.` },
{ id:"window-freezes", q:"My app window freezes while a job runs", k:"freeze frozen not responding window hang long job thread", l:["pd-threads"],
a:`The job is running on the window's thread. Start it in a background thread ([[threading.Thread(target=..., daemon=True).start()]]) and send progress with [[window.evaluate_js]]. See "Long jobs: threads and progress".` },
{ id:"pyinstaller-missing", q:"My packaged app can't find a file / opens and closes", k:"pyinstaller packaged exe app closes instantly file not found meipass add-data", l:["pd-package"],
a:`1. Build once without [[--windowed]] and run it from a terminal to see the error.
2. Every folder the app reads (like ui) needs [[--add-data]] ({{[["ui:ui"]]|[["ui;ui"]]}}).
3. Load files through the resource() helper that uses [[sys._MEIPASS]].
4. Save settings and logs in the app-data folder, not next to the program.` },
{ id:"antivirus", q:"Antivirus or SmartScreen blocks my built app", k:"antivirus smartscreen defender blocked unsigned pyinstaller exe quarantine", l:["pd-package","pd-ship"],
a:`Apps you build yourself aren't code-signed, so security software is cautious, especially with single-file PyInstaller builds. Build as a folder (not [[--onefile]]), and for a work tool ask IT to allow-list the team folder it runs from. {{On a Mac: right-click the app, choose Open, then Open.|On Windows: More info, then Run anyway.}}` },
{ id:"dlib-install", q:"face_recognition or dlib won't install", k:"dlib face_recognition install cmake visual studio build error wheel", l:["ai-faces"],
a:`dlib has to be compiled. {{On a Mac, install CMake first ([[brew install cmake]] if you use Homebrew), then try again.|On Windows, install CMake and Visual Studio's "Desktop development with C++" workload first.}} If it still fails, use OpenCV's face detector and recognizer instead (what SD Match uses), which install with [[pip install opencv-python]] and need two model files shipped with your app.` },
{ id:"smartscreen", os:"win", q:"Windows says \"Windows protected your PC\"", k:"windows protected your pc smartscreen unsigned run anyway", l:["pd-package","pd-ship"],
a:`This appears for apps that aren't code-signed, like the ones you build yourself. Click **More info**, then **Run anyway**.` },
{ id:"online-vs-offline", q:"What's the difference between an offline app like the suite and an online app?", k:"online offline server website web app internet hosted difference suite", l:["on-how"],
a:`An offline app (like the suite) runs on one computer, with no server listening on the network, so nobody outside can reach it. An online app runs on a **server** that anyone on the internet can send requests to. That means you need logins, permission checks on every request, HTTPS, backups, updates and a plan for your hosting costs. See "How online apps work".` },
{ id:"flask-not-found", q:"\"flask\" not found or \"Address already in use\"", k:"flask command not found address already in use port 5000 run server", m:/(flask: command not found|'flask' is not recognized|Address already in use)/i, l:["on-flask"],
a:`- **flask not found:** activate the project's venv first ({{[[source .venv/bin/activate]]|[[.venv\\Scripts\\Activate.ps1]]}}), then [[pip install flask]] if needed.
- **Address already in use:** another server is already on port 5000 (often one you started earlier in another terminal). Stop it with **Ctrl + C**, or run [[flask --app app run --port 5001]].` },
{ id:"sql-injection", q:"What is SQL injection and how do I prevent it?", k:"sql injection query placeholder parameter database safe sqlite security", l:["on-data","on-security"],
a:`It's when text someone typed ends up **inside** your SQL and changes what it does. Never build SQL by joining strings or with f-strings. Always pass values separately with placeholders: [[con.execute("SELECT * FROM gear WHERE id = ?", (gear_id,))]].` },
{ id:"store-passwords", q:"How should I store passwords?", k:"password store hash login account salt werkzeug bcrypt plain text", l:["on-accounts","td-map"],
a:`Never store the password itself. Store a slow, salted hash made by a tested library: in Flask, [[generate_password_hash]] and [[check_password_hash]] from [[werkzeug.security]]. Better still for work apps: use single sign-on (Microsoft or Google accounts), so you don't store passwords at all. Ask IT first.` },
{ id:"secrets-git", q:"Where do I put API keys and passwords for my app? I committed one by accident.", k:"secret api key password env environment variable gitignore committed leaked github", l:["on-security","on-accounts"],
a:`Keep secrets in **environment variables** or your host's secrets settings, read them with [[os.environ["NAME"]]], and add [[.env]] to [[.gitignore]]. If a secret was ever committed or pushed, **change it now**: deleting the commit isn't enough, because copies may exist and bots scan GitHub for keys within minutes.` },
{ id:"which-privacy-law", q:"Which privacy law applies to me: FOIPPA, PIPA or PIPEDA?", k:"privacy law foippa fippa pipa pipeda which applies bc canada school student data", l:["eth-privacy"],
a:`Roughly: **FOIPPA** for BC public bodies (school districts, government) and the companies doing work for them; **BC PIPA** for private organisations in BC; **PIPEDA** for federally regulated businesses and data crossing borders. See "Privacy law in BC and Canada". This isn't legal advice: for real personal data, ask your privacy officer.` },
{ id:"data-breach", q:"I think I leaked personal data by mistake. What do I do?", k:"breach leak mistake sent wrong email personal data student exposed public repo what do", l:["eth-breach"],
a:`1. **Contain it:** recall the email, remove the share link, make the repo private.
2. **Tell your manager or privacy contact right away.** Don't wait until it's fixed.
3. Write down what happened, when, what data and how many people.
4. Let the people responsible decide about notifying anyone.
Telling someone quickly is never the wrong choice. See "When something goes wrong".` },
{ id:"work-code-github", q:"Can I put code I wrote at work on my public GitHub?", k:"work code github public portfolio employer owns copyright publish", l:["eth-ip"],
a:`Not without permission. In Canada the employer generally owns work an employee creates as part of their job, and work code can reveal internal details. Keep it in your employer's private repository. To show your skills, build your own projects from scratch with the same ideas.` },
{ id:"ai-paste-data", q:"Can I paste real data or screenshots into an AI tool to get help?", k:"ai chatgpt claude paste real data screenshot student names help privacy", l:["eth-ai","eth-kids"],
a:`Not personal information, student data, photos or work secrets, unless your organisation has approved that tool for that data. Recreate the problem with a few made-up rows instead, and replace real paths and names. That's also how the help box in this course should be used.` },
{ id:"accessible-check", q:"How do I check my app is accessible?", k:"accessibility accessible wcag screen reader keyboard contrast check disability", l:["eth-access"],
a:`Use the keyboard only (Tab through everything), check text contrast in the developer tools (at least 4.5 to 1), make sure every field has a label and every image has alt text, zoom to 200%, and listen to the page with {{VoiceOver (Cmd + F5)|Narrator (Windows + Ctrl + Enter)}}. See "Accessibility: apps everyone can use".` }
];

function stem(w){ if(w.length <= 4 || /[^a-z]/.test(w)) return w; let s = w.replace(/(ings|ing|ies|ied|es|ed|s|e)$/, ""); if(s.length < 3) s = w; return s.replace(/([b-df-hj-np-tv-z])\1$/, "$1"); }
function words(t){ const out = []; String(t).toLowerCase().replace(/[^a-z0-9.#+\-' ]+/g, " ").split(/\s+/).map(w => w.replace(/^[.'-]+|[.'-]+$/g, "")).filter(w => w.length > 1 && !STOP.has(w)).forEach(w => { out.push(stem(w)); if(w.includes("-")) w.split("-").forEach(x => { if(x.length > 1 && !STOP.has(x)) out.push(stem(x)); }); }); return out; }
const KB = FAQ.map(e => ({ type:"faq", os:e.os, id:e.id, q:e.q, a:e.a, l:e.l||[], m:e.m, kw:new Set(words(e.k)), qw:new Set(words(e.q)), aw:new Set(words(e.a)) }))
  .concat(ERRORS.map((e,i) => ({ type:"err", id:"err"+i, q:e.title, a:"**What it means:** " + e.means + "\n\n**What to try:** " + e.fix, l:[], m:new RegExp(e.re, "i"), kw:new Set(words(e.title)), qw:new Set(words(e.title)), aw:new Set(words(e.means + " " + e.fix)) })));
function searchKB(query, lessonId){
  const qw = words(query); const out = [];
  for(const e of KB){
    if(e.os && e.os !== S.os) continue;
    let s = 0;
    if(e.m && e.m.test(query)) s += 12;
    for(const w of qw){ if(e.kw.has(w)) s += 3; else if(e.qw.has(w)) s += 2; else if(e.aw.has(w)) s += 0.5; }
    if(s > 0 && qw.length){ let hit = 0; for(const w of qw) if(e.kw.has(w) || e.qw.has(w)) hit++; s += 4 * hit / qw.length; }
    if(s > 0 && lessonId && e.l.includes(lessonId)) s += 2;
    s *= (e.weight || 1);
    if(s >= 3) out.push({ e, s });
  }
  out.sort((a,b) => b.s - a.s);
  const seen = new Set(); return out.filter(x => { const k = x.e.q.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; });
}

  Object.keys(REF).forEach(sheet => REF[sheet].rows.forEach((r, i) => KB.push({ type:"ref", id:"rf:" + sheet + ":" + i, q:r[0] + (sheet === "Terminal" || sheet === "VS Code" ? "" : "") , a: (sheet === "Terminal" || sheet === "VS Code") ? "**" + r[0] + "**\n- Mac: [[" + r[1] + "]]\n- Windows: [[" + r[2] + "]]" : "[[" + r[0] + "]]: " + r[1], sheet, l:[], weight:0.7, kw:new Set(words(r[0] + " " + sheet)), qw:new Set(words(r[0])), aw:new Set(words(r.slice(1).join(" "))) })));

function wireHelp(L){
  const log = document.getElementById("chatLog"), input = document.getElementById("helpInput"), sendBtn = document.getElementById("helpSend");
  const status = document.getElementById("helpStatus"), imgsEl = document.getElementById("helpImgs"), clearBtn = document.getElementById("helpClear"), sug = document.getElementById("helpSuggest");
  let imgs = [], ctl = null, busy = false, typeT = null;
  S.chats = S.chats || {};
  const turns = () => S.chats[L.id] || [];
  const setTurns = t => { S.chats[L.id] = t.slice(-24); save(); };
  const faqById = id => KB.find(e => e.id === id);
  function bubble(role, html){ const d = document.createElement("div"); d.className = "msg " + (role === "user" ? "me" : role === "guide" ? "bot guide" : "bot"); d.innerHTML = html; log.append(d); return d; }
  function guideHtml(t, isLast){
    const e = faqById(t.id); if(!e) return '<p class="muted">That answer is no longer available.</p>';
    const more = (t.more||[]).map(faqById).filter(Boolean);
    const tag = { faq:"From the built-in guide", err:"Error explained", lesson:"From the lesson \u201c" + (e.lessonTitle || "") + "\u201d", gloss:"Glossary", ref:"Cheat sheet: " + (e.sheet || "") }[e.type] || "From the built-in guide";
    const go = e.lid && e.lid !== L.id ? '<div class="pin-actions" style="margin-top:6px"><button type="button" class="btn small-btn" data-open="'+e.lid+'">Open that lesson</button></div>' : "";
    return '<p class="guide-tag">'+esc(tag)+'</p><h4>'+esc(e.q)+'</h4>'+md(e.a)+go+
      (more.length ? '<div class="guide-more"><p class="muted small">Other answers that might fit:</p>'+more.map(m => '<button type="button" class="q-link" data-faq="'+m.id+'">'+esc(m.q)+'</button>').join("")+'</div>' : '')+
      (isLast ? '<div class="guide-actions"><span class="muted small">Did that help?</span><button type="button" class="btn small-btn" data-helped>Yes, thanks</button>'+(SAMPLE !== null ? '<button type="button" class="btn small-btn" data-askclaude>No, ask Claude</button>' : '<button type="button" class="btn small-btn" data-go="unstuck">No, open the stuck guide</button>')+'</div>' : '');
  }
  function drawLog(){
    log.innerHTML = ""; const t = turns();
    t.forEach((x,i) => {
      if(x.role === "user") bubble("user", '<p>'+esc(x.content).replace(/\n/g,"<br>")+'</p>');
      else if(x.role === "guide") bubble("guide", guideHtml(x, i === t.length - 1));
      else if(x.role === "note") bubble("guide", md(x.content));
      else if(x.role === "report"){ const b = bubble("guide", '<p class="guide-tag">'+esc(x.tag || "Code check")+'</p>'); const box = document.createElement("div"); renderReport(x.report, box, {inLesson:true}); b.append(box); if(i === t.length - 1 && SAMPLE !== null){ const a = document.createElement("div"); a.className = "guide-actions"; a.innerHTML = '<span class="muted small">Need more?</span><button type="button" class="btn small-btn" data-askclaude>Ask Claude</button>'; b.append(a); } }
      else bubble("bot", chatMd(x.content));
    });
    clearBtn.hidden = !t.length;
  }
  function drawImgs(){ imgsEl.innerHTML = ""; imgs.forEach((f,i) => { const w = document.createElement("div"); w.className = "thumb"; const im = document.createElement("img"); im.alt = "Screenshot " + (i+1); try{ im.src = URL.createObjectURL(f); }catch(e){} const x = document.createElement("button"); x.type = "button"; x.className = "x"; x.textContent = "✕"; x.setAttribute("aria-label","Remove screenshot"); x.onclick = () => { imgs.splice(i,1); drawImgs(); }; w.append(im, x); imgsEl.append(w); }); }
  function addImgs(list){ for(const f of Array.from(list)){ if(/^image\//.test(f.type) && imgs.length < 3) imgs.push(f); } drawImgs(); }
  function showGuide(entryId, question, more){
    const t = turns().slice();
    if(question) t.push({ role:"user", content: question });
    t.push({ role:"guide", id: entryId, more: more || [] });
    setTurns(t); drawLog(); sug.innerHTML = "";
    log.lastElementChild.scrollIntoView({block:"nearest", behavior:"smooth"});
  }
  function suggest(){
    const q = input.value.trim(); if(q.length < 3){ sug.innerHTML = ""; return; }
    const r = searchKB(q, L.id).slice(0, 3);
    sug.innerHTML = r.length ? '<span class="muted small">Matching answers:</span>' + r.map(x => '<button type="button" class="q-link" data-faq="'+x.e.id+'" data-withq="1">'+esc(x.e.q)+'</button>').join("") : "";
  }
  drawLog();

  const help = document.getElementById("help");
  help.addEventListener("click", e => {
    const f = e.target.closest("[data-faq]");
    if(f){ const withQ = f.dataset.withq && input.value.trim(); showGuide(f.dataset.faq, withQ ? input.value.trim() : null); if(withQ) input.value = ""; return; }
    if(e.target.closest("[data-helped]")){ const t = turns().slice(); t.push({ role:"note", content:"Glad that helped. If anything else comes up, ask here." }); setTurns(t); drawLog(); return; }
    if(e.target.closest("[data-askclaude]")){ const t = turns(); if(t.length && t[t.length-1].role === "report" && !t.some((x,i) => x.role === "user" && i > t.length - 3)){ setTurns(t.concat([{ role:"user", content:"The code check above says there are problems. Can you explain what's wrong with my code and how to fix it?" }])); } askClaude(); return; }
    if(e.target.closest("[data-analyze]")) analyzeNow("What's wrong with my code?");
  });
  document.querySelectorAll("[data-chip]").forEach(b => b.addEventListener("click", () => { input.value = b.dataset.chip; input.focus(); input.setSelectionRange(input.value.length, input.value.length); }));
  document.getElementById("helpFile").addEventListener("change", e => { addImgs(e.target.files); e.target.value = ""; });
  input.addEventListener("paste", e => { const files = e.clipboardData && e.clipboardData.files; if(files && files.length){ e.preventDefault(); addImgs(files); status.className = "rev-status"; status.textContent = "Screenshot added. Type your question (optional) and press Ask."; } });
  input.addEventListener("input", () => { clearTimeout(typeT); typeT = setTimeout(suggest, 250); });
  input.addEventListener("keydown", e => { if(e.key === "Enter" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); send(); } });
  clearBtn.addEventListener("click", () => { if(busy) return; delete S.chats[L.id]; save(); drawLog(); status.textContent = ""; });
  sendBtn.addEventListener("click", () => { if(busy && ctl){ ctl.abort(); return; } send(); });

  async function analyzeNow(question){
    if(!window.LESSON_ANALYZE) return;
    status.className = "rev-status"; status.textContent = "Checking your code…";
    const r = await window.LESSON_ANALYZE();
    status.textContent = "";
    const t = turns().slice(); if(question) t.push({ role:"user", content: question });
    t.push({ role:"report", tag:"Code check of the exercise", report:r }); setTurns(t); drawLog(); sug.innerHTML = "";
    log.lastElementChild.scrollIntoView({block:"nearest", behavior:"smooth"});
  }
  async function send(){
    let text = input.value.trim();
    if(text && !imgs.length && looksLikeCode(text)){
      input.value = ""; status.textContent = "";
      const lang = guessLang(text);
      const f = await analyzeFiles([{ name:"your code", lang, text }], { single:true });
      const r = offlineReport(f, null, "This checks how the code is written. It can't tell whether the code does what you meant, so test it too.");
      const t = turns().slice(); t.push({ role:"user", content:text }); t.push({ role:"report", tag:"Code check (" + ({html:"HTML", css:"CSS", js:"JavaScript", py:"Python"})[lang] + ")", report:r }); setTurns(t); drawLog(); sug.innerHTML = "";
      log.lastElementChild.scrollIntoView({block:"nearest", behavior:"smooth"});
      return;
    }
    if(text && !imgs.length && window.LESSON_ANALYZE && /(wrong|error|doesn'?t work|not work|isn'?t work|broken|bug|fix|fail|red|cross|my code|check|why)/i.test(text)){ input.value = ""; return analyzeNow(text); }
    if(!text && !imgs.length){ status.className = "rev-status no"; status.textContent = "Type your question, or paste a screenshot, then press Ask."; input.focus(); return; }
    status.textContent = "";
    if(!imgs.length){
      const r = searchKB(text, L.id);
      if(r.length && r[0].s >= 5){ input.value = ""; showGuide(r[0].e.id, text, r.slice(1,4).filter(x => x.s >= 5).map(x => x.e.id)); return; }
      if(SAMPLE === undefined) await sampleReady;
      if(!SAMPLE || SAMPLE_BLOCKED){
        input.value = ""; const t = turns().slice(); t.push({ role:"user", content:text });
        if(r.length){ t.push({ role:"guide", id:r[0].e.id, more:r.slice(1,4).map(x => x.e.id) }); }
        else t.push({ role:"note", content:"I couldn't find a ready answer for that. Some things to try:\n- Use the exact words of the error message, or words like *terminal*, *file*, *install*, *git*.\n- Read the **If something goes wrong** part of this lesson, if it has one.\n- Open **Common questions for this lesson** above.\n- Work through the **I'm stuck** page in the top bar." + (SAMPLE_BLOCKED ? "" : "\n\nIn the Claude app or claude.ai, this box can also ask Claude, which can answer anything and read screenshots.") });
        setTurns(t); drawLog(); sug.innerHTML = ""; return;
      }
    }
    const sentImgs = imgs.slice();
    const t = turns().slice();
    t.push({ role:"user", content: (text || "Here's a screenshot of what I'm seeing. What's wrong and what should I do?") + (sentImgs.length ? "\n\n(I attached " + (sentImgs.length === 1 ? "a screenshot" : sentImgs.length + " screenshots") + ".)" : "") });
    setTurns(t); input.value = ""; imgs = []; drawImgs(); sug.innerHTML = "";
    askClaude(sentImgs);
  }

  async function askClaude(sentImgs){
    if(busy) return;
    if(SAMPLE === undefined){ status.className = "rev-status"; status.textContent = "Connecting…"; await sampleReady; status.textContent = ""; }
    if(!SAMPLE || SAMPLE_BLOCKED){ status.className = "rev-status no"; status.textContent = SAMPLE_BLOCKED ? "Help from Claude is turned off for this page. You can allow it from the page's Permissions menu." : "Asking Claude only works when this page is open in Claude (claude.ai or the Claude app). The built-in answers still work here."; return; }
    const history = turns().filter(x => x.role === "user" || x.role === "assistant");
    while(history.length && history[0].role !== "user") history.shift();
    if(!history.length || history[history.length-1].role !== "user"){ status.className = "rev-status no"; status.textContent = "Type your question in the box first."; return; }
    drawLog();
    const b = bubble("bot", '<p class="muted">Thinking… (Claude usually answers within 10–30 seconds)</p>');
    b.scrollIntoView({block:"nearest", behavior:"smooth"});
    busy = true; sendBtn.textContent = "Stop"; status.textContent = "";
    ctl = new AbortController();
    const opts = { signal: ctl.signal, cache: false, onText: ({text}) => { b.innerHTML = chatMd(text); } };
    if(sentImgs && sentImgs.length) opts.images = sentImgs;
    try{
      const r = await SAMPLE([{ role:"user", content: helpRules(L) }].concat(history.slice(-16)), opts);
      setTurns(turns().concat([{ role:"assistant", content: r.text }]));
      if(r.truncated){ const n = document.createElement("p"); n.className = "muted small"; n.textContent = "(The answer was cut short. Ask it to continue.)"; b.append(n); }
      markToday();
    }catch(e){
      if(e && e.code === "cancelled"){ if(e.text){ b.innerHTML = chatMd(e.text); setTurns(turns().concat([{ role:"assistant", content: e.text + "\n\n(stopped)" }])); } else b.remove(); }
      else { if(e && e.text && e.code !== "refused") b.innerHTML = chatMd(e.text); else b.remove(); status.className = "rev-status no"; status.textContent = sampleErrorCopy(e && e.code); }
    }finally{ busy = false; sendBtn.textContent = "Ask"; clearBtn.hidden = !turns().length; }
  }
}

function selectionInfo(){
  const s = window.getSelection(); if(!s || s.isCollapsed || !s.rangeCount) return null;
  const text = s.toString().replace(/[ \t]+\n/g,"\n").trim(); if(text.length < 3) return null;
  const r = s.getRangeAt(0); const node = r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
  if(!node || !app.contains(node) || node.closest("textarea, input, .editor, .chat, .help, .drawer, .console")) return null;
  return { text: text.slice(0, 3000), rect: r.getBoundingClientRect() };

function placeSelBar(){

  if(!info || info.rect.bottom < 0 || info.rect.top > innerHeight){ selBar.hidden = true; return; }
  selBar.hidden = false;
  const w = selBar.offsetWidth, h = selBar.offsetHeight, touch = matchMedia("(pointer: coarse)").matches;

  selBar.style.top = top + "px"; selBar.style.left = left + "px";
}

/* syntax check without running anything: the code is parsed inside a block that never runs */
function syntaxCheck(code){

    const done = v => { try{ w.terminate(); }catch(e){} URL.revokeObjectURL(url); res(v); };

function sevRank(s){ return { bug:0, important:1, polish:2 }[s] ?? 3; }
function dedupe(list){ const seen = new Set(); return list.filter(f => { const k = f.file + "|" + f.line + "|" + f.title; if(seen.has(k)) return false; seen.add(k); return true; }).sort((a,b) => sevRank(a.severity) - sevRank(b.severity) || (a.file > b.file ? 1 : a.file < b.file ? -1 : 0) || a.line - b.line); }

/* analyze a set of files: [{name, text}] */
async function analyzeFiles(files, opts){

/* turn findings + check results into the report shape used by renderReport */
function offlineReport(findings, checks, context){
  const reqs = (checks || []).map(c => ({ item: c.label.replace(/\[\[|\]\]/g, ""), status: c.ok ? "met" : "missing", note: c.ok ? "" : (c.reason || "Not done yet.") }));
  const failing = reqs.filter(r => r.status !== "met"), bugs = findings.filter(f => f.severity === "bug");
  const verdict = checks && checks.length ? (failing.length === 0 && bugs.length === 0 ? "complete" : failing.length <= 1 && bugs.length <= 1 ? "almost" : "not_yet") : (bugs.length === 0 ? (findings.length ? "almost" : "complete") : "not_yet");
  const parts = [];
  if(checks && checks.length) parts.push((reqs.length - failing.length) + " of " + reqs.length + " requirements met.");
  parts.push(findings.length ? "The code checker found " + findings.length + " thing" + (findings.length === 1 ? "" : "s") + " to look at" + (bugs.length ? ", " + bugs.length + " of them likely to break something." : ".") : "The code checker didn't find any problems in your code.");
  if(context) parts.push(context);
  const next = [];
  if(bugs[0]) next.push("Start with " + (bugs[0].file ? bugs[0].file + " " : "") + "line " + bugs[0].line + ": " + bugs[0].hint);
  if(failing[0]) next.push((next.length ? "Then: " : "") + failing[0].note);
  if(!next.length && findings[0]) next.push(findings[0].hint);
  if(!next.length) next.push(checks && checks.length ? "Everything checks out. Move on to the next lesson, or try a stretch idea of your own." : "Open it in the browser and test every button and form yourself, on a phone-sized window too.");
  return { verdict, summary: parts.join(" "), requirements: reqs, strengths: [], issues: findings.slice(0, 12).map(f => ({ severity: f.severity, file: f.file, line: f.line, title: f.title, explanation: f.explanation, hint: f.hint, fix: "" })), nextSteps: next, study: {} , offline: true };
}

      const triple = code.substr(i, 3) === c.repeat(3);
      const q = triple ? c.repeat(3) : c;
      out += q; i += q.length;
      while(i < n){
        if(code[i] === "\\"){ out += "__"; i += 2; continue; }
        if(code.substr(i, q.length) === q){ out += q; i += q.length; break; }
        if(!triple && code[i] === "\n") break;
        out += code[i] === "\n" ? "\n" : "_"; i++;
      }
      continue;
    }
    out += c; i++;
  }
  return out;
}

function lintPython(code, file, startLine){
  const out = []; const add = (line, severity, title, explanation, hint) => out.push({ file, line: line + (startLine || 1) - 1, severity, title, explanation, hint: hint || "" });
  const raw = code.split("\n"), s = stripPy(code), L = s.split("\n");
  // JavaScript habits
  L.forEach((l, i) => {
    const ln = i + 1, t = l.trim();
    if(!t) return;
    if(/\bconsole\.log\s*\(/.test(l)) add(ln, "bug", "console.log is JavaScript", "Python prints with print(…).", "Use print(…) instead.");
    if(/^\s*(const|let|var)\s+\w+\s*=/.test(l)) add(ln, "bug", "\"" + t.split(/\s+/)[0] + "\" is JavaScript", "Python has no const, let or var: you just write the name.", "Remove the word " + t.split(/\s+/)[0] + ".");
    if(/^\s*\/\//.test(raw[i])) add(ln, "bug", "// isn't a Python comment", "Python comments start with #.", "Change // to #.");
    if(/\b(true|false|null|undefined)\b/.test(l)) { const w = l.match(/\b(true|false|null|undefined)\b/)[1]; add(ln, "bug", "\"" + w + "\" isn't Python", "Python writes " + ({true:"True", false:"False", null:"None", undefined:"None"})[w] + ", with a capital letter.", "Change it to " + ({true:"True", false:"False", null:"None", undefined:"None"})[w] + "."); }
    if(/\belse\s+if\b/.test(l)) add(ln, "bug", "\"else if\" is elif in Python", "Python joins them into one word.", "Write elif.");
    if(/&&|\|\|/.test(l)) add(ln, "bug", "&& and || are JavaScript", "Python uses the words and, or.", "Replace && with and, || with or.");
    if(/(^|[^!=<>])!(?!=)\s*\w/.test(l)) add(ln, "bug", "! is JavaScript", "Python uses the word not.", "Write not instead of !.");
    if(/===|!==/.test(l)) add(ln, "bug", "=== isn't Python", "Python compares with == and !=.", "Use == (or !=).");
    if(/^\s*function\s+\w+\s*\(/.test(l)) add(ln, "bug", "function is JavaScript", "Python defines functions with def name(…):", "Write def instead of function, and end the line with a colon.");
    if(/\.length\b/.test(l)) add(ln, "bug", ".length isn't Python", "Python gets a length with len(…).", "Write len(thing) instead of thing.length.");
    if(/\.push\s*\(/.test(l)) add(ln, "bug", ".push isn't Python", "Python lists use .append(…).", "Write .append(…).");
    if(/\{\s*$/.test(l) && /^\s*(if|elif|else|for|while|def|class|try|with)\b/.test(l)) add(ln, "bug", "Python doesn't use { } for blocks", "End the line with a colon and indent the lines inside.", "Replace { with : and remove the closing }.");
    if(/^\s*\}\s*$/.test(l)) add(ln, "bug", "A } on its own line", "Python blocks end by un-indenting, not with }.", "Delete the }.");
    if(/;\s*$/.test(l)) add(ln, "polish", "No ; needed", "Python lines don't end with a semicolon.", "You can delete it.");
    if(/^\s*print\s+[^(=\s]/.test(l)) add(ln, "bug", "print needs brackets", "In Python 3, print is a function: print(\"text\").", "Put brackets around what you're printing.");
    if(/^\s*(if|elif|while)\b/.test(l) && /(^|[^=!<>:])=([^=]|$)/.test(l.replace(/^\s*(if|elif|while)\b/, "").replace(/\([^()]*\)/g, ""))) add(ln, "bug", "= inside an if", "A single = sets a variable. To compare, use ==.", "Change = to ==.");
  });
  // Windows paths in normal strings
  raw.forEach((l, i) => { const m = l.match(/(^|[^rR\w])(["'])([A-Za-z]:\\[^"'\n]*)\2/); if(m && /\\[ntrabfvxuUN0-9]/i.test(m[3])) add(i + 1, "important", "A Windows path in a normal string", "In \"" + m[3] + "\", backslash combinations like \\n or \\t are read as special characters, so the path breaks.", "Put r in front of the quote (r\"" + m[3] + "\") or use pathlib with forward slashes."); });
  // block structure and indentation
  let depth = 0, prevIndent = 0, prevOpener = false, prevLine = 0, cont = false;
  const tabs = L.some(l => /^\t/.test(l)), spaces = L.some(l => /^ +\S/.test(l));
  if(tabs && spaces) add((L.findIndex(l => /^\t/.test(l)) + 1) || 1, "bug", "Tabs and spaces are mixed", "Python can't tell how far lines are indented when tabs and spaces are mixed.", "Use spaces only: in VS Code, choose Convert Indentation to Spaces from the Command Palette.");
  function updateDepth(l){ for(const ch of l){ if("([{".includes(ch)) depth++; else if(")]}".includes(ch)) depth = Math.max(0, depth - 1); } cont = /\\\s*$/.test(l); }
  L.forEach((l, i) => {
    const t = l.trim(); if(!t){ return; }
    const inside = depth > 0 || cont;
    const indent = l.match(/^[ \t]*/)[0].replace(/\t/g, "    ").length;
    if(depth === 0 && !cont){
      if(prevOpener && indent <= prevIndent) add(i + 1, "bug", "Expected an indented line", "The line before (" + (prevLine + (startLine || 1) - 1) + ") ends with a colon, so the next line must be indented further.", "Indent this line by 4 more spaces.");
      else if(!prevOpener && indent > prevIndent && prevLine) add(i + 1, "bug", "Unexpected indent", "This line is indented more than the one before, but that line doesn't start a block (it doesn't end with a colon).", "Line it up with the line above, or add the missing colon above.");
      if(/^(if|elif|else|for|while|def|class|try|except|finally|with)\b/.test(t) && !/:\s*$/.test(t) && !/[([{,\\]\s*$/.test(t)){
        const opens = (t.match(/[([{]/g) || []).length, closes = (t.match(/[)\]}]/g) || []).length;
        if(opens <= closes && !/\{\s*$/.test(t)){ add(i + 1, "bug", "Missing a colon", "Lines that start a block (" + t.split(/[\s(:]/)[0] + ") must end with a colon.", "Add : at the end of the line."); prevIndent = indent; prevLine = i + 1; prevOpener = true; return void updateDepth(l); }
      }
      prevIndent = indent; prevLine = i + 1;
      prevOpener = /:\s*$/.test(t) && !/^(lambda)/.test(t);
    }
    updateDepth(l);
    if(inside && depth === 0 && !cont) prevOpener = /:\s*$/.test(t);
  });
  if(prevOpener && prevLine) add(prevLine, "bug", "A block with nothing inside", "The last line ends with a colon but nothing is indented after it.", "Add the indented lines, or pass as a placeholder.");
  // brackets
  const pairs = { ")":"(", "]":"[", "}":"{" }, st = [];
  for(let i = 0; i < s.length; i++){ const c = s[i]; if("([{".includes(c)) st.push({ c, i }); else if(")]}".includes(c)){ const t = st.pop(); if(!t){ add(lineOf(s, i), "bug", "An extra " + c, "There's a closing " + c + " that doesn't close anything.", "Delete it, or add the missing opening " + pairs[c] + "."); break; } if(t.c !== pairs[c]){ add(lineOf(s, i), "bug", "Brackets don't match", "The " + t.c + " on line " + lineOf(s, t.i) + " is closed with " + c + ".", "Check each ( has a ), each [ a ], each { a }."); break; } } }
  st.slice(0, 1).forEach(t => add(lineOf(s, t.i), "bug", "A " + t.c + " is never closed", "The " + t.c + " on this line has no matching " + ({ "(":")", "[":"]", "{":"}" })[t.c] + ".", "Add the closing bracket."));
  // unclosed quotes on a line
  raw.forEach((l, i) => { if(/"""|'''/.test(l)) return; const t = stripPy(l); const dq = (t.match(/"/g) || []).length, sq = (t.match(/'/g) || []).length; if(dq % 2 || sq % 2) add(i + 1, "bug", "A quote is never closed", "This line opens a quote without closing it.", "Add the missing " + (dq % 2 ? "\"" : "'") + "."); });
  // names: wrong capitals and near-misses
  const declared = new Map(); let m;
  const declRe = /^[ \t]*(?:(?:async\s+)?for\s+([^\n]+?)\s+in\b|def\s+(\w+)\s*\(([^)]*)\)|class\s+(\w+)|(?:from\s+[\w.]+\s+)?import\s+([\w\s,.]+?)(?:\s+as\s+(\w+))?\s*$|with\s+.*\bas\s+(\w+)\s*:|except\s+.*\bas\s+(\w+)\s*:|([\w\s,]+?)\s*(?:[-+*/%]?=)(?!=))/gm;
  while((m = declRe.exec(s))){
    const ln = lineOf(s, m.index);
    if(m[1]) (m[1].match(/[A-Za-z_]\w*/g) || []).forEach(nm => declared.set(nm, declared.get(nm) || ln));
    const names = [m[2], m[4], m[6], m[7], m[8], m[9]].filter(Boolean).join(",") + "," + (m[3] || "") + "," + (m[5] && !m[6] ? m[5] : "");
    names.split(",").forEach(x => { const nm = x.trim().replace(/[:=].*$/, "").replace(/^\*+/, "").trim().split(/\s+/).pop(); if(nm && /^[A-Za-z_]\w*$/.test(nm)) declared.set(nm, declared.get(nm) || ln); });
    if(m[5] && !m[6]) m[5].split(",").forEach(x => { const nm = x.trim().split(".")[0]; if(nm) declared.set(nm, ln); });
  }
  const reported = new Set();
  L.forEach((l, i) => {
    if(/^\s*(from|import)\s/.test(l)) return;   // module names on import lines aren't variables
    let w; const tok = /(\.?)\b([A-Za-z_]\w*)\b/g;
    while((w = tok.exec(l))){
      const name = w[2], dotted = w[1] === ".";
      if(reported.has(name) || declared.has(name)) continue;
      const fix = PY_CASE.find(c => c.toLowerCase() === name.toLowerCase() && c !== name);
      if(fix && !/^(true|false|null)$/.test(name)){ reported.add(name); add(i + 1, "bug", "\"" + name + "\" should be \"" + fix + "\"", "Python is case-sensitive: the capitals must match exactly.", "Change it to " + fix + "."); continue; }
      if(dotted || PY_KEYWORDS.has(name) || PY_BUILTINS.has(name)) continue;
      const after = l.slice(w.index + w[0].length);
      if(/^\s*=[^=]/.test(after)) continue;
      const cand = [...declared.keys()].filter(d => d.length > 2 && d + "s" !== name && name + "s" !== d && (d.toLowerCase() === name.toLowerCase() || (name.length > 3 && lev(d, name) === 1)));
      if(cand.length){ reported.add(name); add(i + 1, "bug", "\"" + name + "\" isn't defined. Did you mean \"" + cand[0] + "\"?", "\"" + cand[0] + "\" was created on line " + declared.get(cand[0]) + ". Names must match exactly, including capitals.", "Change " + name + " to " + cand[0] + "."); }
    }
  });
  return out;
}

/* ============================================================
   PYTHON EXERCISES (run on your computer, paste code + output)
   ============================================================ */
function pyIO(L){ S.pyio = S.pyio || {}; return S.pyio[L.id] || { code:"", out:"" }; }
function pyBenchHtml(L){
  const io = pyIO(L);
  return '<div class="bench-col"><section class="task"><h2 class="task-h">Your task · run it on your computer</h2><div class="task-text">'+md(L.task)+'</div>'+
    '<ul class="checks" id="checks">'+L.checks.map((c,i)=>'<li data-i="'+i+'"><span class="ck"></span><span class="ck-body"><span>'+inline(c[0])+'</span><span class="ck-why"></span></span></li>').join("")+'</ul>'+
    '<div class="task-actions"><button class="btn primary" id="btnCheck" type="button">Check my work</button><button class="btn" id="btnHint" type="button">Hint</button><button class="btn" id="btnFb" type="button">Get feedback</button><button class="btn ghost" id="btnSol" type="button">Show solution</button></div>'+
    '<div class="result" id="result" aria-live="polite"></div><div id="lintOut"></div><div class="rev-status" id="fbStatus" aria-live="polite"></div><div id="fbOut"></div><div class="hints" id="hints"></div><div id="sol"></div></section>'+
    '<section class="py-io">'+
      '<ol class="py-steps"><li>Copy the starting code into a new <b>.py</b> file in VS Code.</li><li>Finish it, save, and run it in the terminal.</li><li>Paste your code and what it printed below, then press <b>Check my work</b>.</li></ol>'+
      codeBlock(L.starter, "python")+
      '<label class="fl" for="pyCode">Your code</label><textarea id="pyCode" class="ta mono py-code" rows="14" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Paste your whole .py file here">'+esc(io.code)+'</textarea>'+
      '<label class="fl" for="pyOut">What it printed</label><textarea id="pyOut" class="ta mono py-out" rows="6" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Paste everything the terminal printed after you ran it">'+esc(io.out)+'</textarea>'+
      '<p class="muted small">Saved on this device as you type.</p>'+
    '</section></div>';
}
function runPyChecks(L){
  const io = pyIO(L);
  return L.checks.map(c => { try{ const v = c[1](io.code || "", io.out || ""); return v === true ? true : (v && typeof v === "object" && "fail" in v) ? String(v.fail) : (v ? true : "Not done yet."); }catch(e){ return "Couldn't check this: " + e.message; } });
}
function wirePyex(L, next){
  const codeEl = document.getElementById("pyCode"), outEl = document.getElementById("pyOut");
  const checksEl = document.getElementById("checks"), resultEl = document.getElementById("result");
  const saveIO = () => { S.pyio = S.pyio || {}; S.pyio[L.id] = { code: codeEl.value, out: outEl.value }; save(); };
  codeEl.addEventListener("input", saveIO); outEl.addEventListener("input", saveIO);
  codeEl.addEventListener("keydown", e => { if(e.key === "Tab" && !e.shiftKey){ e.preventDefault(); const st = codeEl.selectionStart; codeEl.setRangeText("    ", st, codeEl.selectionEnd, "end"); saveIO(); } });
  const file = () => [{ name:"script.py", lang:"py", text: codeEl.value }];
  async function showLint(){
    const el = document.getElementById("lintOut");
    const f = (await analyzeFiles(file())).filter(x => x.severity !== "polish").slice(0, 5);
    el.innerHTML = f.length ? '<div class="lint"><p class="lint-h">The code checker noticed:</p><ul>'+f.map(x => '<li class="sev-'+x.severity+'"><b>Line '+x.line+': '+esc(x.title)+'</b><span>'+esc(x.explanation)+'</span></li>').join("")+'</ul></div>' : "";
  }
  function check(){
    if(!codeEl.value.trim() || !outEl.value.trim()){ resultEl.className = "result no"; resultEl.textContent = !codeEl.value.trim() ? "Paste your code first." : "Paste what your script printed when you ran it."; return null; }
    const res = runPyChecks(L);
    res.forEach((ok,i) => { const li = checksEl.children[i]; const pass = ok === true; li.classList.toggle("pass", pass); li.classList.toggle("fail", !pass); li.querySelector(".ck-why").textContent = pass ? "" : ok; });
    const passed = res.filter(x => x === true).length;
    markToday();
    if(passed === res.length){
      complete(L.id, true);
      document.getElementById("donePill").hidden = false;
      app.querySelectorAll('.nav-l[data-open="'+L.id+'"]').forEach(n => { n.classList.add("done"); n.querySelector(".d").textContent = "✓"; });
      resultEl.className = "result"; resultEl.innerHTML = '<div class="win"><span>All '+res.length+' checks pass. Lesson complete.</span>'+(next?'<button class="btn primary" data-open="'+next.id+'" type="button">Next: '+esc(next.title)+' →</button>':'')+'</div>';
    } else { resultEl.className = "result no"; resultEl.textContent = passed+" of "+res.length+" passing. Each red item says what to change."; }
    showLint();
    return res;
  }
  document.getElementById("btnCheck").addEventListener("click", check);
  window.LESSON_ANALYZE = async () => {
    const res = runPyChecks(L);
    const f = await analyzeFiles(file());
    return offlineReport(f, L.checks.map((c,i) => ({ label:c[0], ok:res[i] === true, reason: typeof res[i] === "string" ? res[i] : "" })), outEl.value.trim() ? "" : "You haven't pasted the output yet, so the output checks can't pass.");
  };
  let hintN = 0; const hintsEl = document.getElementById("hints"), hb = document.getElementById("btnHint");
  hb.textContent = "Hint (0 of "+L.hints.length+")";
  hb.addEventListener("click", () => { if(hintN >= L.hints.length) return; const h = document.createElement("div"); h.className = "hint"; h.innerHTML = "<b>Hint "+(hintN+1)+"</b>"+inline(L.hints[hintN]); hintsEl.append(h); hintN++; hb.textContent = "Hint ("+hintN+" of "+L.hints.length+")"; if(hintN >= L.hints.length) hb.disabled = true; });
  document.getElementById("btnFb").addEventListener("click", async e => {
    const btn = e.currentTarget, out = document.getElementById("fbOut");
    if(!codeEl.value.trim()){ resultEl.className = "result no"; resultEl.textContent = "Paste your code first."; return; }
    btn.disabled = true; btn.textContent = "Checking…";
    try{
      const r = await window.LESSON_ANALYZE();
      renderReport(r, out, {inLesson:true});
      saveReview({ id:"r"+Date.now(), at:Date.now(), target:"lesson:"+L.id, label:L.title, files:["script.py"], mode:"offline", result:r });
      await sampleReady;
      if(SAMPLE && !SAMPLE_BLOCKED){
        const more = document.createElement("div"); more.className = "task-actions"; more.innerHTML = '<button class="btn" type="button">Ask Claude for a deeper review</button>';
        more.firstChild.addEventListener("click", ev => {
          const res = runPyChecks(L);
          const t = { label: "Python exercise (run on the learner's computer): " + L.title + " — " + L.task.replace(/\[\[|\]\]/g,""), requirements: L.checks.map(c => c[0].replace(/\[\[|\]\]/g,"")),
            checks: L.checks.map((c,i) => (res[i] === true ? "PASS: " : "FAIL (" + res[i] + "): ") + c[0].replace(/\[\[|\]\]/g,"")).join("; "),
            context: "The learner wrote this Python script, ran it on their own computer, and pasted what it printed:\n" + outEl.value.slice(0, 4000),
            note: "", mode: "coach", files: [{ name: "script.py", text: codeEl.value }], images: [], previous: "" };
          runReview(t, document.getElementById("fbStatus"), out, ev.currentTarget, {inLesson:true});
        });
        out.append(more);
      }
      out.scrollIntoView({behavior:"smooth", block:"nearest"});
    } finally { btn.disabled = false; btn.textContent = "Get feedback"; }
  });
  const solEl = document.getElementById("sol");
  document.getElementById("btnSol").addEventListener("click", () => {
    solEl.innerHTML = '<div class="confirm"><p>Have you used the hints and the Ask for help box? Seeing the answer too early skips the part that teaches you.</p><div class="task-actions"><button class="btn" data-sol="show" type="button">I\'ve tried, show me</button><button class="btn ghost" data-sol="no" type="button">Keep trying</button></div></div>';
  });
  solEl.addEventListener("click", e => { const b = e.target.closest("[data-sol]"); if(!b) return;
    if(b.dataset.sol === "no"){ solEl.innerHTML = ""; return; }
    solEl.innerHTML = '<div class="confirm"><p><b>One way to solve it.</b> Type it out yourself rather than copying it, then run it and change something to see what happens.</p>'+codeBlock(L.solution, "python", false)+'</div>'; });
  if(codeEl.value.trim() && outEl.value.trim()) check();
}
