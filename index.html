{ id:"teardown", title:"Learn from the Artona Digital Suite", blurb:"Take a real, working app apart: what each piece does, why it was built that way, and what you can reuse in your own apps.", lessons:[
{ id:"td-map", title:"The suite, part by part", mins:25, kind:"read",
body:`The goal of this module isn't to rebuild the suite. It's to **learn from it**: a real app, used by a real team, that already solves problems you'll meet again in your own projects. Once you understand why each piece exists, you can reuse the idea anywhere.

This page is the map. Each part lists the lesson that teaches it.

## The three programs
- **ArtonaDigitalSuite.exe**: Python + pywebview, window drawn by WebView2. Lessons: *How the suite runs*, *Your first pywebview window*, *Check and Run*.
- **ArtonaAIEngine.exe**: a separate Python program with PyTorch, OpenCV and dlib. It gets a job as a file, sends progress back one line at a time, and blocks the network. Lessons: *A separate engine*, *Offline and private by design*, the *Images and AI tools* module.
- **Artona Digital Suite.exe (the launcher)**: installs per user with no admin rights, updates from the shared team folder, checks SHA-256 manifests, and keeps the previous version. Lesson: *Put it in your team's hands*.

## The tools (grouped as in the suite's menu)
- **SD Season**: SD Card Importer (copy, rename, copy again to the backup, verify every copy), QR Metadata Writer, PNG Cleaner, SD Match. Lessons: *Files and folders*, *Check before Run*, *Reading QR codes*, *Matching faces, carefully*.
- **Proofing**: Quality Control (straightens tilted photos, also as a watched "hotfolder") and Photo search (find photos by what's in them, from tags Quality Control saved). Lessons: *Images and print PDFs*, *Long jobs*.
- **Grad Yearbook and Grad Composite**: the pulls and Wrong Pose tools, plus Yearbook Photo Check. Lessons: *Spreadsheets with pandas*, *Settings files and dates*, *Check before Run*.
- **Data**: Clean Class List, Convert JSON to Excel, Trim JSON. Lesson: *Spreadsheets with pandas*.
- **Print Layouts**: Class Group and Communion Stack, print sheets in stack-cut order. Lesson: *Images and print PDFs with Pillow*.
- **Other Programs**: buttons that open programs the team uses but didn't build.
- **Admin sections**: Season Folders, Delete Services Folders, Re-tag photos, Purge old seasons. Lessons: *Check before Run*, *Settings screens and an admin password*.

## The pieces every tool shares
- **A list of tools** (the registry): each tool is one entry, and its code is only loaded the first time someone opens it, so the suite starts fast.
- **Team settings** in the shared folder and **personal settings** on each PC. Lesson: *Settings files and dates*.
- **Seasons** worked out from dates, with no year to update by hand.
- **An admin password** stored only as a salted hash, with a lockout after 5 wrong tries.
- **Jobs**: several tools can run at once, but never two that share a working folder, and nothing runs during an update.
- **Logs, metrics and feedback**: counts only, never names or photos.
- **Automatic tests** that must pass before every build, and numbered **.bat scripts** for setup, test, build and publish.

## How to use the rest of this module
The next lessons each open one real file, show the important part, and explain the decisions behind it. Each one ends with questions that check you understood **why**, not just what. Then *Reading the real source code* shows you how to explore the rest on your own.

> The walkthroughs of real code are only in your **private** copy of this course. The public copy on GitHub leaves them out on purpose: work code belongs to your employer, and it shouldn't be published without permission. The lesson *Who owns the code you write?* explains why.`,
steps:["Read the map and mark any part you don't recognise yet","Revisit the lessons for those parts"] },

{ id:"td-read", title:"Reading the real source code", mins:45, kind:"read",
body:`This lesson is a guided way to read a codebase you didn't type yourself. It's a skill of its own, and the way you'll learn from any project: the suite, an open-source library, or a coworker's script.

> Before you start: work in a **copy** of the source folder, or make sure everything is committed in Git, so nothing you try can break the real thing. Never open real student data while exploring.

## Step 1: Get the lay of the land
Open the source folder in VS Code. Before reading any code, look at the folders and files and write down what you think each one is for. Look for:
- a "read me first" file and any design notes
- the version file
- the numbered .bat scripts and what each runs
- where the HTML, CSS and JavaScript for the window live
- where each tool's Python code lives, and the list of tools
- the tests folder
- anything to do with the launcher and the AI engine

## Step 2: Follow one button, end to end
Pick one simple tool, like **Trim JSON** or **Clean Class List**. Trace what happens when you press Run:
1. In the JavaScript, find where the Run button calls Python. Which **pywebview api** function does it call?
2. In Python, find that function in the API class. What does it check first? What does it call next?
3. Follow it into the tool's own module. Find its [[FORM]], its [[scan]] and its [[run]].
4. Find where it reads the input and where it writes the result.
5. Back in JavaScript: how is the result shown?

Use **Go to Definition** ({{Cmd|Ctrl}}-click a function name, or F12) and **Find in Files** ({{Cmd + Shift + F|Ctrl + Shift + F}}) to jump around.

## Step 3: Read one test, then run it
Open a test file. What input does it set up? What does it check? The suite's tests use Python's built-in **unittest**. With the project's venv active, run the whole set, then only the tests whose names contain a word:
~~~win
python -m unittest discover -s tests
python -m unittest discover -s tests -k Season
~~~
Then change one thing on purpose (in your copy), run the tests, and watch them catch you.

## Step 4: Find the safety patterns
Search the code for each of these and note where they appear:
- the Check step ([[def scan]])
- writing to a temporary file, then [[os.replace]]
- dated backups before changing a shared file
- SHA-256 fingerprints
- the admin password hash and lockout
- the AI engine's network block
- the season calculation

## Step 5: Ask "why?"
For each pattern you found, write one sentence: what would go wrong without it? If you can't answer, that's your next thing to learn.

## Step 6: Make one small change yourself
Choose something small and visible: a label's wording, an extra line in a results summary. Make it in your copy, run the tests, run the suite from source, and see your change. Then you've modified a real app, end to end.

## Getting help
Use **Ask for help** below with what you found, or paste code into **Get feedback**. Remove any real paths, names or data first.`,
steps:["Copy (or commit) the source before exploring","Write down what each top-level folder and file is for","Trace one tool's Run button from JavaScript to Python and back","Read and run one test file with unittest","Find the safety patterns","Write one 'what would go wrong without it?' sentence for each","Make one small change in your copy and see it work"] }
]},


{ id:"online", title:"Building for the web: online apps", blurb:"Servers, databases, logins and hosting: how apps that live on the internet work, and how to keep them safe.", lessons:[
{ id:"on-how", title:"How online apps work", mins:20, kind:"read",
body:`The suite is **offline**: everything runs on one computer and files sit on the office network. An **online** app lives on a computer somewhere else (a **server**), and people reach it over the internet. That changes almost everything about safety, cost and responsibility, so it's worth understanding before you write a line.

## Two halves: client and server
- The **client** is the browser (or phone app). It shows the screen: HTML, CSS and JavaScript, exactly what you've learned.
- The **server** is a program running on another computer, always on, waiting for requests. It keeps the data, checks who's allowed to do what, and sends back answers.

The suite has both halves too, but in **one window on one PC**: JavaScript talks to Python directly, with no network in between. An online app puts the internet in the middle, and anyone on the internet can try to talk to your server.

## A request and a response
When you open a page or press a button, the browser sends a **request**:
~~~text
GET /api/gear HTTP/1.1
Host: gear.example.com
~~~
and the server sends a **response**:
~~~text
HTTP/1.1 200 OK
Content-Type: application/json

[{"id": 1, "name": "Camera body A", "out": false}]
~~~
- **The method** says what you want: **GET** reads, **POST** creates, **PUT/PATCH** changes, **DELETE** removes.
- **The path** ([[/api/gear]]) says which thing.
- **The status code** says how it went: [[200]] OK, [[201]] created, [[400]] your request was wrong, [[401]] you need to log in, [[403]] you're logged in but not allowed, [[404]] not found, [[500]] the server broke.
- **JSON** is the usual format for data: the same format as the suite's settings files.

## Addresses: domains, DNS and HTTPS
- A **domain** ([[example.com]]) is a name you rent yearly from a registrar.
- **DNS** is the internet's phone book: it turns the name into the server's numeric address.
- **HTTPS** encrypts everything between browser and server, so nobody on the café Wi-Fi can read passwords or data. The padlock in the address bar means HTTPS. Every online app needs it; most hosts set it up for free.

## Static sites vs apps with a back end
- A **static site** is just files (HTML, CSS, JS, images). GitHub Pages hosts these for free. Your About Me site and this course are static: there's no server code, and nothing is stored centrally. Each visitor's progress is saved only in their own browser.
- An **app with a back end** runs your own code on the server: logins, a shared database, anything that must be the same for everyone. That's what the rest of this module teaches.

## What changes when you go online
- **Anyone can knock.** Your server is reachable by every person and every automated attack program on the internet, all day. Assume they'll try.
- **You're holding other people's data.** Privacy laws apply to you (next module).
- **It costs money and attention.** Servers, domains and databases have monthly costs; libraries need security updates; something has to notice when it's down.
- **Mistakes are public.** A bug in an offline tool affects your team. A bug in an online app can expose data to the world.

> None of this is a reason not to build online apps. It's a reason to build them knowing these things from the start, which most beginners don't.`,
quiz:[
 {q:"Where does the data for an online app usually live?", o:["In each visitor's browser","On the server, so everyone sees the same data","In the HTML file"], a:1, why:"The server keeps shared data. Browser storage (like this course's progress) belongs to one person on one device."},
 {q:"A logged-in user tries to open another person's order and gets 403. What does that mean?", o:["The page doesn't exist","They're logged in, but not allowed to see it","The server crashed"], a:1, why:"401 means 'log in first'; 403 means 'you're logged in, and the answer is still no'."},
 {q:"Why is the suite's design (no server) safer for student photos than a website would be?", o:["Websites are slower","There's no network door for anyone outside to knock on","Python is safer than JavaScript"], a:1, why:"Without a listening server, nobody on the internet can even try to reach it."}
]},

{ id:"on-flask", title:"Your first server with Flask", mins:40, kind:"read",
body:`**Flask** is a small Python library for writing servers. You already know Python, so it's the shortest path to your own back end. You'll run it on your own computer first: nothing goes on the internet in this lesson.

## Step 1: Make the project
In the terminal:
~~~mac
mkdir gear-board && cd gear-board
python3 -m venv .venv
source .venv/bin/activate
pip install flask
~~~
~~~win
mkdir gear-board; cd gear-board
python -m venv .venv
.venv\\Scripts\\Activate.ps1
pip install flask
~~~
**You should see:** [[(.venv)]] at the start of the prompt, and "Successfully installed flask" at the end.

## Step 2: A server with two routes
Make **app.py**:
~~~python
from flask import Flask, jsonify, request

app = Flask(__name__)

GEAR = [
    {"id": 1, "name": "Camera body A", "out": False},
    {"id": 2, "name": "Flash kit 3", "out": True},
]


@app.get("/api/gear")
def list_gear():
    return jsonify(GEAR)


@app.post("/api/gear/<int:gear_id>/toggle")
def toggle(gear_id):
    item = next((g for g in GEAR if g["id"] == gear_id), None)
    if item is None:
        return jsonify(error="No gear with that id."), 404
    item["out"] = not item["out"]
    return jsonify(item)
~~~
- [[@app.get("/api/gear")]] means "when a GET request arrives for this path, run this function".
- [[<int:gear_id>]] takes a number from the path and passes it in.
- Returning [[(..., 404)]] sets the status code.

## Step 3: Run it
~~~sh
flask --app app run --debug
~~~
**You should see:** [[Running on http://127.0.0.1:5000]]. Open [[http://127.0.0.1:5000/api/gear]] in your browser: the JSON appears. [[127.0.0.1]] means "this computer only", so nobody else can reach it.

> Debug mode reloads when you save and shows detailed errors. **Never** turn it on for a real, public server: its error page can let a visitor run code on your computer.

## Step 4: A page that uses it
Make a folder **static** with **index.html**:
~~~html
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Gear board</title></head>
<body>
  <h1>Gear board</h1>
  <ul id="list"></ul>
  <script>
    async function load() {
      const res = await fetch("/api/gear");
      const gear = await res.json();
      const list = document.getElementById("list");
      list.replaceChildren();
      for (const g of gear) {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.textContent = g.out ? "Return" : "Sign out";
        btn.addEventListener("click", async () => {
          await fetch("/api/gear/" + g.id + "/toggle", { method: "POST" });
          load();
        });
        li.textContent = g.name + (g.out ? " (out) " : " (in) ");
        li.append(btn);
        list.append(li);
      }
    }
    load();
  <\/script>
</body>
</html>
~~~
Flask serves files in **static** automatically. Open [[http://127.0.0.1:5000/static/index.html]] and click a button.

Notice [[textContent]], not [[innerHTML]], for names: that matters once other people can type the names (see *The big risks*).

## The catch you'll notice
Stop the server (**Ctrl + C**) and start it again: everything's back to how it was. The list lives in a Python variable, which disappears when the program stops. Real apps keep data in a **database**: next lesson.

## If something goes wrong
- **"flask: command not found":** the venv isn't active. Activate it (Step 1) and try again.
- **"Address already in use":** another server is on port 5000. Stop it, or run [[flask --app app run --port 5001]].
- **The page shows but the list is empty:** open the developer tools Console; a red error there says what failed.`,
steps:["Make the gear-board project and install Flask in a venv","Write app.py with the two routes","Run it and open /api/gear in your browser","Add static/index.html and sign gear in and out","Restart the server and notice the data resets"] },

{ id:"on-data", title:"Databases: keeping data safely", mins:35, kind:"read",
body:`A **database** stores data so it survives restarts, many people can use it at once, and you can search it quickly. You'll use **SQLite**: a whole database in a single file, built into Python. No installing, no server. Larger apps use **PostgreSQL** or similar, but the ideas and most of the commands are the same.

## Tables, rows and columns
A database table is like a spreadsheet sheet with strict columns:
~~~text
gear
id | name           | out | updated
1  | Camera body A  | 0   | 2026-10-26 09:14
2  | Flash kit 3    | 1   | 2026-10-26 10:02
~~~
You talk to it in **SQL**, a language just for data.

## Step 1: Create the database
Make **db.py** in your gear-board folder:
~~~python
import sqlite3
from pathlib import Path

DB = Path("gear.db")


def connect():
    con = sqlite3.connect(DB)
    con.row_factory = sqlite3.Row      # rows behave like dicts
    return con


def setup():
    with connect() as con:
        con.execute("""CREATE TABLE IF NOT EXISTS gear (
            id INTEGER PRIMARY KEY,
            name TEXT NOT NULL,
            out INTEGER NOT NULL DEFAULT 0
        )""")
        if con.execute("SELECT COUNT(*) FROM gear").fetchone()[0] == 0:
            con.executemany("INSERT INTO gear (name) VALUES (?)",
                            [("Camera body A",), ("Flash kit 3",), ("Tripod 2",)])
~~~
Run [[python -c "import db; db.setup()"]]. A **gear.db** file appears.

## Step 2: Use it in Flask
Change app.py:
~~~python
from flask import Flask, jsonify
import db

app = Flask(__name__)
db.setup()


@app.get("/api/gear")
def list_gear():
    with db.connect() as con:
        rows = con.execute("SELECT id, name, out FROM gear ORDER BY name").fetchall()
    return jsonify([dict(r) for r in rows])


@app.post("/api/gear/<int:gear_id>/toggle")
def toggle(gear_id):
    with db.connect() as con:
        cur = con.execute("UPDATE gear SET out = 1 - out WHERE id = ?", (gear_id,))
        if cur.rowcount == 0:
            return jsonify(error="No gear with that id."), 404
    return jsonify(ok=True)
~~~
Restart the server: now your sign-outs survive restarts.

## The most important rule: never build SQL from text
Look at the [[?]] in [[WHERE id = ?]]. The value is passed **separately**, and SQLite treats it as data, never as SQL. Compare this **dangerous** version:
~~~python
# NEVER do this
con.execute("SELECT * FROM gear WHERE name = '" + name + "'")
~~~
If someone types a name like [[x' OR '1'='1]], the query becomes something you didn't write, and could return or delete everything. This is **SQL injection**, one of the oldest and most common attacks. Always use [[?]] placeholders (or a library that does it for you).

## Look after the data
- **Back it up.** For SQLite, copy the file while nothing is writing to it, or use [[con.backup()]]. Keep copies somewhere else, dated, like the suite's backups folder. Test restoring one.
- **Keep only what you need.** Every column you add is something you must protect. If you don't need a birth date, don't store it.
- **Delete what's no longer needed.** Decide how long records are kept, and write the clean-up code (the suite's *Purge old seasons* is exactly this).
- **Don't commit the database to Git.** Add [[*.db]] to [[.gitignore]], just as the suite excludes its data files.`,
quiz:[
 {q:"Which line is safe from SQL injection?", o:["con.execute(\"DELETE FROM gear WHERE id = \" + gear_id)","con.execute(\"DELETE FROM gear WHERE id = ?\", (gear_id,))","con.execute(f\"DELETE FROM gear WHERE id = {gear_id}\")"], a:1, why:"Placeholders pass the value separately, so it can never become part of the SQL."},
 {q:"Why add *.db to .gitignore?", o:["Git can't store binary files","So real data never ends up in the repository, where it's copied to every clone and is hard to remove","To make commits faster"], a:1, why:"Data in Git history is very hard to truly delete, and a public repo exposes it to everyone."},
 {q:"What's the point of deciding how long you keep records?", o:["It saves a little disk space","Data you no longer hold can't be leaked, and privacy laws expect you to keep data only as long as needed","SQLite requires it"], a:1, why:"Retention limits are a core privacy principle, and they reduce the damage of any breach."}
]},

{ id:"on-accounts", title:"Accounts and passwords", mins:35, kind:"read",
body:`Once an app holds shared data, it needs to know **who** is using it (**authentication**) and **what they're allowed to do** (**authorization**). They're different questions, and mixing them up causes the most common security bug on the web.

## Option 1 (best): don't store passwords at all
For a workplace app, the safest login is usually the one you already have: **sign in with Microsoft** or **Google** (called SSO, single sign-on). Your app never sees a password, people get multi-factor authentication for free, and when someone leaves, IT switches off one account and every app follows. Ask IT before building any login for work: they may require this.

## Option 2: your own accounts, done properly
If you do store passwords, store only a **slow, salted hash**, exactly the idea in the suite's admin password. In Flask, use the helper that comes with it rather than writing your own:
~~~python
from werkzeug.security import generate_password_hash, check_password_hash

stored = generate_password_hash("correct horse battery staple")
check_password_hash(stored, "correct horse battery staple")   # True
check_password_hash(stored, "wrong")                          # False
~~~
Rules that go with it:
- Never store, log or email a password. Not even in a debug message.
- Allow long passwords (passphrases); don't force odd character rules.
- Limit login attempts, as the suite's lockout does.
- Offer multi-factor authentication if the data matters.
- "Forgot password" sends a single-use link that expires, never the password.

## Staying logged in: sessions
After login, the server gives the browser a **session cookie**: a signed token that says "this is Melissa". Flask signs it with a **secret key**:
~~~python
import os
app.secret_key = os.environ["GEAR_SECRET_KEY"]
~~~
The key comes from an **environment variable**, never from the code. Anyone with the key can forge a login, so it must never be in Git. (More in *Secrets and configuration*.)

## Authorization: check on every request
Logging in proves who you are. It doesn't decide what you may do. This is the classic bug:
~~~python
# The page only shows each person their own orders... but:
@app.get("/api/orders/<int:order_id>")
def get_order(order_id):
    return jsonify(find_order(order_id))     # anyone logged in can read ANY order
~~~
Hiding a button on the screen isn't protection: anyone can send a request by hand with a different number. The server must check, every time:
~~~python
@app.get("/api/orders/<int:order_id>")
def get_order(order_id):
    order = find_order(order_id)
    if order is None or order["owner"] != session.get("user_id"):
        return jsonify(error="Not found."), 404
    return jsonify(order)
~~~
**Broken access control** is number 1 on the OWASP Top 10 list of web risks. Rule of thumb: the screen decides what to **show**; the server decides what's **allowed**.

> Answering "Not found" rather than "Not allowed" for someone else's record avoids confirming it exists.`,
quiz:[
 {q:"What's the difference between authentication and authorization?", o:["They're the same thing","Authentication checks who you are; authorization checks what you're allowed to do","Authorization happens in the browser"], a:1, why:"Both are needed. Most real-world leaks are authorization mistakes."},
 {q:"The Delete button is hidden for non-admins. Is the delete route safe?", o:["Yes, nobody can see the button","No: anyone can send the request by hand, so the server must check the user is an admin","Yes, if the page uses HTTPS"], a:1, why:"The screen controls what's shown; only the server can enforce what's allowed."},
 {q:"Where should the Flask secret key live?", o:["In app.py, so it's easy to find","In an environment variable or secrets setting on the server, never in Git","In the README"], a:1, why:"Anyone with the key can forge logins."}
]},

{ id:"on-security", title:"The big risks, and how to avoid them", mins:35, kind:"read",
body:`Security people keep a list of the most common ways web apps get broken: the **OWASP Top 10**. The 2025 list starts with **broken access control**, **security misconfiguration** and **software supply chain failures**. You don't need to memorise it. You need these habits.

## 1. Check permissions on the server, every time
Covered in *Accounts and passwords*. It's first on the list because it's the most common.

## 2. Treat everything from outside as untrusted
Anything a person types, uploads or sends (form fields, file names, the URL itself) could be hostile.
- **SQL:** placeholders only (*Databases*).
- **Showing text on a page:** use [[textContent]], or a template system that **escapes** automatically (Flask's templates do). Putting someone's text into [[innerHTML]] lets them insert a [[<script>]] that runs in other people's browsers: **cross-site scripting (XSS)**. The suite's [[esc()]] function in app.js exists for exactly this reason.
- **Files:** check type and size, never use the uploaded file name as a path, and store uploads outside the code folder.
- **Validate on the server.** Checks in the browser are for convenience; anyone can skip them.

## 3. Keep secrets out of code
Passwords, API keys and secret keys go in environment variables or the host's secrets settings. Add [[.env]] to [[.gitignore]] before you create one. If a secret is ever committed, assume it's been seen: **change it** (deleting the commit isn't enough, because copies exist).

## 4. Know what you depend on
Every library you install is code from strangers running inside your app. That's the "supply chain".
- Install only well-known libraries you actually need; check the exact name (fake look-alike packages exist).
- Pin versions in **requirements.txt**, as the suite does.
- Update regularly. GitHub's **Dependabot** can warn you when a library you use has a known hole.

## 5. Configure safely
- Debug mode **off** in production.
- HTTPS only.
- Error pages say "Something went wrong", while the details go to your log.
- Remove sample accounts, default passwords and test routes before launch.

## 6. Limit and log
- **Rate limits** on logins and expensive actions, like the suite's admin lockout.
- **Log** logins, failures and admin actions, so you can tell what happened. But never log passwords, and keep personal data out of logs, as the suite's metrics count jobs but never store names.
- Something should **alert** you when things look wrong, not just record it.

## 7. Plan for things going wrong
Handle errors on purpose (the suite's [[_safe]] wrapper and [[ToolError]] idea), keep backups you've actually tested restoring, and know who you'd tell if data leaked (next module).

## Only test what you own
Learning to find these holes is a real career. But trying them on **someone else's** site, without written permission, is illegal in Canada even if you mean well and change nothing (see *Allowed and not allowed at work*). Practise on your own apps, or on sites built for practising.`,
quiz:[
 {q:"You show a comment someone typed using element.innerHTML = comment. What's the risk?", o:["None","The comment could include a script that runs in every visitor's browser (XSS)","The page will load slowly"], a:1, why:"Use textContent, or escape the text, so it's always shown as text."},
 {q:"You accidentally pushed an API key to GitHub, then deleted the commit. What now?", o:["Nothing, it's gone","Change (rotate) the key immediately: assume someone copied it","Make the repo private and carry on"], a:1, why:"Automated programs scan GitHub for keys within minutes. Deleted commits can survive in forks and caches."},
 {q:"Why pin library versions in requirements.txt?", o:["So every install gets the versions you tested, and updates happen when you choose","Pip requires it","It makes the app smaller"], a:0, why:"Predictable builds; then update on purpose, reading what changed."}
]},

{ id:"on-deploy", title:"Putting an app with a back end online", mins:30, kind:"read",
body:`Static sites go on GitHub Pages. An app with a server and a database needs a **host** that runs your Python code all the time.

## Kinds of hosting
- **Beginner-friendly Python hosts** (for example PythonAnywhere, which has a free beginner tier for one small web app): upload your code, point it at your Flask app, done. Great for learning.
- **Platform hosts** (for example Render, Railway or Fly.io): connect your GitHub repository; every [[git push]] deploys a new version. They add databases with a click.
- **Big cloud providers** (Microsoft Azure, Amazon Web Services, Google Cloud): the most control, the most to configure, and the most ways to run up a bill.

Prices and free tiers change often. Check the current pricing page, and set a **spending limit** or billing alert if the host offers one.

## Before you deploy: a checklist
- Debug mode off; a production server ([[gunicorn]] on Linux hosts, or what the host recommends).
- Secrets set in the host's settings, not in the code.
- [[requirements.txt]] up to date, so the host installs the same libraries.
- A real database the host backs up (SQLite on some hosts is wiped on every deploy: read the host's docs).
- HTTPS on (most hosts do it automatically).
- A way to roll back: platform hosts keep previous deploys; know where the button is.

## Where in the world is the data?
Every host stores data in a **region** (a data centre in a particular country). For practice data it doesn't matter. For real personal information it can matter a lot: some contracts and organisations require Canadian storage, and public bodies must assess storing personal information outside Canada. Find out the rules **before** choosing a host, not after.

## Domains
A host gives you an address like [[gear-board.onrender.com]]. For your own name, rent a domain from a registrar (about the price of a lunch per year for a .ca or .com), then follow the host's "custom domain" steps.

## After launch: it's never finished
- Check it works on a phone and from outside your network.
- Update libraries regularly, and read Dependabot alerts.
- Watch the logs and the bill for the first few weeks.
- Test restoring a backup, before you need it.
- If you stop maintaining it, **take it down** and delete the data. An abandoned app with old libraries is an open door.

## For work: ask first
Before putting anything online that's connected to work (even "just a little tool"), talk to IT. They'll know about approved hosts, single sign-on, where data may be stored, and security reviews. A tool IT approved is one you can rely on and build on. One they found out about later is usually shut down.`,
steps:["Read the getting-started guide of one beginner-friendly Python host","Write a deploy checklist for your gear board","Find out which region the host would store data in"] },

{ id:"on-services", title:"Using other services: APIs, email and AI", mins:25, kind:"read",
body:`Online apps often lean on other companies' services: maps, payments, email, AI. You call their **API** from your server with a **key** that identifies your account (and is usually what they bill).

## Call paid APIs from the server, never the browser
Anything in the browser's JavaScript can be read by any visitor. If you put an API key there, someone will copy it and spend your money. So:
1. The browser calls **your** server ([[/api/summarise]]).
2. Your server checks the person is logged in and allowed.
3. Your server calls the outside API with the key from an environment variable.
4. Your server returns only what the browser needs.

(The Weather app project used an API with no key, which is why it could run in the browser.)

## Read the terms
Every service has **terms of service** that say what you may do: limits on requests, what you may store, whether you may use it for commercial work, and what **they** do with the data you send. Read the data section before sending them anything personal.

## Email from your app
- Use an email-sending service rather than your own mail server.
- In Canada, **CASL** (Canada's anti-spam law) generally requires consent before sending commercial emails, plus your identity and a working unsubscribe link. Messages someone requested (a password reset, a receipt) are treated differently from marketing.

## AI services
Sending text or images to an AI API means sending them to another company's computers.
- **Never send personal information** (names, photos, student data) without your organisation's approval and an agreement that covers it. For the suite's kind of data, that's a firm no.
- Show people when they're dealing with AI, and let a human check decisions that matter.
- AI answers can be wrong. Treat output as a draft to check, never as a fact.

More on all of this in the next module.`,
quiz:[
 {q:"Why must a paid API key never be in the browser's JavaScript?", o:["It slows the page","Any visitor can read it and use your account","Browsers can't send keys"], a:1, why:"Keep it on the server; the browser talks to your server instead."},
 {q:"Your app wants to send photos to an AI service to tag them. What has to happen first?", o:["Nothing, it's just an API","Approval from your organisation, and terms that cover what the service does with the data, before any personal data is sent","Just add HTTPS"], a:1, why:"Sending personal information to another company is a disclosure. For children's photos, the bar is very high."}
]}
]},


{ id:"ethics", title:"Context, law and ethics", blurb:"What you're allowed to build, what you should build, and how to treat the people whose data your code touches.", lessons:[
{ id:"eth-why", title:"Can I? Should I? Questions to ask before you build", mins:15, kind:"read",
body:`Knowing **how** to build something is half the job. The other half is knowing whether you're **allowed** to, and whether you **should**. Every developer who's caused real harm knew how to code. What they missed was this part.

> This module explains the rules in plain language so you know what to look out for and what to ask. It isn't legal advice. Laws change, and your workplace may have stricter rules. When real personal information is involved, check with your manager, your privacy officer or IT, and the official sources linked in each lesson. The facts here were checked in October 2026.

## The questions, before you start
1. **Whose data is this?** Who are the people in it, and did they expect it to be used this way?
2. **Do I need all of it?** What's the least data that still does the job?
3. **Where will it go?** Which computers, which country, which companies (hosts, AI services, email services)?
4. **Who can see it?** In the app, in the logs, in the backups, in Git?
5. **How long will I keep it?** And what deletes it when that time is up?
6. **What happens if it leaks?** Who would be hurt, and how badly?
7. **Am I allowed?** By the law, by contracts (with schools, with customers), by my employer, by the terms of the services I use?
8. **Who could this treat unfairly or leave out?** People with disabilities, people the AI recognises less accurately, people who can't easily say no.
9. **Who needs to know or approve?** Manager, IT, privacy officer, the people affected.

## The suite already answers many of these
Look at the choices in the Artona Digital Suite: everything offline, the AI engine blocked from the network, metrics with counts and never names, real data kept out of Git, previews before anything changes files, and a written rule never to copy student photos or data to cloud tools. None of those were needed to make the code **work**. They were needed to make it **right**. That's what this module is about.

## A habit worth building
Write a short **"data and risks"** section in the README of every project: what personal data it handles, where it's stored, who can see it, how long it's kept, and what you decided not to collect. If it's hard to write, that's a sign to rethink the design before writing code.`,
steps:["Pick one of your projects and answer the nine questions for it","Add a 'Data and risks' section to its README"] },

{ id:"eth-privacy", title:"Privacy law in BC and Canada, in plain words", mins:30, kind:"read",
body:`Canada doesn't have one privacy law. Which one applies depends on **who** holds the information and **where**. Here's the map for someone working in BC.

## FOIPPA: public bodies
BC's **Freedom of Information and Protection of Privacy Act** covers **public bodies**: government ministries, school districts, universities, health authorities, cities.
- It applies to schools' student information. When a company does work for a public body (as a photography company does for a school district), FOIPPA treats that **service provider** much like the public body's own staff, and the contract usually spells out the rules: what the data may be used for, where it may be stored, security, and when it must be returned or destroyed.
- **Data storage outside Canada:** until 2021, FOIPPA generally required personal information to stay in Canada. Amendments passed in November 2021 removed that blanket rule. Public bodies now have to assess the risks before storing or accessing sensitive personal information outside Canada, so for a contractor it's still a contract question: never assume it's allowed.
- **Breaches:** since February 1, 2023, public bodies must notify affected people and BC's privacy commissioner, without unreasonable delay, when a privacy breach could reasonably be expected to cause significant harm. They must also run a privacy management program, including making sure their service providers know their obligations.

## BC PIPA: private organisations in BC
BC's **Personal Information Protection Act** covers businesses and non-profits in BC: for example a company's own records about its staff and its customers.
- Collect, use and share personal information only for purposes a reasonable person would consider appropriate, and generally with **consent**.
- Tell people why you're collecting it.
- Protect it with reasonable security, and keep it only as long as needed.
- People can ask to see the information you hold about them.

## PIPEDA: the federal law
Canada's **Personal Information Protection and Electronic Documents Act** covers private organisations in provinces without their own law, federally regulated businesses (banks, airlines, telecoms), and personal information that crosses provincial or national borders in commercial activity.
- Under PIPEDA, organisations **must** report breaches that create a "real risk of significant harm" to the federal privacy commissioner, notify the people affected, and keep records of every breach.
- **Change is coming, maybe.** In June 2026 the federal government introduced **Bill C-36**, which would replace much of PIPEDA with a new *Protecting Privacy and Consumer Data Act*, with stronger rules for children's information, explanations of automated decisions, and large fines. As of October 2026 it's a bill, not law. Two earlier attempts (Bills C-11 and C-27) died before passing.

## Elsewhere
If your app has users in other places, their laws can apply too: **Quebec's Law 25** is stricter than most of Canada, the **EU's GDPR** applies to people in Europe, and the US has **COPPA** for children under 13 online.

## The principles behind all of them
The details differ, but every privacy law is built on the same ideas. Design with these and you'll rarely be far wrong:
- **Purpose:** know why you collect each piece of data, and use it only for that.
- **Consent:** people agree, knowing what they're agreeing to.
- **Minimum:** collect only what you need.
- **Limited time:** delete it when you no longer need it.
- **Security:** protect it in proportion to how sensitive it is.
- **Openness and access:** people can find out what you hold and see their own information.
- **Accountability:** someone is responsible, and can show what was done.

## Official sources
- [FOIPPA on BC Laws](https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/96165_00)
- [PIPA on BC Laws](https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/03063_01)
- [Office of the Information and Privacy Commissioner for BC](https://www.oipc.bc.ca)
- [Office of the Privacy Commissioner of Canada](https://www.priv.gc.ca)
- [Bill C-36 on the Parliament of Canada site](https://www.parl.ca/DocumentViewer/en/45-1/bill/C-36/first-reading)`,
quiz:[
 {q:"A school district hires a company to take student photos. Which law sets the rules for the students' information?", o:["None: it's a private company","FOIPPA, through the school district, usually spelled out in the contract the company signs","Only the EU's GDPR"], a:1, why:"Student records belong to the public body; its service providers are bound by FOIPPA's rules and the contract."},
 {q:"Since the 2021 FOIPPA changes, can a contractor put a school's student data in any cloud service it likes?", o:["Yes, the storage rule was removed","No: the blanket rule went, but outside-Canada storage now needs a risk assessment, and the contract usually limits it","Only if the cloud service is free"], a:1, why:"The change moved from a ban to an assessment. For a contractor, the contract and the client's approval decide."},
 {q:"Is Bill C-36 law yet (as of October 2026)?", o:["Yes, it replaced PIPEDA in June 2026","No, it was introduced in June 2026 and is still a bill; PIPEDA still applies","It was cancelled"], a:1, why:"Bills only become law after passing Parliament and coming into force."},
 {q:"Which principle says 'don't collect a birth date if you only need to know someone is a grad'?", o:["Openness","Minimum (data minimisation)","Access"], a:1, why:"The less you hold, the less can be misused or leaked."}
]},

{ id:"eth-kids", title:"Children, photos and faces", mins:25, kind:"read",
body:`School photography combines three of the most sensitive kinds of information there are: **children**, **images of them**, and **faces**, which can be turned into biometric data. That's why the suite is built the way it is.

## Children's information
- Children can't always understand or refuse what happens to their data, so the law and regulators expect **extra care**.
- Canada's federal privacy commissioner's position is that, in all but exceptional cases, consent for children under 13 should come from a parent or guardian.
- Bill C-36 (not yet law) would define a child as anyone under 18 and make children's best interests a factor regulators must weigh. The direction is clear: more protection, not less.

## Photos
- A photo of a person is personal information. A photo with a name, school and grade attached is much more so.
- Photos can reveal more than intended: location, routines, disabilities, family situations, a child in a custody dispute who must not be found. Some families opt out for serious reasons. Respect every opt-out in your code, and make it impossible to miss.
- **Copyright** in a photo is separate from **privacy**: the photographer (or their employer) may own the image, but that doesn't give anyone the right to use the person's image for any purpose.

## Faces and biometrics
Face matching turns a face into numbers that can identify that person anywhere. That's **biometric information**.
- In August 2025 the federal privacy commissioner issued guidance for businesses on biometrics: biometric data that identifies a person is treated as **sensitive**, **express consent** is generally expected, and organisations should collect only what's needed, limit how long it's kept, secure it strongly, check the system is **accurate and fair across different groups of people**, and consider a privacy impact assessment first.
- Face-matching systems can be **less accurate** for some groups (for example by age or skin tone). A mistake isn't just a wrong file: it's a photo of one child sent to another child's family.

## What the suite does right, and why
- **Offline only**, with the network blocked in the AI engine: no photo or face data can leave the building.
- **Confidence scores and human review** in SD Match and Bndl: the AI suggests, a person decides.
- **Counts, not names,** in metrics and feedback.
- **Real data never in Git**, never in screenshots, never staged to cloud tools.
- **Purge old seasons:** data is deleted when it's no longer needed.

## Rules for your own projects
- Practise only on **fake data** or on photos of consenting adults who know what the project is.
- Never train an AI model on children's photos without explicit approval from the organisation responsible and a clear legal basis.
- Never put children's photos or data into an online tool (including AI chat tools) unless your organisation has approved that specific tool for that data.
- When in doubt, don't. Ask first.

## Official sources
- [Office of the Privacy Commissioner of Canada](https://www.priv.gc.ca): search for "biometrics" and "children"
- [Office of the Information and Privacy Commissioner for BC](https://www.oipc.bc.ca)`,
quiz:[
 {q:"Why does SD Match show a confidence score and let a person reject a match?", o:["Scores look professional","Face matching can be wrong, sometimes more for some groups of people, and a wrong match sends one child's photo to another family","It's required by PyInstaller"], a:1, why:"The AI suggests; a person who can see the photos decides."},
 {q:"You want to train a better PNG Cleaner model. Which training photos are fine to use without special approval?", o:["Last season's student photos, since we already have them","Photos you made yourself of objects and consenting adults, or fake data","Any photos found online"], a:1, why:"Using children's photos for a new purpose (training AI) needs explicit approval and a legal basis."},
 {q:"A family has opted out of the yearbook. What should your code do?", o:["Include them unless someone notices","Make the opt-out impossible to miss: exclude them by default and flag it clearly","Ask the child"], a:1, why:"Opt-outs can be for serious safety reasons; the code must respect them every time."}
]},

{ id:"eth-breach", title:"When something goes wrong", mins:20, kind:"read",
body:`A **privacy breach** is any time personal information is seen, shared, lost or changed by someone who shouldn't have it. Most breaches aren't hackers. They're ordinary mistakes:
- an email with a class list sent to the wrong school
- a USB stick or laptop lost
- a folder shared with "anyone with the link"
- real data pushed to a public GitHub repository
- a screenshot with names in it posted in a help forum or pasted into a chat tool
- a bug that shows one family another family's photos

## What to do, in order
1. **Contain it.** Stop it getting worse: recall the email, remove the link, make the repo private, change the password.
2. **Tell someone immediately.** Your manager and your organisation's privacy contact. Not tomorrow, not after you've fixed it. Organisations often have legal deadlines, and contracts with clients (like school districts) usually require prompt notice.
3. **Don't delete the evidence.** Write down what happened, when, what data, how many people. Others need this to decide what to do.
4. **Let the people responsible decide** about notifying the affected families and the regulator.
5. **Fix the cause**, then add a check so it can't happen the same way again (a test, a confirm step, a .gitignore rule).

## What the law requires (as of October 2026)
- **Public bodies (FOIPPA):** must notify affected people and BC's privacy commissioner when a breach could reasonably be expected to cause significant harm. Breaches at a service provider affect the public body, which is why contracts require contractors to report quickly.
- **Federal PIPEDA:** organisations must report breaches with a real risk of significant harm to the federal commissioner, notify the people affected, and keep a record of every breach, even small ones.
- **BC PIPA:** organisations must protect personal information with reasonable security. BC's privacy commissioner has long called for mandatory breach reporting to be added to PIPA; check the current rules and your organisation's policy.

## The most important point
**Telling someone quickly is never the wrong choice.** Hiding a mistake turns an accident into misconduct, and leaves the people affected unprotected. Good teams treat a reported mistake as useful information, and fix the system rather than blame the person.`,
quiz:[
 {q:"You notice a test file with real student names was pushed to GitHub an hour ago. What's first?", o:["Delete the file quietly and hope nobody saw","Make the repository private (contain it), then tell your manager or privacy contact right away","Wait until you're sure someone saw it"], a:1, why:"Contain, then report. The people responsible decide what else is needed."},
 {q:"Why does a contractor's breach matter to the school district?", o:["It doesn't","The district is responsible for its students' information, so it may have to notify families and the commissioner","Only because of bad press"], a:1, why:"That's why contracts require service providers to report breaches quickly."}
]},

{ id:"eth-ip", title:"Who owns the code you write? Copyright and licences", mins:25, kind:"read",
body:`## Code you write at work
In Canada, unless an agreement says otherwise, the **employer** generally owns the copyright in work an employee creates as part of their job. Code you write for work tools, at work, for work, is very likely your employer's, even if you wrote it on your own time or with AI help. Check your employment agreement and any company policy.

What that means in practice:
- **Don't publish work code publicly** (a public GitHub repo, a forum, a blog post) without permission. That's why the suite's repository is **private**, and why the public copy of this course leaves out the walkthroughs of the suite's real code.
- **Don't take it with you** when you leave.
- Even when code isn't secret, it can **reveal** things: server names, drive letters, folder layouts, how security works. That information helps attackers.
- What you **learned** is yours: the skills, the patterns, the understanding. You can build your own apps with the same ideas, written fresh.

## Using other people's code
Code on GitHub isn't free to use just because you can see it. Its **licence** says what you may do:
- **No licence at all:** you may read it, but you have no permission to copy or reuse it.
- **MIT, BSD, Apache 2.0** ("permissive"): use it almost any way you like, including at work, as long as you keep the copyright and licence notice.
- **GPL** ("copyleft"): if you distribute software that includes GPL code, your software generally has to be released under the GPL too. Ask before using GPL code in work software.
- The same goes for **fonts, icons, images and AI models**: each has a licence. The fonts in this course (Atkinson Hyperlegible and JetBrains Mono) are under the SIL Open Font License, which allows use in apps.

Keep a short list in your README of the libraries and assets you use and their licences. Check before you add one, not after.

## Code from AI tools
AI tools can produce code that closely matches existing code under a licence, and the law on AI-generated code is still developing. Treat AI suggestions like code from a stranger: understand every line, and don't paste in large chunks you can't explain. At work, follow your organisation's rules on which AI tools are allowed.

## Photos and other content
- Photos are protected by copyright from the moment they're taken. Don't use images from the web in your apps unless the licence allows it.
- Copying data from other websites automatically ("scraping") may break their terms of service, copyright or privacy law, even if the data is visible to anyone. Check first.

## Choosing a licence for your own projects
For your personal projects on GitHub, pick a licence so others know what they may do. [choosealicense.com](https://choosealicense.com) explains the options. MIT is a common choice for small projects.

## Official sources
- [Copyright Act on the Justice Laws website](https://laws-lois.justice.gc.ca/eng/acts/C-42/)`,
quiz:[
 {q:"You wrote a great tool at work. Can you put it on your public GitHub to show future employers?", o:["Yes, you wrote it","Not without your employer's permission: it's very likely theirs. You can build your own version from scratch to show your skills","Only if you remove the comments"], a:1, why:"Work done as part of your job usually belongs to the employer. Your skills and understanding are yours."},
 {q:"A GitHub repo has no LICENSE file. Can you copy its code into your app?", o:["Yes, it's public","No: without a licence you have no permission to reuse it","Only for apps under 100 lines"], a:1, why:"Public to read isn't the same as free to use."},
 {q:"You want to use an MIT-licensed library in a work tool. What do you have to do?", o:["Nothing","Keep its copyright and licence notice","Pay a fee"], a:1, why:"MIT is permissive; its one main condition is keeping the notice."}
]},

{ id:"eth-access", title:"Accessibility: apps everyone can use", mins:25, kind:"read",
body:`About one in four Canadians aged 15 and over has a disability. Some can't see the screen, some can't use a mouse, some find small or low-contrast text hard to read, and some are just tired, on a phone in the sun, or holding a coffee. **Accessible** design works for all of them, and it's usually better design for everyone.

You've felt this yourself: an unreadable font or a box you can't see is a real barrier, not a matter of taste. That's why this course switched to a font designed for legibility and to visible borders and contrast.

## The standard: WCAG
The **Web Content Accessibility Guidelines** (WCAG) are the international standard. Most organisations aim for **WCAG 2.2, level AA**. In BC, the *Accessible British Columbia Act* requires many public organisations, including school districts, to have an accessibility plan for finding and removing barriers, and websites and apps are part of that.

## The checks that catch most problems
1. **Use the keyboard only.** Press Tab through the page. Can you reach and use every button and link? Can you see where you are (a visible focus outline)?
2. **Contrast.** Normal text needs a contrast ratio of at least 4.5 to 1 against its background. Light grey on white usually fails. Browser developer tools show the ratio when you inspect text.
3. **Real elements.** A [[<button>]] works with keyboards and screen readers for free. A clickable [[<div>]] doesn't.
4. **Labels.** Every form field has a [[<label>]]. Every meaningful image has [[alt]] text describing it; decorative images get [[alt=""]].
5. **Headings in order.** One [[<h1>]], then [[<h2>]] sections, so screen-reader users can jump around.
6. **Don't rely on colour alone.** "Errors are in red" fails for colour-blind people. Add an icon or words.
7. **Zoom to 200%.** Nothing should overlap or get cut off.
8. **Plain language.** Short sentences, familiar words, instructions that say exactly what to do. (The suite's error messages are a good example: they say what went wrong and what to do next.)

## Try a screen reader
{{On a Mac, press Cmd + F5 to start VoiceOver, and again to stop it.|On Windows, press Windows + Ctrl + Enter to start Narrator, and again to stop it.}} Listen to one of your own pages. It's the fastest way to understand why the rules exist.

## Official sources
- [WCAG overview from the W3C](https://www.w3.org/WAI/standards-guidelines/wcag/)`,
steps:["Tab through your About Me site with the keyboard only","Check the contrast of your body text in the developer tools","Listen to one of your pages with a screen reader","Fix the three biggest problems you found"] },

{ id:"eth-ai", title:"Using AI responsibly, as a builder and a user", mins:20, kind:"read",
body:`AI shows up in two ways in your work: **inside** apps (the suite's QR reader, PNG Cleaner, face matching, photo tags) and as a **tool** you use while building (chat assistants, code helpers). Both need care.

## When you use AI tools
- **What you paste in leaves your computer.** Never paste personal information, student data, photos, passwords or work secrets into an AI tool unless your organisation has approved that tool for that kind of data. Replace real names and paths with made-up ones first.
- **It can be confidently wrong.** Check facts against official sources; run code and read it before you trust it.
- **You're still responsible.** "The AI wrote it" isn't an excuse for a bug, a leak or copied code.
- **Learn, don't outsource your understanding.** This course exists so you can tell whether an AI's answer is right.

## When you build AI into an app
- **Be honest about it.** Tell people when AI is involved, especially if it affects them.
- **Keep a human in charge of decisions that matter.** The suite's matching tools suggest; a person confirms. Bill C-36 (not yet law) would give people a right to an explanation of automated decisions and to have a human review them; designing that way now is good practice anyway.
- **Measure mistakes, including by group.** Test on varied examples. If it's less accurate for some people, that's a fairness problem, not just a number.
- **Mind the training data.** Where did it come from? Did people agree to that use? Does it contain personal information?
- **Keep it proportionate.** Don't add face recognition where a QR code or a checklist would do.

## Laws to know about
- Canada doesn't have a general AI law yet. The proposed *Artificial Intelligence and Data Act* died with Bill C-27 in early 2025. But privacy laws already apply to the personal information AI uses, and the federal commissioner's biometrics guidance applies to face recognition.
- The **EU AI Act** applies to AI systems used in Europe, with the strictest rules for high-risk uses, and it's influencing rules elsewhere.`,
quiz:[
 {q:"You're stuck on a bug in a tool that processes class lists. What's safe to paste into an AI chat tool?", o:["The real class list, so it can see the problem","The code, with a few made-up rows that show the same problem, and no real paths or names","A screenshot of the tool with real names"], a:1, why:"Recreate the problem with fake data. That's also good debugging practice."},
 {q:"Why does a human confirm face matches in the suite?", o:["It's faster","AI makes mistakes, and decisions that affect people should be checked by a person who can see the evidence","The AI is too slow"], a:1, why:"Human review catches errors and keeps someone accountable."}
]},

{ id:"eth-work", title:"Allowed and not allowed at work", mins:20, kind:"read",
body:`Building tools at work is a great way to learn, and it's how the suite started. These rules keep it a good thing for you and your employer.

## Ask before, not after
- **Tell your manager and IT** what you're building and what data it touches. Tools built in secret ("shadow IT") get shut down when found, and you carry the risk if something goes wrong.
- **Use approved places** for code (like the suite's private repository) and approved tools and services.
- **Get approval** before connecting anything to the internet, adding a login, or using a new cloud or AI service with work data.

## Only access what you're authorised to access
- Using a computer system without authorisation, or with intent to get around its security, is a crime in Canada under **section 342.1 of the Criminal Code**, even if you don't change or take anything. "I was only testing" or "I was trying to help" isn't permission.
- Only test security on your own projects, or with **written** permission that says exactly what you may test.
- If you find a security hole in a work system, **report it** to IT, privately, and don't explore further.
- Don't use a coworker's login or let them use yours. Logs and accountability depend on it.

## Respect the data
- Use real data only for the job it was collected for. Curiosity isn't a reason to open records.
- Practise and test with **fake data**, as this course does.
- Keep data on work systems. Don't email it to yourself or copy it to personal devices or cloud storage.

## Be honest about what your code does
- Metrics should measure what they claim. Don't inflate "time saved".
- Document limits and known problems (as the walkthroughs of the suite's code did with the admin password and the offline block).
- If a tool you built made a mistake that affected people, say so (see *When something goes wrong*).

## Look after your future self and your team
- Write down how things work: READMEs, design notes, comments that say **why**. The suite's DESIGN.md and README_FIRST.txt are good models.
- Make sure someone else could keep your tool running if you were away.
- Keep the code in the employer's systems, so it doesn't leave when a person does.

## Official sources
- [Criminal Code section 342.1 on the Justice Laws website](https://laws-lois.justice.gc.ca/eng/acts/C-46/section-342.1.html)`,
quiz:[
 {q:"You notice a shared drive's permissions let anyone read HR files. What should you do?", o:["Look through them to see how bad it is","Report it to IT privately, without opening the files","Post about it in the team chat"], a:1, why:"Report, don't explore. Opening the files would be unauthorised access, even with good intentions."},
 {q:"You want to try a new AI image tool on last season's photos to see if it works better. What's the right first step?", o:["Try it on a few photos","Ask your manager and IT whether that tool is approved for that data; test it on fake or consenting-adult photos meanwhile","Use your personal account so it isn't work's problem"], a:1, why:"Approval comes first for real data. Personal accounts make it worse, not better."}
]}
]},

{ id:"ship", title:"Shipping and what's next", blurb:"Put things online and keep growing on your own.", lessons:[
{ id:"ship-web", title:"Put a website online", mins:20, kind:"read",
body:`A website on your computer is only for you. **Deploying** puts it on a server so anyone can visit it. For sites made of HTML, CSS and JavaScript files, free hosting is easy.

## Option 1: GitHub Pages
If your project is already on GitHub:
1. Open the repository on github.com and go to **Settings > Pages**.
2. Under **Build and deployment**, choose **Deploy from a branch**.
3. Pick **main** and **/ (root)**, then **Save**.

After a minute or two your site is live at [[https://your-name.github.io/repo-name/]]. Every [[git push]] updates it.

## Option 2: Netlify Drop
Go to [app.netlify.com/drop](https://app.netlify.com/drop) and drag your project folder onto the page. It's online in seconds. Make a free account to keep it and update it later.

## Projects with a build step
If you used Vite or a framework, the browser can't run your source files directly. Build first:
~~~sh
npm run build
~~~
That creates a [[dist]] folder of plain files. Deploy that folder, not your source.

> Before you share a link, open it on your phone. It's the quickest test that your responsive CSS and file paths work on a real server.`,
steps:["Publish your About Me page (or any project) with GitHub Pages or Netlify","Open the live link on your phone"] },

{ id:"next", title:"What to learn next", mins:15, kind:"read",
body:`If you've worked through everything here and built the projects, you can plan an app, build it, debug it, look things up, and ship it to the web or the desktop. That's the core of the job.

## You're independent when…
- You can go from an idea to a written plan to a working first version on your own.
- When something breaks, you reach for DevTools and the error message before anything else.
- You can learn something new from its documentation.
- You finish things, even small things.

## The most important next step
**Build three more apps of your own.** Not tutorials: your ideas, your plans. You'll learn more from one finished project than from ten courses.

## Then, depending on what you want to build
- **A database**: for tools that need to remember a lot, Python's built-in **sqlite3** stores data in a single file, with no server.
- **More computer vision**: training your own detection model (like the PNG Cleaner's), with the same offline and privacy rules.
- **TypeScript**: JavaScript with types, which catches whole categories of bugs before you run anything.
- **A framework in depth**: React is the safest bet for jobs and resources.
- **Testing**: code that checks your code, so changes don't quietly break things.
- **Accessibility**: making apps everyone can use, including with keyboards and screen readers.

## Free resources worth bookmarking
- [MDN Web Docs](https://developer.mozilla.org): the reference for everything web
- [javascript.info](https://javascript.info): the deepest free JavaScript guide
- [The Odin Project](https://www.theodinproject.com): a full free curriculum with projects
- [freeCodeCamp](https://www.freecodecamp.org): exercises and certifications
- [web.dev](https://web.dev/learn): CSS, accessibility and performance courses
- [Python tutorial](https://docs.python.org/3/tutorial/): the official guide to the language
- [pandas getting started](https://pandas.pydata.org/docs/getting_started/): spreadsheets and data in Python
- [pywebview docs](https://pywebview.flowrl.com): the window library the suite uses
- [Real Python](https://realpython.com): clear tutorials on almost every Python topic

## A word on AI tools later
Once you can build without it, AI can be a useful helper, much like a fast colleague. Use it to explain things and review your code, and read every line it suggests until you understand it. The skills you've built here are what let you tell whether its answers are right.`,
steps:["Write the plan for your next app","Pick one 'next' topic and find its official getting-started guide"] }
]}
];

 "dom-create": "<style>\n  body { font-family: system-ui, sans-serif; }\n  .add { display: flex; gap: 8px; margin-bottom: 12px; }\n  input { flex: 1; padding: 8px; font-size: 1rem; }\n  li { padding: 4px 0; }\n<\/style>\n\n<div class=\"add\">\n  <input id=\"new-todo\" placeholder=\"What needs doing?\">\n  <button id=\"add\">Add<\/button>\n<\/div>\n<ul id=\"list\"><\/ul>\n\n<script>\n  const todos = [];\n  const input = document.querySelector(\"#new-todo\");\n  const list = document.querySelector(\"#list\");\n\n  function render() {\n    list.innerHTML = \"\";\n    for (const todo of todos) {\n      const li = document.createElement(\"li\");\n      li.textContent = todo;\n      list.append(li);\n    }\n  }\n\n  document.querySelector(\"#add\").addEventListener(\"click\", () => {\n    const text = input.value.trim();\n    if (text === \"\") return;\n    todos.push(text);\n    input.value = \"\";\n    render();\n  });\n<\/script>\n",
 "html-links": "<h1>My favourite sites<\/h1>\n<p>The best place to look things up:\n  <a href=\"https://developer.mozilla.org\" target=\"_blank\">MDN Web Docs<\/a>\n<\/p>\n\n<img src=\"mountains.svg\" alt=\"A blue illustration of mountains under a yellow sun\" width=\"240\">\n"
};

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function inline(s){
  s = esc(s);
  s = s.replace(/\[\[(.+?)\]\](?!\])/g, "<code>$1</code>");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*<>\s][^*<>]*?)\*/g, "<em>$1</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\{\{K\}\}/g, '<kbd class="os-mac">Cmd</kbd><kbd class="os-win">Ctrl</kbd>');
  s = s.replace(/\{\{([^|}]*)\|([^}]*)\}\}/g, '<span class="os-mac">$1</span><span class="os-win">$2</span>');
  return s;
}
const LANG_LABEL = {mac:"Terminal · Mac", win:"PowerShell · Windows", sh:"Terminal", js:"JavaScript", html:"HTML", css:"CSS", json:"JSON", text:""};
function codeBlock(code, lang, copy){
  const cls = lang==="mac" ? " os-mac" : lang==="win" ? " os-win" : "";
  const label = LANG_LABEL[lang] !== undefined ? LANG_LABEL[lang] : (lang||"");
  let html = esc(code);
  if(lang==="mac"||lang==="win"||lang==="sh") html = html.replace(/(#[^\n]*)/g, '<span class="c-cmt">$1</span>');
  return '<div class="code-block'+cls+'">'+(label?'<span class="code-label">'+label+'</span>':'')+(copy!==false?'<button class="copy" type="button">Copy</button>':'')+'<pre><code>'+html+'</code></pre></div>';
}
function md(src){
  const lines = String(src).replace(/^\n+|\s+$/g,"").split("\n"); const out = []; let i = 0;
  const isBlock = l => /^(## |> |- |~~~|:::|\d+\. )/.test(l);
  while(i < lines.length){
    const l = lines[i];
    if(/^::: (mac|win)\s*$/.test(l)){ const os = l.slice(4).trim(); const buf = []; i++; while(i<lines.length && lines[i].trim() !== ":::"){ buf.push(lines[i]); i++; } i++; out.push('<div class="os-'+os+'">'+md(buf.join("\n"))+'</div>'); continue; }
    if(l.startsWith("~~~")){ const lang = l.slice(3).trim(); const buf = []; i++; while(i<lines.length && !lines[i].startsWith("~~~")){ buf.push(lines[i]); i++; } i++; out.push(codeBlock(buf.join("\n"), lang)); continue; }
    if(!l.trim()){ i++; continue; }
    if(l.startsWith("## ")){ out.push("<h3>"+inline(l.slice(3))+"</h3>"); i++; continue; }
    if(l.startsWith("> ")){ const buf=[]; while(i<lines.length && lines[i].startsWith("> ")){ buf.push(lines[i].slice(2)); i++; } out.push('<aside class="tip">'+inline(buf.join(" "))+'</aside>'); continue; }
    const cont = () => { const extra = []; while(i<lines.length && lines[i].trim() && !isBlock(lines[i])){ extra.push(inline(lines[i])); i++; } return extra.length ? "<br>" + extra.join("<br>") : ""; };
    if(/^- /.test(l)){ const buf=[]; while(i<lines.length && /^- /.test(lines[i])){ const t = inline(lines[i].slice(2)); i++; buf.push("<li>"+t+cont()+"</li>"); } out.push("<ul>"+buf.join("")+"</ul>"); continue; }
    if(/^\d+\. /.test(l)){ const start = parseInt(l, 10); const buf=[]; while(i<lines.length && /^\d+\. /.test(lines[i])){ const t = inline(lines[i].replace(/^\d+\. /,"")); i++; buf.push("<li>"+t+cont()+"</li>"); } out.push("<ol"+(start>1?' start="'+start+'"':"")+">"+buf.join("")+"</ol>"); continue; }
    const buf=[]; while(i<lines.length && lines[i].trim() && !isBlock(lines[i])){ buf.push(lines[i]); i++; }
    let p = buf.join(" "), cls = "";
    if(p.startsWith("[mac] ")){ cls=' class="os-mac"'; p=p.slice(6); } else if(p.startsWith("[win] ")){ cls=' class="os-win"'; p=p.slice(6); }
    out.push("<p"+cls+">"+inline(p)+"</p>");
  }
  return out.join("\n");
}

function fmtValue(v){
  try{
    if(typeof v==="string") return v;
    if(v===undefined) return "undefined";
    if(v===null) return "null";
    if(typeof v==="function") return "ƒ "+(v.name||"anonymous")+"()";
    if(v instanceof Error) return v.name+": "+v.message;
    if(typeof Element!=="undefined" && v instanceof Element) return "<"+v.tagName.toLowerCase()+(v.id?"#"+v.id:"")+">";
    if(typeof v==="object") return JSON.stringify(v);
    return String(v);
  }catch(e){ return String(v); }
}
function frameBoot(R, fmt){
  var logs = window.__labLogs = [], errs = window.__labErrs = [];
  function send(t,d){ try{ parent.postMessage({__lab:1, rid:R, t:t, d:d}, "*"); }catch(e){} }
  window.__labSend = send;
  window.alert = function(m){ logs.push(String(m)); send("log",{k:"info", a:"alert: " + fmt(m) + "  (pop-up messages appear here in the playground)"}); };
  window.confirm = function(m){ send("log",{k:"info", a:"confirm: " + fmt(m) + "  (the playground answers Cancel)"}); return false; };
  window.prompt = function(m){ send("log",{k:"info", a:"prompt: " + fmt(m) + "  (pop-up questions don't work in the playground; use an <input> instead)"}); return null; };
  window.addEventListener("submit", function(e){ if(!e.defaultPrevented){ e.__labPrevented = true; e.preventDefault(); send("log",{k:"info", a:"The form was submitted. On a real page this reloads the page and clears it; the playground stopped that so your page stays put."}); } });
  ["log","info","warn","error"].forEach(function(k){
    var o = console[k];
    console[k] = function(){ var a = Array.prototype.map.call(arguments, fmt).join(" "); (k==="error"?errs:logs).push(a); send("log",{k:k,a:a}); try{ o.apply(console, arguments); }catch(e){} };
  });
  window.addEventListener("error", function(e){ var m = e.message || "Error"; errs.push(m); send("log",{k:"error", a:m, line:e.lineno||0}); });
  window.addEventListener("unhandledrejection", function(e){ var r = e.reason; var m = (r && r.message) ? (r.name||"Error")+": "+r.message : String(r); errs.push(m); send("log",{k:"error", a:"Uncaught (in promise) "+m}); });
  document.addEventListener("click", function(e){
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
    if(a){ var h = a.getAttribute("href") || ""; if(h.charAt(0) !== "#"){ e.preventDefault(); send("log",{k:"info", a:"Link clicked: "+a.href+" (links don't open inside the playground, but would on a real page)"}); } }
  }, true);
}
function workerBoot(fmt){
  var logs = self.__labLogs = [], errs = self.__labErrs = [];
  self.alert = function(m){ logs.push(String(m)); postMessage({t:"log", d:{k:"info", a:"alert: " + fmt(m)}}); };
  self.prompt = function(m){ postMessage({t:"log", d:{k:"info", a:"prompt() needs a web page. Use the HTML playground and an <input> instead."}}); return null; };
  ["log","info","warn","error"].forEach(function(k){
    console[k] = function(){ var a = Array.prototype.map.call(arguments, fmt).join(" "); (k==="error"?errs:logs).push(a); postMessage({t:"log", d:{k:k, a:a}}); };
  });
  self.addEventListener("error", function(e){ errs.push(e.message || "Error"); });
  self.addEventListener("unhandledrejection", function(e){ var r = e.reason; var m = (r && r.message) ? (r.name||"Error")+": "+r.message : String(r); errs.push(m); postMessage({t:"log", d:{k:"error", a:"Uncaught (in promise) "+m}}); e.preventDefault(); });
  setTimeout(function(){ postMessage({t:"alive"}); }, 0);
}
const HELPERS = "const Q=s=>document.querySelector(s),QA=s=>Array.from(document.querySelectorAll(s)),STY=(el,p)=>el?getComputedStyle(el)[p]:'',PX=(el,p)=>parseFloat(STY(el,p))||0,TXT=el=>el?el.textContent.trim():'',SAME=(a,b)=>JSON.stringify(a)===JSON.stringify(b),NEAR=(a,b,t)=>typeof a==='number'&&Math.abs(a-b)<=(t||0.01);const LOGS=self.__labLogs||[],ERRS=self.__labErrs||[];const F=m=>({fail:m}),SHOW=v=>{try{return v===undefined?'undefined':JSON.stringify(v)}catch(e){return String(v)}};";
const RUNNER = "const out=[];for(const c of CHECKS){let ok=false;try{const v=await c();ok=(v&&typeof v==='object'&&'fail' in v)?String(v.fail):!!v}catch(e){ok='Checking this caused an error in your code: '+((e&&e.message)||e)}out.push(ok)}";

function makeBench(mount, o){

    '<div class="console" role="log" aria-live="polite"><div class="c-empty">'+(isHtml?"console.log() output and errors appear here.":"Press Run to see what your code prints.")+'</div></div>'+
   '</div>';
  const ta = mount.querySelector("textarea"), gutter = mount.querySelector(".gutter"), con = mount.querySelector(".console");
  const frame = mount.querySelector("iframe"), pwrap = mount.querySelector(".preview-wrap");
  ta.value = o.code;
  let rid = 0, worker = null, timers = [], escaped = false, live = null, pendingChecks = null;

  function lines(){ const n = ta.value.split("\n").length; let s = ""; for(let i=1;i<=n;i++) s += i + "\n"; gutter.textContent = s; }
  lines();
  ta.addEventListener("scroll", () => { gutter.scrollTop = ta.scrollTop; });
  function insert(text){
    ta.focus();

  });

  function clearCon(){ con.innerHTML = ""; }
  function print(kind, text, line){

    stop(); const my = ++rid; const code = ta.value; const checks = withChecks ? (o.checks||[]) : [];

    if(o.prelude) pre += o.prelude + "\n";
    if(checks.length) pre += "setTimeout(async function(){" + checkSource(checks, code) + RUNNER + "postMessage({t:'check',d:out})}," + (o.delay||30) + ");\n";

    }, 3000));

  };

    const codeFile = () => [{ name: L.mode === "js" ? "script.js" : "index.html", lang: L.mode === "js" ? "js" : "html", text: S.code[L.id] != null ? S.code[L.id] : L.starter }];
    const lessonGlobals = L.prelude ? (L.prelude.match(/function\s+([A-Za-z_$][\w$]*)/g) || []).map(x => x.replace(/function\s+/, "")) : [];
    async function showLint(){

      return offlineReport(f, L.checks.map((c,i) => ({ label:c[0], ok:res[i] === true, reason: typeof res[i] === "string" ? res[i] : "" })), "");

        const passed = res.filter(x => x === true).length;

        showLint();

    let hintN = 0; const hintsEl = document.getElementById("hints"), hb = document.getElementById("btnHint");

      const t = { label: "Lesson exercise: " + L.title + " — " + L.task.replace(/\[\[|\]\]/g,""), requirements: L.checks.map(c => c[0].replace(/\[\[|\]\]/g,"")),
        checks: lastResults ? L.checks.map((c,i) => (lastResults[i] === true ? "PASS: " : "FAIL (" + lastResults[i] + "): ") + c[0].replace(/\[\[|\]\]/g,"")).join("; ") : "",
        context: L.mode === "js" ? "This code runs as plain JavaScript (no web page). Its console output is what counts." + (L.prelude ? " A helper is already defined for the learner: " + L.prelude : "") : "This is the inside of a web page's body (HTML, with <style> and <script> tags).",
        note: "", mode: "coach", files: [{ name: L.mode === "js" ? "script.js" : "index.html", text: code }], images: [], previous: prev ? summarizeForResubmit(prev.result) : "" };
      const r = await runReview(t, document.getElementById("fbStatus"), document.getElementById("fbOut"), btnEl, {inLesson:true});
      if(r) saveReview({ id:"r"+Date.now(), at:Date.now(), target:"lesson:"+L.id, label:L.title, files:[t.files[0].name], mode:"coach", result:r });
    };
    document.getElementById("btnFb").addEventListener("click", async e => {
      const btn = e.currentTarget, out = document.getElementById("fbOut"), st = document.getElementById("fbStatus");

  }

   '<div class="unstuck-grid"><ol class="ladder">'+

    '<li><h3>Say exactly what\'s wrong</h3><p>"It doesn\'t work" isn\'t enough. Write: "I expected the list to show 3 items. It shows none and there\'s no error."</p></li>'+

function sampleErrorCopy(code){
  if(code === "not_granted" || code === "sampling_disabled" || code === "not_declared" || code === "capability_disabled" || code === "capability_removed"){ SAMPLE_BLOCKED = true; return "Help from Claude is turned off for this page. You can allow it from the page's Permissions menu."; }
  if(code === "rate_limited") return "You've hit a usage limit for now. Try again in a little while.";
  if(code === "session_expired") return "Your Claude session expired. Sign in again, then retry.";
  if(code === "prompt_too_large") return "That's too much code to review at once. Remove files that aren't part of the assignment and try again.";
  if(code === "image_rejected") return "One of the screenshots couldn't be used. Try a PNG or JPEG, or fewer images.";
  if(code === "invalid_json" || code === "empty_completion") return "The answer came back garbled. Please try again.";
  if(code === "refused") return "Claude couldn't answer that. Try rewording it, or check you added your code files.";
  return "Something went wrong reaching Claude. Check your internet connection and try again.";
}
